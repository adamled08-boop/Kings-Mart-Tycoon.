<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>King's Mart Tycoon</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#101820;
  color:#fff;
}

button{
  font-family:inherit;
  cursor:pointer;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:#80ad65;
}

/* ================= TOP HUD ================= */

#topBar{
  position:absolute;
  z-index:200;
  left:0;
  top:0;
  width:100%;
  height:68px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  background:#121c23;
  border-bottom:3px solid #31434d;
  box-shadow:0 4px 12px #0007;
}

.logo{
  min-width:185px;
  color:#ffd447;
  font-weight:1000;
  font-size:19px;
}

.stat{
  height:48px;
  min-width:96px;
  padding:5px 9px;
  border-radius:9px;
  background:#1e2c34;
  border:1px solid #3a505c;
}

.stat small{
  display:block;
  color:#9fb0b9;
  font-size:9px;
  text-transform:uppercase;
}

.stat strong{
  display:block;
  margin-top:3px;
  font-size:15px;
}

#companyName{
  color:#ffd447;
}

/* ================= WORLD ================= */

#world{
  position:absolute;
  left:0;
  top:68px;
  width:100%;
  height:calc(100% - 128px);
  overflow:hidden;
  background:#80ad65;
}

/* subtle low-poly ground */

.groundPatch{
  position:absolute;
  background:#76a55d;
  clip-path:polygon(5% 15%,92% 3%,100% 82%,12% 100%);
  opacity:.65;
}

.gp1{
  left:2%;
  top:4%;
  width:25%;
  height:25%;
}

.gp2{
  left:21%;
  top:63%;
  width:27%;
  height:29%;
}

.gp3{
  left:39%;
  top:5%;
  width:17%;
  height:22%;
}

.gp4{
  right:1%;
  top:35%;
  width:25%;
  height:27%;
}

/* ================= RIVER ================= */

#river{
  position:absolute;
  z-index:8;
  left:57%;
  top:0;
  width:13%;
  height:100%;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 20px,
      #ffffff18 20px 22px
    ),
    linear-gradient(
      90deg,
      #3a92bd,
      #58b6db,
      #3d96bd
    );
  border-left:5px solid #287da5;
  border-right:5px solid #287da5;
}

.riverLabel{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-90deg);
  white-space:nowrap;
  color:#d8f5ff;
  opacity:.7;
  font-size:12px;
  font-weight:bold;
  letter-spacing:4px;
}

/* ================= ROADS ================= */

.road{
  position:absolute;
  z-index:12;
  background:#454a4d;
}

.horizontal{
  left:0;
  width:100%;
  height:58px;
}

.vertical{
  top:0;
  width:58px;
  height:100%;
}

.h1{top:21%}
.h2{top:51%}
.h3{top:77%}

.v1{left:17%}
.v2{left:39%}
.v3{left:51%}
.v4{left:76%}
.v5{left:89%}

.horizontal::after{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  height:2px;
  background:repeating-linear-gradient(
    90deg,
    #eadb81 0 28px,
    transparent 28px 52px
  );
}

.vertical::after{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:2px;
  height:100%;
  background:repeating-linear-gradient(
    0deg,
    #eadb81 0 28px,
    transparent 28px 52px
  );
}

/* proper intersection covers */

.intersection{
  position:absolute;
  z-index:15;
  width:58px;
  height:58px;
  background:#454a4d;
}

.x1{left:17%;top:21%}
.x2{left:39%;top:21%}
.x3{left:51%;top:21%}
.x4{left:17%;top:51%}
.x5{left:39%;top:51%}
.x6{left:51%;top:51%}
.x7{left:17%;top:77%}
.x8{left:39%;top:77%}
.x9{left:51%;top:77%}

/* ================= SIDEWALKS ================= */

/*
  Pedestrian paths are separate from roads.
  They run alongside the roads and never through buildings.
*/

.pedPath{
  position:absolute;
  z-index:17;
  background:#c8c5b5;
  border:2px solid #aaa697;
}

.pathH{
  left:0;
  width:100%;
  height:13px;
}

.ph1{top:calc(21% + 65px)}
.ph2{top:calc(51% + 65px)}
.ph3{top:calc(77% + 65px)}

.pathV{
  top:0;
  width:13px;
  height:100%;
}

.pv1{left:calc(17% - 18px)}
.pv2{left:calc(39% - 18px)}
.pv3{left:calc(51% + 65px)}

/* ================= ROUNDABOUT ================= */

#roundabout{
  position:absolute;
  z-index:25;
  left:34%;
  top:48%;
  width:170px;
  height:170px;
  transform:translate(-50%,-50%);
}

.roundOuter{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#414649;
  box-shadow:
    0 0 0 4px #303538,
    0 7px 12px #0005;
}

.roundLane{
  position:absolute;
  inset:17px;
  border-radius:50%;
  border:3px dashed #e8d978;
}

.roundGrass{
  position:absolute;
  inset:48px;
  border-radius:50%;
  background:#6da456;
  border:5px solid #558846;
}

.roundTree{
  position:absolute;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#326e3c;
  border:3px solid #4e8c4b;
}

.rtree1{left:66px;top:62px}
.rtree2{left:92px;top:75px}
.rtree3{left:70px;top:96px}

/* ================= BRIDGES ================= */

.bridge{
  position:absolute;
  z-index:35;
  left:51%;
  width:25%;
  height:70px;
  background:repeating-linear-gradient(
    90deg,
    #666c70 0 19px,
    #777d81 19px 23px
  );
  border-top:6px solid #292f32;
  border-bottom:6px solid #292f32;
}

.bridge1{top:18%}
.bridge2{top:74%}

.bridge span{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:9px;
  font-weight:bold;
  letter-spacing:2px;
}

/* ================= LOW POLY DECOR ================= */

.tree{
  position:absolute;
  z-index:18;
  width:21px;
  height:21px;
  background:#377a3e;
  border:4px solid #4f944c;
  border-radius:35% 65% 45% 55%;
  transform:rotate(8deg);
}

.tree::after{
  content:"";
  position:absolute;
  width:5px;
  height:9px;
  background:#67462c;
  left:5px;
  top:17px;
}

/* ================= BUILDINGS ================= */

.building{
  position:absolute;
  z-index:50;
  overflow:visible;
}

/*
  Every building now has a small footprint.
  The grass plot remains visible around it.
*/

.buildingBody{
  position:absolute;
  inset:0;
  overflow:hidden;
  border:3px solid #42484a;
  border-radius:4px;
  box-shadow:0 7px 8px #0005;
}

/* roof */

.buildingRoof{
  position:absolute;
  left:-5%;
  top:-8%;
  width:110%;
  height:29%;
  background:#343b3f;
  clip-path:polygon(
    5% 35%,
    50% 0,
    95% 35%,
    100% 100%,
    0 100%
  );
  z-index:5;
}

/* windows */

.windowRow{
  position:absolute;
  left:7%;
  right:7%;
  top:27%;
  height:34%;
  display:flex;
  gap:4px;
  z-index:6;
}

.window{
  flex:1;
  background:#77bed3;
  border:2px solid #33454b;
}

/* front */

.shopFront{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:39%;
  background:#704a29;
  border-top:3px solid #49301d;
}

.playerBuilding .buildingBody{
  background:#e3b52d;
  border-color:#f4d55e;
}

.playerBuilding .shopFront{
  background:#875627;
}

.abandonedBuilding .buildingBody{
  background:#666;
  border-color:#494949;
}

.abandonedBuilding .shopFront{
  background:#4d4037;
}

.rivalBuilding .buildingBody{
  background:#cbd2d6;
  border-color:#354049;
}

.rivalBuilding .shopFront{
  background:#56636a;
}

.door{
  position:absolute;
  z-index:10;
  bottom:0;
  left:50%;
  width:22%;
  height:32%;
  transform:translateX(-50%);
  background:#302923;
  border:2px solid #211d19;
}

/* signs are clearly above buildings */

.buildingNameSign{
  position:absolute;
  z-index:100;
  left:50%;
  top:-34px;
  transform:translateX(-50%);
  min-width:120%;
  padding:5px 9px;
  text-align:center;
  white-space:nowrap;
  border-radius:5px;
  background:#dfac1c;
  color:#211b08;
  border:2px solid #fff0a3;
  font-size:11px;
  font-weight:1000;
  box-shadow:0 3px 5px #0006;
}

.abandonedBuilding .buildingNameSign{
  background:#555;
  color:#ddd;
  border-color:#777;
}

.rivalBuilding .buildingNameSign{
  background:#b72129;
  color:#fff;
  border-color:#f0646b;
}

.levelBadge{
  position:absolute;
  z-index:105;
  right:-7px;
  top:-8px;
  padding:3px 6px;
  border-radius:9px;
  background:#172027;
  border:2px solid white;
  font-size:8px;
  font-weight:bold;
}

/* ================= SHOP PLOTS ================= */

/*
  Small buildings inside individual grass plots.
*/

#shop1{
  left:8%;
  top:7%;
  width:105px;
  height:78px;
}

#shop2{
  left:25%;
  top:29%;
  width:100px;
  height:74px;
}

#shop3{
  left:7%;
  top:61%;
  width:110px;
  height:80px;
}

#shop4{
  left:29%;
  top:69%;
  width:105px;
  height:77px;
}

/* ================= KING'S MART ================= */

#kingsHQ{
  position:absolute;
  z-index:55;
  right:6%;
  top:10%;
  width:175px;
  height:132px;
}

.kingsLogo{
  position:absolute;
  z-index:20;
  left:8%;
  right:8%;
  top:27%;
  height:28%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#c3232c;
  border:3px solid #87151b;
  border-radius:4px;
  color:#fff;
  font-size:17px;
  font-weight:1000;
  box-shadow:0 3px 5px #0005;
}

.kingsWindows{
  position:absolute;
  z-index:15;
  left:6%;
  right:6%;
  bottom:32%;
  height:20%;
  display:flex;
  gap:3px;
}

.kingsWindows span{
  flex:1;
  background:#74c4df;
  border:2px solid #3c4b52;
}

.kingsEntrance{
  position:absolute;
  z-index:20;
  bottom:0;
  left:38%;
  width:24%;
  height:31%;
  background:#27343b;
  border:3px solid #172126;
}

.kingsCustomerCount{
  position:absolute;
  z-index:120;
  left:50%;
  top:-52px;
  transform:translateX(-50%);
  padding:5px 10px;
  border-radius:13px;
  background:#991a22;
  border:2px solid #f0676e;
  font-size:10px;
  font-weight:1000;
  white-space:nowrap;
}

/* second rival building */

#kingsStore2{
  right:7%;
  top:54%;
  width:115px;
  height:83px;
}

/* ================= PEOPLE ================= */

#peopleLayer{
  position:absolute;
  inset:0;
  z-index:75;
  pointer-events:none;
}

.person{
  position:absolute;
  width:8px;
  height:13px;
  border-radius:50% 50% 3px 3px;
  background:#ffd0a8;
  box-shadow:0 2px 2px #0005;
  transition:
    left 5s linear,
    top 5s linear;
}

.person::after{
  content:"";
  position:absolute;
  left:-2px;
  top:6px;
  width:12px;
  height:8px;
  border-radius:2px;
  background:#315f9d;
}

.person.red::after{
  background:#b8252e;
}

/* ================= CARS ================= */

#carsLayer{
  position:absolute;
  inset:0;
  z-index:80;
  pointer-events:none;
}

.car{
  position:absolute;
  width:22px;
  height:12px;
  transform:translate(-50%,-50%);
  border-radius:4px;
  border:2px solid #222;
  box-shadow:0 2px 3px #0006;
}

.car::before,
.car::after{
  content:"";
  position:absolute;
  bottom:-4px;
  width:5px;
  height:4px;
  background:#111;
  border-radius:2px;
}

.car::before{left:2px}
.car::after{right:2px}

.red{background:#d73a3a}
.blue{background:#3d79b9}
.yellow{background:#dfbb38}
.white{background:#e7e7e7}
.black{background:#25292b}

/* ================= BOTTOM ================= */

#bottomBar{
  position:absolute;
  z-index:200;
  left:0;
  bottom:0;
  width:100%;
  height:60px;
  display:flex;
  justify-content:center;
  gap:7px;
  padding:7px;
  background:#121c23;
  border-top:3px solid #31434d;
}

.navButton{
  min-width:105px;
  border:1px solid #425661;
  border-radius:7px;
  background:#1e2d35;
  color:#fff;
  font-weight:bold;
}

.navButton.company{
  color:#ffd447;
}

/* ================= PANEL ================= */

#panel{
  display:none;
  position:absolute;
  z-index:300;
  right:15px;
  top:84px;
  width:315px;
  max-height:calc(100vh - 150px);
  overflow:auto;
  padding:15px;
  border-radius:12px;
  background:#17232b;
  border:3px solid #40545f;
  box-shadow:0 10px 25px #0009;
}

#panel.show{
  display:block;
}

.closePanel{
  position:absolute;
  right:7px;
  top:7px;
  width:27px;
  height:27px;
  border:0;
  border-radius:50%;
  background:#3b484f;
  color:white;
}

.panelTitle{
  margin-bottom:12px;
  color:#ffd447;
  font-size:19px;
  font-weight:1000;
}

.panelSection{
  padding:10px;
  margin-bottom:9px;
  border-radius:8px;
  background:#203039;
}

.action{
  width:100%;
  padding:10px;
  margin-top:7px;
  border:0;
  border-radius:7px;
  background:#dfad20;
  color:#211b08;
  font-weight:1000;
}

.action.dark{
  background:#354952;
  color:#fff;
}

.action.red{
  background:#c32932;
  color:#fff;
}

input{
  width:100%;
  margin-top:7px;
  padding:10px;
  border:2px solid #4b606b;
  border-radius:7px;
  background:#10181d;
  color:white;
  font-size:16px;
}

/* ================= TOAST ================= */

#toast{
  position:absolute;
  z-index:500;
  left:50%;
  top:80px;
  transform:translateX(-50%) translateY(-10px);
  opacity:0;
  padding:10px 16px;
  border-radius:9px;
  background:#17242b;
  border:2px solid #ffd447;
  box-shadow:0 5px 12px #0006;
  font-weight:bold;
  transition:.25s;
  pointer-events:none;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= SMALL SCREEN ================= */

@media(max-width:800px){

  #topBar{
    height:57px;
    padding:4px;
  }

  .logo{
    min-width:120px;
    font-size:12px;
  }

  .stat{
    min-width:65px;
    height:43px;
  }

  .stat small{
    font-size:7px;
  }

  .stat strong{
    font-size:11px;
  }

  #world{
    top:57px;
    height:calc(100% - 111px);
  }

  #bottomBar{
    height:54px;
  }

  .navButton{
    min-width:75px;
    font-size:10px;
  }

  #panel{
    top:65px;
    right:7px;
    width:calc(100vw - 14px);
  }

  #roundabout{
    transform:translate(-50%,-50%) scale(.72);
  }

  #kingsHQ{
    width:140px;
    height:106px;
  }

  .kingsLogo{
    font-size:12px;
  }

  .buildingNameSign{
    font-size:8px;
    padding:4px 6px;
  }
}
</style>
</head>

<body>

<div id="game">

<!-- ================= TOP ================= -->

<div id="topBar">

  <div class="logo">
    👑 KING'S MART TYCOON
  </div>

  <div class="stat">
    <small>Company</small>
    <strong id="companyName">Your Company</strong>
  </div>

  <div class="stat">
    <small>Cash</small>
    <strong id="cash">£5,000</strong>
  </div>

  <div class="stat">
    <small>Income</small>
    <strong id="income">£12/s</strong>
  </div>

  <div class="stat">
    <small>Customers</small>
    <strong id="customers">42</strong>
  </div>

  <div class="stat">
    <small>Market</small>
    <strong id="market">8%</strong>
  </div>

  <div class="stat">
    <small>Reputation</small>
    <strong id="reputation">50</strong>
  </div>

</div>


<!-- ================= WORLD ================= -->

<div id="world">

  <!-- ground -->

  <div class="groundPatch gp1"></div>
  <div class="groundPatch gp2"></div>
  <div class="groundPatch gp3"></div>
  <div class="groundPatch gp4"></div>


  <!-- river -->

  <div id="river">
    <div class="riverLabel">
      RIVER DISTRICT
    </div>
  </div>


  <!-- roads -->

  <div class="road horizontal h1"></div>
  <div class="road horizontal h2"></div>
  <div class="road horizontal h3"></div>

  <div class="road vertical v1"></div>
  <div class="road vertical v2"></div>
  <div class="road vertical v3"></div>
  <div class="road vertical v4"></div>
  <div class="road vertical v5"></div>


  <!-- intersections -->

  <div class="intersection x1"></div>
  <div class="intersection x2"></div>
  <div class="intersection x3"></div>
  <div class="intersection x4"></div>
  <div class="intersection x5"></div>
  <div class="intersection x6"></div>
  <div class="intersection x7"></div>
  <div class="intersection x8"></div>
  <div class="intersection x9"></div>


  <!-- pedestrian paths -->

  <div class="pedPath pathH ph1"></div>
  <div class="pedPath pathH ph2"></div>
  <div class="pedPath pathH ph3"></div>

  <div class="pedPath pathV pv1"></div>
  <div class="pedPath pathV pv2"></div>
  <div class="pedPath pathV pv3"></div>


  <!-- bridges -->

  <div class="bridge bridge1">
    <span>BRIDGE</span>
  </div>

  <div class="bridge bridge2">
    <span>BRIDGE</span>
  </div>


  <!-- roundabout -->

  <div id="roundabout">

    <div class="roundOuter"></div>
    <div class="roundLane"></div>
    <div class="roundGrass"></div>

    <div class="roundTree rtree1"></div>
    <div class="roundTree rtree2"></div>
    <div class="roundTree rtree3"></div>

  </div>


  <!-- trees -->

  <div class="tree" style="left:3%;top:36%"></div>
  <div class="tree" style="left:13%;top:88%"></div>
  <div class="tree" style="left:27%;top:10%"></div>
  <div class="tree" style="left:47%;top:34%"></div>
  <div class="tree" style="left:48%;top:88%"></div>

  <div class="tree" style="right:25%;top:7%"></div>
  <div class="tree" style="right:20%;top:39%"></div>
  <div class="tree" style="right:4%;top:79%"></div>


  <!-- ================= SHOP 1 ================= -->

  <div
    id="shop1"
    class="building playerBuilding"
    onclick="openShop(0)"
  >

    <div
      class="buildingNameSign"
      id="sign0"
    >
      My Mart
    </div>

    <div
      class="levelBadge"
      id="badge0"
    >
      LV 1
    </div>

    <div class="buildingBody">

      <div class="buildingRoof"></div>

      <div class="windowRow">
        <div class="window"></div>
        <div class="window"></div>
        <div class="window"></div>
      </div>

      <div class="shopFront"></div>

      <div class="door"></div>

    </div>

  </div>


  <!-- ================= PROPERTY 1 ================= -->

  <div
    id="shop2"
    class="building abandonedBuilding"
    onclick="openProperty(0)"
  >

    <div
      class="buildingNameSign"
      id="sign1"
    >
      Old Corner Shop
    </div>

    <div
      class="levelBadge"
      id="badge1"
    >
      £2,200
    </div>

    <div class="buildingBody">

      <div class="buildingRoof"></div>

      <div class="windowRow">
        <div class="window"></div>
        <div class="window"></div>
      </div>

      <div class="shopFront"></div>

      <div class="door"></div>

    </div>

  </div>


  <!-- ================= PROPERTY 2 ================= -->

  <div
    id="shop3"
    class="building abandonedBuilding"
    onclick="openProperty(1)"
  >

    <div
      class="buildingNameSign"
      id="sign2"
    >
      Empty High Street
    </div>

    <div
      class="levelBadge"
      id="badge2"
    >
      £3,500

<script>

/* =========================================================
   GAME DATA
========================================================= */

const SAVE_KEY="kings_mart_tycoon_city_v9";

let game={

  company:"Your Company",

  cash:5000,

  reputation:50,

  marketShare:8,

  customers:42,

  totalStores:1,

  selectedShop:0,

  staff:[],

  properties:[

    {
      name:"Old Corner Shop",
      price:2200,
      bought:false,
      storeIndex:null
    },

    {
      name:"Empty High Street",
      price:3500,
      bought:false,
      storeIndex:null
    },

    {
      name:"Abandoned Supermarket",
      price:4800,
      bought:false,
      storeIndex:null
    }

  ],

  stores:[

    {
      name:"My Mart",
      level:1,
      condition:65,
      baseIncome:12,
      customers:42,
      upgrades:0
    }

  ],

  rival:{

    name:"King's Mart",

    customers:220,

    health:100,

    marketShare:32,

    income:95,

    stage:"HEALTHY"

  },

  lastSave:Date.now()

};


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  game.lastSave=Date.now();

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(game)
  );

}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

  const saved=
    localStorage.getItem(SAVE_KEY);

  if(!saved) return;

  try{

    const old=JSON.parse(saved);

    game={
      ...game,
      ...old
    };

  }catch(e){

    console.log("Save error");

  }

}


/* =========================================================
   OFFLINE MONEY
========================================================= */

function offlineIncome(){

  const seconds=Math.min(
    28800,
    Math.floor(
      (Date.now()-game.lastSave)/1000
    )
  );

  if(seconds<=10) return;

  const amount=Math.floor(
    getIncome()*seconds
  );

  if(amount>0){

    game.cash+=amount;

    toast(
      "💰 Offline earnings: +"+
      formatMoney(amount)
    );

  }

}


/* =========================================================
   MONEY
========================================================= */

function getIncome(){

  return game.stores.reduce(
    (total,shop)=>
      total+
      shop.baseIncome+
      ((shop.level-1)*10)+
      (shop.upgrades*8),
    0
  );

}


function formatMoney(value){

  return "£"+
    Math.floor(value)
    .toLocaleString();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  document.getElementById(
    "companyName"
  ).textContent=game.company;

  document.getElementById(
    "cash"
  ).textContent=
    formatMoney(game.cash);

  document.getElementById(
    "income"
  ).textContent=
    formatMoney(getIncome())+"/s";

  document.getElementById(
    "customers"
  ).textContent=
    Math.floor(game.customers);

  document.getElementById(
    "market"
  ).textContent=
    game.marketShare.toFixed(1)+"%";

  document.getElementById(
    "reputation"
  ).textContent=
    Math.floor(game.reputation);

  renderBuildings();

  renderRival();

}


/* =========================================================
   BUILDING RENDER
========================================================= */

const buildingIDs=[
  "shop1",
  "shop2",
  "shop3",
  "shop4"
];


function renderBuildings(){

  if(game.stores[0]){

    document.getElementById(
      "sign0"
    ).textContent=
      game.stores[0].name;

    document.getElementById(
      "badge0"
    ).textContent=
      "LV "+game.stores[0].level;

  }


  game.properties.forEach(
    (property,index)=>{

      const building=
        document.getElementById(
          buildingIDs[index+1]
        );

      if(!building) return;

      const sign=
        document.getElementById(
          "sign"+(index+1)
        );

      const badge=
        document.getElementById(
          "badge"+(index+1)
        );


      if(property.bought){

        const shop=
          game.stores[
            property.storeIndex
          ];

        building.classList.remove(
          "abandonedBuilding"
        );

        building.classList.add(
          "playerBuilding"
        );

        sign.textContent=
          shop.name;

        badge.textContent=
          "LV "+shop.level;

      }else{

        building.classList.remove(
          "playerBuilding"
        );

        building.classList.add(
          "abandonedBuilding"
        );

        sign.textContent=
          property.name;

        badge.textContent=
          formatMoney(property.price);

      }

    }
  );

}


/* =========================================================
   SHOP PANEL
========================================================= */

function openShop(index){

  const shop=
    game.stores[index];

  if(!shop){

    toast(
      "You don't own this shop yet."
    );

    return;

  }

  game.selectedShop=index;

  const cost=
    1000+
    shop.level*850+
    shop.upgrades*700;


  openPanel(`

    <div class="panelTitle">
      🏪 ${shop.name}
    </div>

    <div class="panelSection">

      <b>Level:</b> ${shop.level}<br>
      <b>Customers:</b> ${Math.floor(shop.customers)}<br>
      <b>Condition:</b> ${shop.condition}%<br>
      <b>Income:</b>
      ${formatMoney(
        shop.baseIncome+
        ((shop.level-1)*10)+
        shop.upgrades*8
      )}/s

    </div>

    <div class="panelSection">

      <b>BUILDING DEVELOPMENT</b>

      <button
        class="action"
        onclick="upgradeShop(${index})"
      >
        ⬆️ UPGRADE — ${formatMoney(cost)}
      </button>

      <button
        class="action dark"
        onclick="renovateShop(${index})"
      >
        🔨 RENOVATE — £750
      </button>

      <button
        class="action dark"
        onclick="advertiseShop(${index})"
      >
        📣 ADVERTISE — £500
      </button>

    </div>

  `);

}


/* =========================================================
   UPGRADE
========================================================= */

function upgradeShop(index){

  const shop=
    game.stores[index];

  const cost=
    1000+
    shop.level*850+
    shop.upgrades*700;


  if(game.cash<cost){

    toast("❌ Not enough cash.");

    return;

  }


  game.cash-=cost;

  shop.level++;

  shop.upgrades++;

  shop.condition=
    Math.min(
      100,
      shop.condition+10
    );

  shop.customers+=12;

  game.customers+=12;

  game.reputation+=2;


  saveGame();

  render();

  openShop(index);

  toast(
    "⬆️ "+shop.name+
    " upgraded to Level "+
    shop.level+"!"
  );

}


/* =========================================================
   RENOVATE
========================================================= */

function renovateShop(index){

  if(game.cash<750){

    toast("❌ You need £750.");

    return;

  }

  game.cash-=750;

  game.stores[index].condition=
    Math.min(
      100,
      game.stores[index].condition+20
    );

  game.stores[index].customers+=5;

  game.customers+=5;

  game.reputation+=2;

  saveGame();

  render();

  toast("🔨 Shop renovated!");

}


/* =========================================================
   ADVERTISE
========================================================= */

function advertiseShop(index){

  if(game.cash<500){

    toast("❌ You need £500.");

    return;

  }

  game.cash-=500;

  game.stores[index].customers+=10;

  game.customers+=10;

  game.marketShare+=.4;

  game.reputation+=1;

  saveGame();

  render();

  toast(
    "📣 More customers found your shop!"
  );

}


/* =========================================================
   PROPERTY
========================================================= */

function openProperty(index){

  const property=
    game.properties[index];

  if(property.bought){

    openShop(property.storeIndex);

    return;

  }


  openPanel(`

    <div class="panelTitle">
      🏚️ ${property.name}
    </div>

    <div class="panelSection">

      Abandoned building available
      for your company.

      <br><br>

      Price:
      <b>${formatMoney(property.price)}</b>

    </div>

    <button
      class="action"
      onclick="buyProperty(${index})"
    >
      🏗️ BUY BUILDING
    </button>

  `);

}


function buyProperty(index){

  const property=
    game.properties[index];

  if(property.bought){

    toast("You already own this.");

    return;

  }


  if(game.cash<property.price){

    toast(
      "❌ You need "+
      formatMoney(property.price)
    );

    return;

  }


  game.cash-=property.price;


  const storeIndex=
    game.stores.length;


  property.bought=true;

  property.storeIndex=
    storeIndex;


  game.stores.push({

    name:
      property.name+" Mart",

    level:1,

    condition:45,

    baseIncome:15,

    customers:15,

    upgrades:0

  });


  game.totalStores++;

  game.customers+=15;

  game.reputation+=3;


  saveGame();

  render();

  closePanel();

  toast(
    "🏗️ Building purchased!"
  );

}


/* =========================================================
   COMPANY
========================================================= */

function openCompany(){

  openPanel(`

    <div class="panelTitle">
      🏢 COMPANY
    </div>

    <div class="panelSection">

      Company name

      <input
        id="companyInput"
        maxlength="24"
        value="${game.company.replace(/"/g,"&quot;")}"
      >

      <button
        class="action"
        onclick="changeCompany()"
      >
        SAVE NAME
      </button>

    </div>

    <div class="panelSection">

      Shops:
      ${game.stores.length}<br>

      Customers:
      ${Math.floor(game.customers)}<br>

      Market Share:
      ${game.marketShare.toFixed(1)}%

    </div>

  `);

}


function changeCompany(){

  const input=
    document.getElementById(
      "companyInput"
    );

  const value=
    input.value.trim();

  if(!value){

    toast("Enter a name.");

    return;

  }

  game.company=value;

  saveGame();

  render();

  closePanel();

  toast(
    "🏢 Company renamed!"
  );

}


/* =========================================================
   STAFF
========================================================= */

function openStaff(){

  let html=`

    <div class="panelTitle">
      👥 STAFF
    </div>

  `;


  if(game.staff.length===0){

    html+=`

      <div class="panelSection">
        No employees hired yet.
      </div>

    `;

  }


  game.staff.forEach(
    person=>{

      html+=`

        <div class="panelSection">

          <b>${person.name}</b><br>
          Age: ${person.age}<br>
          Intelligence:
          ${person.intelligence}<br>
          Management:
          ${person.management}<br>
          Customer Service:
          ${person.service}

        </div>

      `;

    }
  );


  html+=`

    <button
      class="action"
      onclick="hireAdam()"
    >
      👔 HIRE ADAM — £1,000
    </button>

  `;


  openPanel(html);

}


function hireAdam(){

  if(
    game.staff.some(
      person=>person.name==="Adam"
    )
  ){

    toast("Adam already works here.");

    return;

  }


  if(game.cash<1000){

    toast("❌ You need £1,000.");

    return;

  }


  game.cash-=1000;


  game.staff.push({

    name:"Adam",

    age:18,

    intelligence:100,

    management:95,

    stocking:65,

    service:72,

    problemSolving:100

  });


  game.reputation+=5;

  saveGame();

  render();

  openStaff();

  toast(
    "👔 Adam joined your company!"
  );

}


/* =========================================================
   RIVAL
========================================================= */

function rivalAI(){

  if(game.rival.health>75){

    game.rival.stage="HEALTHY";

  }else if(game.rival.health>50){

    game.rival.stage="UNDER PRESSURE";

  }else if(game.rival.health>30){

    game.rival.stage="STRUGGLING";

  }else if(game.rival.health>10){

    game.rival.stage="DISTRESSED";

  }else{

    game.rival.stage="FOR SALE";

  }


  const maximum=
    Math.max(
      5,
      Math.floor(
        220*
        (game.rival.health/100)
      )
    );


  game.rival.customers=
    Math.min(
      game.rival.customers,
      maximum
    );

}


function renderRival(){

  document.getElementById(
    "kingsCustomerCount"
  ).textContent=
    "🔴 "+
    Math.floor(
      game.rival.customers
    )+
    " CUSTOMERS";

}


/* =========================================================
   RIVAL PANEL
========================================================= */

function openRival(){

  const r=game.rival;

  openPanel(`

    <div class="panelTitle">
      ⚔️ KING'S MART
    </div>

    <div class="panelSection">

      <b>Status:</b>
      ${r.stage}<br><br>

      🔴 Customers:
      <b>${Math.floor(r.customers)}</b><br>

      ❤️ Health:
      <b>${Math.floor(r.health)}%</b><br>

      📊 Market Share:
      <b>${r.marketShare.toFixed(1)}%</b>

    </div>

    <button
      class="action red"
      onclick="attackRival()"
    >
      ⚔️ ATTACK KING'S MART
    </button>

    ${
      r.stage==="FOR SALE"
      ?
      `
      <button
        class="action"
        onclick="buyRival()"
      >
        👑 BUY KING'S MART — £9,000
      </button>
      `
      :
      ""
    }

  `);

}


/* =========================================================
   ATTACK
========================================================= */

function attackRival(){

  const loss=
    Math.floor(
      10+
      Math.random()*9
    );


  game.rival.customers=
    Math.max(
      0,
      game.rival.customers-loss
    );


  game.rival.health=
    Math.max(
      0,
      game.rival.health-7
    );


  game.rival.marketShare=
    Math.max(
      0,
      game.rival.marketShare-.65
    );


  game.marketShare+=.5;

  game.customers+=
    Math.floor(loss*.65);

  game.reputation+=1;


  rivalAI();

  saveGame();

  render();

  createPeople();

  openRival();


  toast(
    "⚔️ King's Mart lost "+
    loss+
    " customers!"
  );

}


/* =========================================================
   BUY RIVAL
========================================================= */

function buyRival(){

  if(
    game.rival.stage!=="FOR SALE"
  ){

    toast(
      "King's Mart isn't for sale yet."
    );

    return;

  }


  if(game.cash<9000){

    toast("❌ You need £9,000.");

    return;

  }


  game.cash-=9000;

  game.rival.customers=0;

  game.rival.health=0;

  game.rival.marketShare=0;

  game.marketShare+=12;

  game.reputation+=10;


  saveGame();

  render();

  createPeople();

  closePanel();

  toast(
    "👑 You bought King's Mart!"
  );

}


/* =========================================================
   PEDESTRIANS
========================================================= */

/*
  Pedestrians are deliberately restricted
  to the pavement network.

  They never spawn inside a building.
*/

function createPeople(){

  const layer=
    document.getElementById(
      "peopleLayer"
    );

  layer.innerHTML="";


  /*
    PLAYER CUSTOMERS

    These paths are all on the left
    side of the river.
  */

  const playerCount=
    Math.min(
      14,
      Math.max(
        5,
        Math.floor(
          game.customers/12
        )
      )
    );


  for(
    let i=0;
    i<playerCount;
    i++
  ){

    const person=
      document.createElement("div");

    person.className="person";


    /*
      Only use known pedestrian
      path coordinates.

      Horizontal pavement:
      y ≈ 21%, 51%, 77%

      Vertical pavement:
      x ≈ 17%, 39%, 51%
    */

    const routes=[

      [4+Math.random()*45,27],
      [4+Math.random()*45,57],
      [4+Math.random()*45,83],

      [15,8+Math.random()*80],
      [37,8+Math.random()*80],
      [50,8+Math.random()*80]

    ];


    const start=
      routes[
        Math.floor(
          Math.random()*routes.length
        )
      ];


    person.style.left=
      start[0]+"%";

    person.style.top=
      start[1]+"%";


    layer.appendChild(person);

  }


  /*
    FEWER KING'S MART CUSTOMERS

    Maximum 5 visible.
  */

  const rivalCount=
    Math.min(
      5,
      Math.max(
        1,
        Math.ceil(
          game.rival.customers/60
        )
      )
    );


  if(game.rival.customers>0){

    for(
      let i=0;
      i<rivalCount;
      i++
    ){

      const person=
        document.createElement("div");

      person.className=
        "person red";


      /*
        King's Mart pedestrians
        stay on right-side pavement.
      */

      const routes=[

        [72+Math.random()*25,27],
        [72+Math.random()*25,57],
        [72+Math.random()*25,83],

        [75,10+Math.random()*78],
        [89,10+Math.random()*78]

      ];


      const start=
        routes[
          Math.floor(
            Math.random()*routes.length
          )
        ];


      person.style.left=
        start[0]+"%";

      person.style.top=
        start[1]+"%";


      layer.appendChild(person);

    }

  }

}


/* =========================================================
   SLOW PEDESTRIAN MOVEMENT
========================================================= */

function movePeople(){

  document
    .querySelectorAll(
      "#peopleLayer .person"
    )
    .forEach(
      person=>{

        if(
          person.classList.contains("red")
        ){

          /*
            Slow movement on King's Mart
            pavements.
          */

          const routes=[

            [72+Math.random()*25,27],
            [72+Math.random()*25,57],
            [72+Math.random()*25,83],

            [75,10+Math.random()*78],
            [89,10+Math.random()*78]

          ];

          const target=
            routes[
              Math.floor(
                Math.random()*routes.length
              )
            ];

          person.style.left=
            target[0]+"%";

          person.style.top=
            target[1]+"%";

        }else{

          /*
            Slow movement on our
            pedestrian network.
          */

          const routes=[

            [4+Math.random()*45,27],
            [4+Math.random()*45,57],
            [4+Math.random()*45,83],

            [15,8+Math.random()*80],
            [37,8+Math.random()*80],
            [50,8+Math.random()*80]

          ];

          const target=
            routes[
              Math.floor(
                Math.random()*routes.length
              )
            ];

          person.style.left=
            target[0]+"%";

          person.style.top=
            target[1]+"%";

        }

      }
    );

}

let cars=[];


function createCars(){

  const layer=
    document.getElementById(
      "carsLayer"
    );

  layer.innerHTML="";

  cars=[];


  const colours=[
    "red",
    "blue",
    "yellow",
    "white",
    "black"
  ];


  trafficRoutes.forEach(
    (route,index)=>{

      const car=
        document.createElement("div");

      car.className=
        "car "+
        colours[
          index%colours.length
        ];

      layer.appendChild(car);


      cars.push({

        element:car,

        route:route,

        point:
          Math.random()*
          (route.length-1),

        /*
          Slower cars than before.
        */

        speed:
          .003+
          Math.random()*.002

      });

    }
  );

}


function updateCars(){

  cars.forEach(car=>{

    car.point+=car.speed;


    if(
      car.point>=
      car.route.length-1
    ){

      car.point=0;

    }


    const index=
      Math.floor(car.point);

    const next=
      Math.min(
        index+1,
        car.route.length-1
      );


    const fraction=
      car.point-index;


    const a=
      car.route[index];

    const b=
      car.route[next];


    const x=
      a[0]+
      (b[0]-a[0])*
      fraction;

    const y=
      a[1]+
      (b[1]-a[1])*
      fraction;


    car.element.style.left=
      x+"%";

    car.element.style.top=
      y+"%";


    const dx=b[0]-a[0];

    const dy=b[1]-a[1];

    let angle=0;


    if(Math.abs(dx)>Math.abs(dy)){

      angle=
        dx>=0 ? 0 : 180;

    }else{

      angle=
        dy>=0 ? 90 : -90;

    }


    car.element.style.transform=
      "translate(-50%,-50%) rotate("+
      angle+
      "deg)";

  });

}


/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvent(){

  const events=[

    {
      text:"🛍️ Shopping boom!",
      money:500,
      customers:15
    },

    {
      text:"🚚 Delivery arrived early!",
      money:300,
      customers:8
    },

    {
      text:"📺 Your company appeared on TV!",
      money:250,
      customers:12
    },

    {
      text:"💡 Power problem!",
      money:-150,
      customers:-4
    }

  ];


  const event=
    events[
      Math.floor(
        Math.random()*events.length
      )
    ];


  game.cash+=event.money;

  game.customers=
    Math.max(
      0,
      game.customers+
      event.customers
    );


  saveGame();

  render();

  toast(event.text);

}


/* =========================================================
   PANELS
========================================================= */

function openPanel(html){

  document.getElementById(
    "panelContent"
  ).innerHTML=html;

  document.getElementById(
    "panel"
  ).classList.add("show");

}


function closePanel(){

  document.getElementById(
    "panel"
  ).classList.remove("show");

}


function showCity(){

  closePanel();

  toast(
    "🗺️ Welcome to your city!"
  );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(message){

  const element=
    document.getElementById(
      "toast"
    );

  element.textContent=message;

  element.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=
    setTimeout(
      ()=>{
        element.classList.remove("show");
      },
      2600
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTick=Date.now();


function gameLoop(){

  const now=Date.now();

  const elapsed=
    (now-lastTick)/1000;

  lastTick=now;


  /*
    Income
  */

  game.cash+=
    getIncome()*elapsed;


  /*
    Customer growth
  */

  game.customers+=
    game.stores.length*
    .02*
    elapsed;


  /*
    Rival pressure
  */

  if(
    game.marketShare>12 &&
    game.rival.health>0
  ){

    game.rival.health=
      Math.max(
        0,
        game.rival.health-
        .0015*elapsed
      );

  }


  rivalAI();

  updateCars();

  renderRival();

}


/* =========================================================
   TIMERS
========================================================= */

/*
  5 seconds = movement target.
  Because CSS transition is also 5 seconds,
  people move slowly rather than teleporting.
*/

setInterval(
  movePeople,
  5000
);


/*
  Rebuild customer population occasionally.
*/

setInterval(
  createPeople,
  15000
);


/*
  Random event.
*/

setInterval(
  ()=>{
    if(Math.random()<.08){
      randomEvent();
    }
  },
  30000
);


/*
  Save.
*/

setInterval(
  saveGame,
  5000
);


/* =========================================================
   START
========================================================= */

loadGame();

offlineIncome();

createCars();

createPeople();

rivalAI();

render();

lastTick=Date.now();

setInterval(
  gameLoop,
  1000/30
);

saveGame();

setTimeout(
  ()=>{
    toast(
      "🏙️ Your low-poly city is ready!"
    );
  },
  700
);

</script>
