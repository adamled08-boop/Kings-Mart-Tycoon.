<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>King's Mart Tycoon</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:#fff;
  user-select:none;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#111;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  z-index:1000;
  top:0;
  left:0;
  right:0;
  height:70px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  background:rgba(17,20,24,.94);
  border-bottom:2px solid rgba(255,255,255,.1);
  box-shadow:0 3px 15px rgba(0,0,0,.35);
}

.logo{
  min-width:145px;
  height:50px;
  padding:5px 10px;
  border-radius:12px;
  background:linear-gradient(145deg,#f7c843,#b67b00);
  color:#1d1605;
  display:flex;
  flex-direction:column;
  justify-content:center;
  font-weight:900;
  line-height:1;
  box-shadow:inset 0 2px rgba(255,255,255,.35);
}

.logo small{
  font-size:9px;
  margin-top:5px;
  opacity:.75;
}

.stat{
  min-width:90px;
  height:50px;
  padding:6px 10px;
  border-radius:10px;
  background:#242a30;
  border:1px solid rgba(255,255,255,.08);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.stat span{
  font-size:10px;
  color:#aab3bb;
  text-transform:uppercase;
}

.stat strong{
  font-size:15px;
  color:#fff;
  margin-top:2px;
}

#companyHud{
  min-width:120px;
}

/* =========================
   WORLD / CAMERA
========================= */

#world{
  position:absolute;
  top:70px;
  bottom:70px;
  left:0;
  right:0;
  overflow:hidden;
  touch-action:none;
  background:#79a95a;
  z-index:10;
}

#worldContent{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  min-width:1100px;
  min-height:800px;
  transform-origin:0 0;
  will-change:transform;
}

#ground{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 15% 30%,rgba(255,255,255,.08),transparent 25%),
    radial-gradient(circle at 75% 70%,rgba(0,0,0,.07),transparent 30%),
    #78a957;
}

/* districts */

.district{
  position:absolute;
  border:2px dashed rgba(255,255,255,.12);
  border-radius:25px;
  pointer-events:none;
}

.district.one{
  left:1%;
  top:2%;
  width:48%;
  height:31%;
}

.district.two{
  left:1%;
  top:37%;
  width:48%;
  height:27%;
}

.district.three{
  left:1%;
  top:68%;
  width:48%;
  height:30%;
}

.district.four{
  right:1%;
  top:2%;
  width:49%;
  height:96%;
}

/* =========================
   RIVER
========================= */

.river{
  position:absolute;
  left:57%;
  top:0;
  width:12%;
  height:100%;
  overflow:hidden;
  pointer-events:none;
  background:
    linear-gradient(
      90deg,
      #1876ad 0%,
      #239bd2 20%,
      #45b7e0 48%,
      #2094ca 72%,
      #126da3 100%
    );
  box-shadow:
    inset 8px 0 14px rgba(0,0,0,.18),
    inset -8px 0 14px rgba(0,0,0,.18);
}

.river:before{
  content:"";
  position:absolute;
  inset:-20%;
  background:
    repeating-linear-gradient(
      165deg,
      transparent 0 18px,
      rgba(255,255,255,.22) 19px 22px,
      transparent 23px 45px
    );
  animation:riverMove 5s linear infinite;
  opacity:.55;
}

.river:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      5deg,
      transparent 0 34px,
      rgba(255,255,255,.13) 35px 38px,
      transparent 39px 75px
    );
  animation:riverMove2 7s linear infinite;
}

@keyframes riverMove{
  from{transform:translateX(-80px);}
  to{transform:translateX(80px);}
}

@keyframes riverMove2{
  from{transform:translateY(-80px);}
  to{transform:translateY(80px);}
}

/* =========================
   ROADS
========================= */

.road{
  position:absolute;
  background:#3b4045;
  box-shadow:
    inset 0 2px rgba(255,255,255,.08),
    inset 0 -2px rgba(0,0,0,.18);
  pointer-events:none;
}

.road.h{
  left:0;
  width:100%;
  height:5%;
  transform:translateY(-50%);
}

.road.v{
  top:0;
  height:100%;
  width:4%;
  transform:translateX(-50%);
}

.h1{top:9%;}
.h2{top:35%;}
.h3{top:61%;}
.h4{top:78%;}

.v1{left:16%;}
.v2{left:38%;}
.v3{left:51%;}
.v4{left:76%;}
.v5{left:90%;}

.road.h:after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  border-top:2px dashed #d6c976;
  opacity:.65;
}

.road.v:after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  border-left:2px dashed #d6c976;
  opacity:.65;
}

/* road junction covers */
.junction{
  position:absolute;
  width:7%;
  height:7%;
  background:#3b4045;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* =========================
   PAVEMENTS
========================= */

.pavement{
  position:absolute;
  background:#c4b99a;
  box-shadow:inset 0 1px rgba(255,255,255,.4);
  pointer-events:none;
}

.pavement.h{
  left:0;
  width:100%;
  height:3%;
  transform:translateY(-50%);
}

.pavement.v{
  top:0;
  height:100%;
  width:2.2%;
  transform:translateX(-50%);
}

.ph1{top:17%;}
.ph2{top:43%;}
.ph3{top:69%;}
.ph4{top:86%;}

.pv1{left:12%;}
.pv2{left:33%;}
.pv3{left:47%;}
.pv4{left:85%;}

/* crossings */

.crossing{
  position:absolute;
  z-index:4;
  pointer-events:none;
  background:repeating-linear-gradient(
    90deg,
    #f3f3f3 0 8px,
    transparent 8px 16px
  );
  opacity:.8;
}

.crossing.c1{
  left:15%;
  top:6%;
  width:2%;
  height:6%;
}

.crossing.c2{
  left:37%;
  top:32%;
  width:2%;
  height:6%;
}

.crossing.c3{
  left:50%;
  top:58%;
  width:2%;
  height:6%;
}

.crossing.c4{
  left:75%;
  top:75%;
  width:2%;
  height:6%;
}

/* =========================
   BRIDGES
========================= */

.bridge{
  position:absolute;
  left:57%;
  width:12%;
  height:7%;
  z-index:6;
  background:
    repeating-linear-gradient(
      90deg,
      #8d7659 0 14px,
      #6e5a45 14px 18px
    );
  border-top:4px solid #564637;
  border-bottom:4px solid #564637;
  box-shadow:0 5px 10px rgba(0,0,0,.3);
  pointer-events:none;
}

.bridge.b1{top:5.5%;}
.bridge.b2{top:74.5%;}

/* =========================
   GRASS PLOTS
========================= */

.plot{
  position:absolute;
  background:#8bbd62;
  border:3px solid #6d9d4d;
  border-radius:14px;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.1),
    0 5px 10px rgba(0,0,0,.12);
  z-index:5;
  pointer-events:none;
}

.plot1{left:4%;top:18%;width:27%;height:15%;}
.plot2{left:21%;top:44%;width:18%;height:15%;}
.plot3{left:3%;top:70%;width:28%;height:7%;}
.plot4{left:23%;top:88%;width:18%;height:7%;}
.plot5{right:4%;top:18%;width:25%;height:15%;}
.plot6{right:6%;top:70%;width:20%;height:8%;}

/* =========================
   ROUNDABOUT
========================= */

.roundabout{
  position:absolute;
  left:29%;
  top:47%;
  width:185px;
  height:185px;
  transform:translate(-50%,-50%);
  z-index:7;
  pointer-events:none;
}

.round-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#3b4045;
  border:14px solid #777d80;
  box-shadow:0 5px 10px rgba(0,0,0,.25);
}

.round-ring:after{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  border:2px dashed #d6c976;
}

.round-island{
  position:absolute;
  inset:52px;
  border-radius:50%;
  background:#77a951;
  border:5px solid #5c8c3e;
  box-shadow:inset 0 0 15px rgba(0,0,0,.15);
}

.round-island:before{
  content:"🌳";
  position:absolute;
  font-size:30px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.arrow{
  position:absolute;
  font-size:20px;
  color:#fff;
  opacity:.7;
}

.arrow.a1{top:15px;left:80px;}
.arrow.a2{right:15px;top:80px;transform:rotate(90deg);}
.arrow.a3{bottom:15px;left:80px;transform:rotate(180deg);}
.arrow.a4{left:15px;top:80px;transform:rotate(-90deg);}

/* =========================
   SCENERY
========================= */

.tree{
  position:absolute;
  z-index:8;
  width:30px;
  height:40px;
  pointer-events:none;
}

.tree:before{
  content:"";
  position:absolute;
  width:27px;
  height:27px;
  left:1px;
  top:0;
  border-radius:50%;
  background:#39773b;
  box-shadow:
    -8px 5px 0 #4c8a42,
    8px 7px 0 #2f6835;
}

.tree:after{
  content:"";
  position:absolute;
  width:7px;
  height:15px;
  left:11px;
  top:24px;
  background:#6e4b2d;
}

.lamp{
  position:absolute;
  width:5px;
  height:30px;
  background:#4a4a4a;
  z-index:8;
  pointer-events:none;
}

.lamp:before{
  content:"";
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff2a1;
  box-shadow:0 0 15px #fff0a0;
  left:-4px;
  top:-6px;
}

.park{
  position:absolute;
  left:40%;
  top:72%;
  width:9%;
  height:17%;
  border-radius:18px;
  background:#6fa94e;
  border:3px solid #5a8e3f;
  z-index:6;
  pointer-events:none;
}

.bench{
  position:absolute;
  width:35px;
  height:8px;
  background:#765133;
  z-index:9;
  pointer-events:none;
}

/* =========================
   BUILDINGS
========================= */

.building{
  position:absolute;
  z-index:20;
  pointer-events:auto;
  border-radius:7px;
  border:3px solid #40352d;
  box-shadow:
    0 8px 12px rgba(0,0,0,.3),
    inset 0 2px rgba(255,255,255,.3);
  overflow:visible;
  transition:transform .15s,filter .15s;
}

.building:hover{
  filter:brightness(1.08);
}

.building:active{
  transform:scale(.97);
}

.building.owned{
  background:linear-gradient(#f5d557,#c89a19);
  border-color:#8b6807;
}

.building.rival-building{
  background:linear-gradient(#e94a4a,#9d2020);
  border-color:#681313;
}

.building.acquired{
  background:linear-gradient(#f5d557,#c89a19);
  border-color:#8b6807;
}

.building.abandoned{
  background:linear-gradient(#7d858b,#555c61);
  border-color:#40464a;
}

.roof{
  position:absolute;
  left:-4px;
  right:-4px;
  top:-15px;
  height:18px;
  border-radius:8px 8px 3px 3px;
  background:#42484d;
  border:3px solid #303438;
  box-shadow:0 3px 5px rgba(0,0,0,.25);
}

.window{
  position:absolute;
  width:23%;
  height:25%;
  background:#8bd1e8;
  border:2px solid #334a54;
  border-radius:3px;
  top:30%;
}

.window.w1{left:10%;}
.window.w2{left:39%;}
.window.w3{left:68%;}

.door{
  position:absolute;
  width:20%;
  height:38%;
  bottom:0;
  left:40%;
  background:#55402e;
  border:2px solid #30251c;
  border-bottom:0;
}

.awning{
  position:absolute;
  left:8%;
  right:8%;
  top:55%;
  height:13%;
  background:repeating-linear-gradient(
    90deg,
    #fff 0 12px,
    #d33 12px 24px
  );
  border:2px solid #6b3434;
}

.sign{
  position:absolute;
  z-index:30;
  left:50%;
  top:-48px;
  transform:translateX(-50%);
  min-width:105%;
  max-width:170%;
  white-space:nowrap;
  text-align:center;
  padding:5px 8px;
  border-radius:6px;
  font-weight:900;
  font-size:12px;
  background:#f5d557;
  color:#2a2108;
  border:2px solid #876b0d;
  box-shadow:0 3px 5px rgba(0,0,0,.25);
}

.rival-building .sign{
  background:#e63838;
  border-color:#761515;
  color:#fff;
}

.abandoned .sign{
  background:#777;
  color:#eee;
  border-color:#454545;
}

.acquired .sign{
  background:#f5d557;
  color:#2a2108;
  border-color:#876b0d;
}

.level-badge{
  position:absolute;
  right:-10px;
  bottom:-10px;
  background:#20252a;
  border:2px solid #fff;
  color:#fff;
  border-radius:50%;
  min-width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

/* player buildings */

.shop1{left:7%;top:20%;width:7%;height:10%;}
.shop2{left:25%;top:46%;width:7%;height:10%;}
.shop3{left:6%;top:71%;width:9%;height:5%;}
.shop4{left:26%;top:89%;width:7%;height:5%;}

.kingsHQ{
  left:80%;
  top:20%;
  width:16%;
  height:14%;
}

.kingsExpress{
  left:80%;
  top:71%;
  width:12%;
  height:8%;
}

.kingsHQ .roof{
  height:24px;
  top:-21px;
  background:#303942;
}

.kingsHQ .sign,
.kingsExpress .sign{
  background:#e63838;
  color:#fff;
}

/* =========================
   PARKING
========================= */

.parking{
  position:absolute;
  left:70%;
  top:42%;
  width:19%;
  height:12%;
  background:#777;
  border:3px solid #555;
  z-index:6;
  pointer-events:none;
  background-image:repeating-linear-gradient(
    90deg,
    transparent 0 30px,
    rgba(255,255,255,.6) 30px 33px
  );
}

/* =========================
   PEOPLE
========================= */

#peopleLayer,
#carsLayer,
#deliveryLayer{
  position:absolute;
  inset:0;
  z-index:40;
  pointer-events:none;
}

.person{
  position:absolute;
  width:10px;
  height:16px;
  border-radius:6px 6px 4px 4px;
  background:#3478d1;
  box-shadow:0 2px 3px rgba(0,0,0,.3);
  transform:translate(-50%,-50%);
}

.person:before{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#f0c7a5;
  left:1px;
  top:-7px;
}

.person.rival-person{
  background:#d72e2e;
}

.person.vip{
  background:#8b4bd8;
}

.car{
  position:absolute;
  width:26px;
  height:13px;
  border-radius:5px;
  transform:translate(-50%,-50%);
  box-shadow:0 2px 4px rgba(0,0,0,.35);
}

.car:before{
  content:"";
  position:absolute;
  left:5px;
  top:-5px;
  width:16px;
  height:8px;
  border-radius:5px 5px 1px 1px;
  background:inherit;
}

.car:after{
  content:"";
  position:absolute;
  left:5px;
  right:5px;
  bottom:-3px;
  height:4px;
  background:
    radial-gradient(circle,#111 0 3px,transparent 4px) left,
    radial-gradient(circle,#111 0 3px,transparent 4px) right;
  background-repeat:no-repeat;
}

.car.red{background:#c93232;}
.car.blue{background:#347bd1;}
.car.yellow{background:#e2ad29;}
.car.green{background:#3d9b5d;}

.van{
  background:#eee;
  border:2px solid #444;
}

.delivery-label{
  position:absolute;
  background:#fff;
  color:#222;
  padding:3px 5px;
  border-radius:4px;
  font-size:8px;
}

/* =========================
   RIVAL CUSTOMER COUNTER
========================= */

#rivalCounter{
  position:absolute;
  left:81%;
  top:35%;
  z-index:50;
  background:rgba(80,10,10,.9);
  border:2px solid #ff6a6a;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
  pointer-events:none;
}

/* =========================
   BOTTOM NAV
========================= */

#bottomBar{
  position:absolute;
  z-index:1000;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:rgba(17,20,24,.96);
  display:flex;
  justify-content:center;
  gap:8px;
  padding:8px;
  border-top:2px solid rgba(255,255,255,.1);
}

.navBtn{
  flex:1;
  max-width:150px;
  border:1px solid #4d555c;
  border-radius:10px;
  background:#282e34;
  color:#fff;
  font-weight:800;
  font-size:12px;
  box-shadow:0 3px 6px rgba(0,0,0,.3);
}

.navBtn:active{
  transform:translateY(2px);
  background:#3a4249;
}

/* =========================
   PANEL
========================= */

#panel{
  position:absolute;
  z-index:2000;
  right:15px;
  top:85px;
  width:min(390px,calc(100vw - 30px));
  max-height:calc(100vh - 170px);
  overflow-y:auto;
  background:rgba(24,29,34,.98);
  border:2px solid #59636c;
  border-radius:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
  padding:16px;
  display:none;
}

#panel.show{
  display:block;
}

.panelTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.panelTitle h2{
  margin:0;
  font-size:20px;
}

.closeBtn{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#3b4248;
  color:#fff;
  font-size:20px;
}

.card{
  background:#2a3036;
  border:1px solid #46505a;
  padding:12px;
  border-radius:11px;
  margin-bottom:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:6px 0;
}

.row span:first-child{
  color:#aeb6bd;
}

.action{
  width:100%;
  border:0;
  border-radius:9px;
  padding:11px;
  margin-top:7px;
  background:#d7aa27;
  color:#1e1805;
  font-weight:900;
}

.action.blue{
  background:#397bd1;
  color:#fff;
}

.action.red{
  background:#c93737;
  color:#fff;
}

.action.green{
  background:#3d9b5d;
  color:#fff;
}

.action:disabled{
  opacity:.45;
  cursor:not-allowed;
}

input.textInput{
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid #59636c;
  background:#161a1e;
  color:#fff;
  outline:none;
}

/* =========================
   TOAST
========================= */

#toast{
  position:absolute;
  z-index:3000;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,23,26,.96);
  border:2px solid #d5ad37;
  border-radius:10px;
  padding:10px 16px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   DEBUG
========================= */

#debugBadge{
  position:absolute;
  z-index:4000;
  top:75px;
  left:10px;
  background:#ff3b30;
  color:#fff;
  padding:4px 7px;
  border-radius:5px;
  font-size:9px;
  display:none;
}

#debugSvg{
  position:absolute;
  inset:0;
  z-index:500;
  pointer-events:none;
  display:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){
  #hud{
    height:62px;
    padding:5px;
    gap:4px;
  }

  #world{
    top:62px;
    bottom:62px;
  }

  .logo{
    min-width:105px;
    height:46px;
    font-size:12px;
  }

  .stat{
    min-width:65px;
    height:46px;

<script>
/* ============================================================
   KING'S MART TYCOON

   ============================================================ */

const SAVE_KEY = "kings_mart_tycoon_city_v13";

let DEBUG_MODE = false;

let game = {
  company:"Your Company",
  cash:5000,
  reputation:50,
  marketShare:8,
  customers:42,
  totalStores:1,
  selectedShop:0,

  staff:[],

  properties:[
    {
      name:"Old Corner Shop",

      slot:2

      slot:3

    }

    {

      condition:65,

      upgrades:0,
      stock:100,
      maxStock:100,

      openingUntil:0,
      productsSold:0,
      sales:0,
      satisfaction:75
    }
  ],

  rival:{
    name:"King's Mart",
    customers:220,
    health:100,
    marketShare:32,
    income:95,
    stage:"HEALTHY",
    acquired:false
  },

  achievements:[],
  missions:[],
  totalSales:0,
  totalProfit:0,
  days:1,
  lastSave:Date.now()
};

/* ============================================================
   HELPERS
============================================================ */

function money(n){
  n=Math.floor(Number(n)||0);

  if(n>=1000000000)
    return "£"+(n/1000000000).toFixed(1)+"B";

  if(n>=1000000)
    return "£"+(n/1000000).toFixed(1)+"M";

  if(n>=1000)
    return "£"+n.toLocaleString();

  return "£"+n;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function toast(text){
  const el=document.getElementById("toast");
  el.textContent=text;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}

function closePanel(){
  document.getElementById("panel").classList.remove("show");
}

function panel(title,html){
  const p=document.getElementById("panel");

  p.innerHTML=`
    <div class="panelTitle">
      <h2>${title}</h2>
      <button class="closeBtn" onclick="closePanel()">×</button>
    </div>
    ${html}
  `;

  p.classList.add("show");
}

function saveGame(){
  game.lastSave=Date.now();

  try{
    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(game)
    );
  }catch(e){}
}

/* ============================================================
   LOAD / MIGRATION
============================================================ */

function loadGame(){

  let raw=null;

  try{
    raw=
      localStorage.getItem(SAVE_KEY) ||
      localStorage.getItem("kings_mart_tycoon_city_v12") ||
      localStorage.getItem("kings_mart_tycoon_city_v11") ||
      localStorage.getItem("kings_mart_tycoon_city_v10") ||
      localStorage.getItem("kings_mart_tycoon_city_v9") ||
      localStorage.getItem("kings_mart_tycoon_city_v8") ||
      localStorage.getItem("kings_mart_tycoon_city_v7") ||
      localStorage.getItem("kings_mart_tycoon_v5");
  }catch(e){}

  if(!raw) return;

  try{
    const old=JSON.parse(raw);

    game={
      ...game,
      ...old
    };

    if(!Array.isArray(game.staff))
      game.staff=[];

    if(!Array.isArray(game.stores))
      game.stores=[];

    if(!Array.isArray(game.properties))
      game.properties=[];

    if(!game.rival)
      game.rival={
        name:"King's Mart",
        customers:220,
        health:100,
        marketShare:32,
        income:95,
        stage:"HEALTHY",
        acquired:false
      };

    if(typeof game.rival.acquired!=="boolean")
      game.rival.acquired=false;

    /*
      Make sure the four current property slots exist.
    */

    const defaults=[
      ["Old Corner Shop",2200,1],
      ["Empty High Street",3500,2],
      ["Abandoned Supermarket",4800,3],
      ["Old Warehouse Shop",6500,4]
    ];

    defaults.forEach(([name,price,slot])=>{
      let existing=game.properties.find(p=>p.slot===slot);

      if(!existing){
        game.properties.push({
          name,
          price,
          bought:false,
          storeIndex:null,
          slot
        });
      }
    });

    /*
      Make sure old stores have new fields.
    */

    game.stores.forEach(s=>{
      if(typeof s.stock!=="number") s.stock=100;
      if(typeof s.maxStock!=="number") s.maxStock=100;
      if(typeof s.productsSold!=="number") s.productsSold=0;
      if(typeof s.sales!=="number") s.sales=0;
      if(typeof s.satisfaction!=="number") s.satisfaction=75;
    });

  }catch(e){
    console.log("Save migration failed",e);
  }
}

/* ============================================================
   OFFLINE INCOME
============================================================ */

function offlineIncome(){

  const now=Date.now();
  const previous=Number(game.lastSave)||now;

  let seconds=Math.floor(
    (now-previous)/1000
  );

  seconds=clamp(seconds,0,8*60*60);

  if(seconds<=10) return;

  const income=getIncome();
  const earned=Math.floor(income*seconds);

  if(earned>0){
    game.cash+=earned;
    toast(
      "💰 While you were away you earned "+
      money(earned)
    );
  }

  game.lastSave=now;
}

/* ============================================================
   STAFF
============================================================ */

const ADAM={
  name:"Adam",
  age:18,
  intelligence:100,
  management:95,
  stocking:65,
  customerService:72,
  problemSolving:100,
  title:"Natural Manager",
  cost:100000,
  income:500
};

function hasAdam(){
  return game.staff.some(
    s=>s.name==="Adam"
  );
}

function getStaffBonus(){
  let bonus=0;

  game.staff.forEach(s=>{
    if(s.name==="Adam"){
      bonus+=500;
    }else{
      bonus+=Number(s.income)||0;
    }
  });

  return bonus;
}

function openStaff(){

  const hired=hasAdam();

  panel(
    "👷 Staff",
    `
    <div class="card">
      <h3 style="margin-top:0">Your Employees</h3>

      <div class="row">
        <span>Employees</span>
        <strong>${game.staff.length}</strong>
      </div>

      <div class="row">
        <span>Staff income bonus</span>
        <strong>${money(getStaffBonus())}/sec</strong>
      </div>
    </div>

    <div class="card">

      <h3 style="margin-top:0">🧠 Adam</h3>

      <div class="row">
        <span>Age</span>
        <strong>18</strong>
      </div>

      <div class="row">
        <span>Position</span>
        <strong>Natural Manager</strong>
      </div>

      <div class="row">
        <span>Intelligence</span>
        <strong>100</strong>
      </div>

      <div class="row">
        <span>Management</span>
        <strong>95</strong>
      </div>

      <div class="row">
        <span>Stocking</span>
        <strong>65</strong>
      </div>

      <div class="row">
        <span>Customer Service</span>
        <strong>72</strong>
      </div>

      <div class="row">
        <span>Problem Solving</span>
        <strong>100</strong>
      </div>

      <div style="
        margin:12px 0;
        padding:12px;
        background:#172719;
        border:2px solid #3d9b5d;
        border-radius:10px;
        text-align:center;
      ">
        <div style="font-size:11px;color:#9bd0a8">
          INCOME BONUS
        </div>

        <strong style="
          display:block;
          font-size:24px;
          color:#71d78d;
          margin-top:4px;
        ">
          +£500/sec
        </strong>
      </div>

      <div class="row">
        <span>Hire cost</span>
        <strong>${money(ADAM.cost)}</strong>
      </div>

      ${
        hired
        ?
        `
        <button class="action green" disabled>
          ✓ Adam Hired — +£500/sec
        </button>
        `
        :
        `
        <button
          class="action"
          onclick="hireAdam()"
          ${game.cash<ADAM.cost?"disabled":""}
        >
          Hire Adam — £100,000
        </button>
        `
      }

    </div>

    <div class="card">
      <strong>💡 Adam's bonus is included in your main income.</strong>
      <div style="margin-top:5px;color:#aeb6bd">
        Hire him once and he permanently adds £500 every second.
      </div>
    </div>
    `
  );
}

function hireAdam(){

  if(hasAdam()){
    toast("Adam is already working for you.");
    return;
  }

  if(game.cash<ADAM.cost){
    toast("You need £100,000 to hire Adam.");
    return;
  }

  game.cash-=ADAM.cost;

  game.staff.push({
    ...ADAM,
    hiredAt:Date.now()
  });

  saveGame();
  render();

  toast("🧠 Adam has joined your company! +£500/sec");

  openStaff();
}

/* ============================================================
   SHOP ECONOMY
============================================================ */

function getShopIncome(store){

  if(!store) return 0;

  let levelBonus=
    1+
    ((Number(store.level)||1)-1)*0.35;

  let upgradeBonus=
    1+
    ((Number(store.upgrades)||0)*0.12);

  let conditionBonus=
    0.5+
    ((Number(store.condition)||50)/100)*0.7;

  let stockBonus=
    store.stock>0 ? 1 : 0.1;

  let renovationPenalty=
    store.renovatingUntil &&
    Date.now()<store.renovatingUntil
      ? 0.25
      : 1;

  let satisfactionBonus=
    0.75+
    ((Number(store.satisfaction)||50)/100)*0.5;

  return Math.max(
    1,
    store.baseIncome*
    levelBonus*
    upgradeBonus*
    conditionBonus*
    stockBonus*
    renovationPenalty*
    satisfactionBonus
  );
}

function getIncome(){

  let total=0;

  game.stores.forEach(s=>{
    total+=getShopIncome(s);
  });

  total+=getStaffBonus();

  return Math.floor(total);
}

/* ============================================================
   STORE SIMULATION
============================================================ */

function updateStock(){

  game.stores.forEach(store=>{

    if(store.stock>0){

      const sold=
        Math.min(
          store.stock,
          Math.max(
            0,
            Math.floor(
              (store.customers||0)/90
            )
          )
        );

      store.stock-=sold;
      store.productsSold+=sold;

      if(sold>0){
        const revenue=sold*2.2;

        store.sales+=revenue;
        game.totalSales+=revenue;
        game.totalProfit+=revenue*.35;
        game.cash+=revenue*.35;
      }

    }else{

      store.satisfaction=
        clamp(
          store.satisfaction-0.2,
          0,
          100
        );
    }

    if(store.stock<store.maxStock*.2){
      store.satisfaction=
        clamp(
          store.satisfaction-.1,
          0,
          100
        );
    }else{
      store.satisfaction=
        clamp(
          store.satisfaction+.05,
          0,
          100
        );
    }
  });
}

function updateCustomers(){

  game.stores.forEach(store=>{

    if(
      store.renovatingUntil &&
      Date.now()<store.renovatingUntil
    ){
      store.customers=
        Math.max(
          1,
          Math.floor(store.customers*.99)
        );
      return;
    }

    let change=
      (Math.random()-.43)*
      3;

    change+=
      (game.reputation-50)*.015;

    change+=
      (store.satisfaction-50)*.01;

    if(store.stock<=0)
      change-=2;

    store.customers=
      clamp(
        Math.floor(store.customers+change),
        1,
        999
      );
  });

  game.customers=
    game.stores.reduce(
      (sum,s)=>sum+(s.customers||0),
      0
    );
}

/* ============================================================
   RIVAL
============================================================ */

function rivalAI(){

  if(game.rival.acquired)
    return;

  if(game.rival.health>75)
    game.rival.stage="HEALTHY";
  else if(game.rival.health>50)
    game.rival.stage="UNDER PRESSURE";
  else if(game.rival.health>30)
    game.rival.stage="STRUGGLING";
  else if(game.rival.health>10)
    game.rival.stage="DISTRESSED";
  else
    game.rival.stage="FOR SALE";

  const desired=
    Math.floor(
      220*
      (
        .35+
        game.rival.health/150
      )
    );

  game.rival.customers=
    clamp(
      game.rival.customers+
      Math.floor(
        (desired-game.rival.customers)*.025
      ),
      0,
      300
    );

  game.rival.marketShare=
    clamp(
      game.rival.marketShare,
      0,
      100
    );
}

function attackRival(){

  if(game.rival.acquired){
    toast("King's Mart already belongs to you.");
    return;
  }

  const cost=750;

  if(game.cash<cost){
    toast("You need £750.");
    return;
  }

  game.cash-=cost;

  const loss=
    Math.floor(
      10+
      Math.random()*9
    );

  game.rival.customers=
    Math.max(
      0,
      game.rival.customers-loss
    );

  game.rival.health=
    Math.max(
      0,
      game.rival.health-7
    );

  game.marketShare=
    clamp(
      game.marketShare+.45,
      0,
      100
    );

  game.rival.marketShare=
    Math.max(
      0,
      game.rival.marketShare-.55
    );

  game.customers+=
    Math.floor(loss*.7);

  game.reputation=
    clamp(
      game.reputation+1,
      0,
      100
    );

  rivalAI();
  render();

  toast(
    "⚔️ King's Mart lost "+
    loss+
    " customers!"
  );

  saveGame();

  if(document.getElementById("panel").classList.contains("show"))
    openRival();
}

function buyRival(){

  }

  game.cash-=price;

  /*

  */

  game.rival.acquired=true;
  game.rival.customers=0;
  game.rival.health=0;
  game.rival.stage="ACQUIRED";

  */

  */

    condition:75,
    baseIncome:65,
    customers:40,
    upgrades:0,

    maxStock:180,

function selectShop(index){

  game.selectedShop=index;

  const store=game.stores[index];

  if(store){
    openShop(index);
    return;
  }

  const property=
    game.properties.find(
      p=>p.slot===index+1
    );

  if(property && !property.bought){
    openProperty(property);
    return;
  }

  openShop(index);
}

function openShop(index){

  const store=game.stores[index];

  if(!store){

    const property=
      game.properties.find(
        p=>p.slot===index+1
      );

    if(property){
      openProperty(property);
      return;
    }

    return;
  }

  game.selectedShop=index;

  const renovating=
    store.renovatingUntil &&
    Date.now()<store.renovatingUntil;

  panel(
    "🏪 "+store.name,
    `
    <div class="card">

      <div class="row">
        <span>Level</span>
        <strong>${store.level}</strong>
      </div>

      <div class="row">
        <span>Income</span>
        <strong>${money(getShopIncome(store))}/sec</strong>
      </div>

      <div class="row">
        <span>Customers</span>
        <strong>${Math.floor(store.customers)}</strong>
      </div>

      <div class="row">
        <span>Condition</span>
        <strong>${Math.floor(store.condition)}%</strong>
      </div>

      <div class="row">
        <span>Stock</span>
        <strong>${Math.floor(store.stock)} / ${store.maxStock}</strong>
      </div>

      <div class="row">
        <span>Customer satisfaction</span>
        <strong>${Math.floor(store.satisfaction)}%</strong>
      </div>

      <div class="row">
        <span>Products sold</span>
        <strong>${Math.floor(store.productsSold)}</strong>
      </div>

      <div class="row">
        <span>Upgrades</span>
        <strong>${store.upgrades}</strong>
      </div>

      ${
        renovating
        ?
        `<div style="
          padding:10px;
          margin-top:10px;
          background:#503e13;
          border-radius:8px;
          text-align:center;
        ">🔨 Renovation in progress</div>`
        :
        ""
      }

    </div>

    <button
      class="action"
      onclick="upgradeShop(${index})"
      ${game.cash<upgradeCost(store)?"disabled":""}
    >
      ⬆️ Upgrade — ${money(upgradeCost(store))}
    </button>

    <button
      class="action blue"
      onclick="renovateShop(${index})"
      ${game.cash<750||renovating?"disabled":""}
    >
      🔨 Renovate — £750
    </button>

    <button
      class="action green"
      onclick="advertiseShop(${index})"
      ${game.cash<500?"disabled":""}
    >
      📣 Advertise — £500
    </button>

    <button
      class="action"
      onclick="orderStock(${index})"
      ${game.cash<250?"disabled":""}
    >
      📦 Order Stock — £250
    </button>
    `
  );
}

function upgradeCost(store){

  return Math.floor(
    1000+
    store.level*850+
    store.upgrades*700
  );
}

function upgradeShop(index){

  const store=game.stores[index];

  if(!store)
    return;

  const cost=upgradeCost(store);

  if(game.cash<cost){
    toast("Not enough cash.");
    return;
  }

  game.cash-=cost;

  store.level++;
  store.upgrades++;

  store.maxStock+=25;
  store.stock=Math.min(
    store.maxStock,
    store.stock+25
  );

  store.baseIncome*=1.18;

  store.condition=
    clamp(
      store.condition+8,
      0,
      100
    );

  store.satisfaction=
    clamp(
      store.satisfaction+5,
      0,
      100
    );

  saveGame();
  render();

  toast(
    "⬆️ "+
    store.name+
    " upgraded to Level "+
    store.level
  );

  openShop(index);
}

function renovateShop(index){

  const store=game.stores[index];

  if(!store) return;

  if(game.cash<750){
    toast("You need £750.");
    return;
  }

  if(
    store.renovatingUntil &&
    Date.now()<store.renovatingUntil
  ){
    toast("Already renovating.");
    return;
  }

  game.cash-=750;

  store.renovatingUntil=
    Date.now()+15000;

  store.condition=
    clamp(
      store.condition+20,
      0,
      100
    );

  setTimeout(()=>{
    store.renovatingUntil=0;
    saveGame();
    render();
  },15000);

  saveGame();
  render();

  toast("🔨 Renovation started.");
}

function advertiseShop(index){

  const store=game.stores[index];

  if(!store) return;

  if(game.cash<500){
    toast("You need £500.");
    return;
  }

  game.cash-=500;

  store.customers+=
    Math.floor(
      10+
      Math.random()*15
    );

  store.satisfaction=
    clamp(
      store.satisfaction+4,
      0,
      100
    );

  game.reputation=
    clamp(
      game.reputation+2,
      0,
      100
    );

  game.marketShare=
    clamp(
      game.marketShare+.3,
      0,
      100
    );

  saveGame();
  render();

  toast("📣 Advertising brought in new customers!");
  openShop(index);
}

function orderStock(index){

  const store=game.stores[index];

  if(!store) return;

  if(game.cash<250){
    toast("You need £250.");
    return;
  }

  game.cash-=250;

  store.stock=
    Math.min(
      store.maxStock,
      store.stock+50
    );

  store.satisfaction=
    clamp(
      store.satisfaction+3,
      0,
      100
    );

  saveGame();
  render();

  toast("📦 Delivery arrived!");
  openShop(index);
}

    level:1,
    condition:55,

    customers:20,
    upgrades:0,

    maxStock:100,
    renovatingUntil:0,
    openingUntil:0,

    property.name+

}

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renameCompany(){

  const input=
    document.getElementById("companyInput");

  const name=input.value.trim();

  if(!name){
    toast("Enter a company name.");

  game.company=name;

    document.getElementById(
      "kingsHQSign"

const ACHIEVEMENTS=[
  ["firstShop","🏪 First Store","Own your first store."],
  ["fiveStores","🏙️ Growing Empire","Own 5 stores."],
  ["tenMillion","💰 Big Money","Have £1,000,000."],
  ["adam","🧠 Natural Manager","Hire Adam."],
  ["rival","👑 Rival Defeated","Acquire King's Mart."],
  ["products","📦 Product Machine","Sell 10,000 products."],
  ["reputation","⭐ Famous","Reach 100 reputation."]
];

function checkAchievements(){

  const totalProducts=
    game.stores.reduce(
      (a,s)=>a+(s.productsSold||0),
      0
    );

  const checks={
    firstShop:game.stores.length>=1,
    fiveStores:game.stores.length>=5,
    tenMillion:game.cash>=1000000,
    adam:hasAdam(),
    rival:game.rival.acquired,
    products:totalProducts>=10000,
    reputation:game.reputation>=100
  };

  ACHIEVEMENTS.forEach(a=>{

    const id=a[0];

    if(checks[id] &&
       !game.achievements.includes(id)){

      game.achievements.push(id);

      toast(
        "🏆 Achievement: "+
        a[1]
      );
    }
  });
}

function openAchievements(){

  let html="";

  ACHIEVEMENTS.forEach(a=>{

    const unlocked=
      game.achievements.includes(a[0]);

    html+=`
      <div class="card"

        <strong>
          ${unlocked?"✓ ":"🔒 "}
          ${a[1]}
        </strong>
        <div style="
          margin-top:5px;
          color:#aeb6bd;
        ">

}

/* ============================================================
   BUILDING RENDER
============================================================ */

function renderBuildings(){

  for(let i=0;i<4;i++){

    const el=
      document.getElementById(
        "shopBuilding"+i
      );

    const sign=
      document.getElementById(
        "shopSign"+i
      );

    const badge=
      document.getElementById(
        "shopLevel"+i
      );

    if(!el) continue;

    const property=
      game.properties.find(
        p=>p.slot===i+1
      );

    let store=null;

    if(property && property.bought)
      store=game.stores[property.storeIndex];

    if(store){

      el.classList.remove(
        "abandoned",
        "rival-building"
      );

      el.classList.add("owned");

      sign.textContent=
        store.name;

      badge.textContent=
        store.level;

    }else{

      el.classList.remove(
        "owned",
        "rival-building"
      );

      el.classList.add("abandoned");

      sign.textContent=
        property
          ? property.name
          : "EMPTY";

      badge.textContent="—";
    }
  }

  const hq=
    document.getElementById("kingsHQ");

  const express=
    document.getElementById("kingsExpress");

  if(game.rival.acquired){

    hq.classList.remove("rival-building");
    hq.classList.add("acquired");

    express.classList.remove("rival-building");
    express.classList.add("acquired");

    document.getElementById(
      "kingsHQSign"
    ).textContent=
      game.company+" HQ";

    document.getElementById(
      "kingsExpressSign"
    ).textContent=
      game.company+" Express";

  }else{

    hq.classList.remove("acquired");
    hq.classList.add("rival-building");

    express.classList.remove("acquired");
    express.classList.add("rival-building");

    document.getElementById(
      "kingsHQSign"
    ).textContent="KING'S MART";

    document.getElementById(
      "kingsExpressSign"
    ).textContent="KING'S EXPRESS";
  }
}

let people=[];

function createPeople(){

  const layer=
    document.getElementById(
      "peopleLayer"
    );

  layer.innerHTML="";
  people=[];

  const count=
    clamp(
      Math.floor(
        game.customers/12
      ),
      8,
      24
    );

  for(let i=0;i<count;i++){

    const el=
      document.createElement("div");

    el.className="person";

    const rival=
      i%5===0 &&
      !game.rival.acquired;

    if(rival)
      el.classList.add("rival-person");

    layer.appendChild(el);

    const route=
      PEOPLE_ROUTES[
        i%PEOPLE_ROUTES.length
      ];

    people.push({
      el,
      route,
      point:i%route.length,
      x:route[i%route.length][0],
      y:route[i%route.length][1],
      speed:.8+Math.random()*.35,
      targetTime:0
    });
  }
}

function updatePeople(dt){

  people.forEach(person=>{

    if(!person.route.length)
      return;

    const target=
      person.route[
        (person.point+1)%
        person.route.length
      ];

    const dx=
      target[0]-person.x;

    const dy=
      target[1]-person.y;

    const dist=
      Math.sqrt(
        dx*dx+
        dy*dy
      );

    if(dist<.35){

      person.point=
        (person.point+1)%
        person.route.length;

      return;
    }

    const move=
      person.speed*
      dt;

    person.x+=
      dx/dist*move;

    person.y+=
      dy/dist*move;

    person.el.style.left=
      person.x+"%";

    person.el.style.top=
      person.y+"%";
  });
}

let cars=[];

const CAR_ROUTES=[
  [[0,9],[16,9],[38,9],[51,9],[76,9],[90,9],[100,9]],

  [[0,35],[16,35],[38,35],[51,35],[76,35],[90,35],[100,35]],

  [[0,61],[16,61],[38,61],[51,61],[76,61],[90,61],[100,61]],

  [[0,78],[16,78],[38,78],[51,78],[76,78],[90,78],[100,78]],

  [[16,0],[16,9],[16,35],[16,61],[16,78],[16,100]],

  [[38,0],[38,9],[38,35],[38,61],[38,78],[38,100]],

  [[76,0],[76,9],[76,35],[76,61],[76,78],[76,100]],

  [[90,0],[90,9],[90,35],[90,61],[90,78],[90,100]]
];

function createCars(){

  const layer=
    document.getElementById(
      "carsLayer"
    );

  layer.innerHTML="";
  cars=[];

  const colours=[
    "red",
    "blue",
    "yellow",
    "green"
  ];

  for(let i=0;i<12;i++){

    const el=
      document.createElement("div");

    el.className=
      "car "+
      colours[i%colours.length];

    layer.appendChild(el);

    const route=
      CAR_ROUTES[
        i%CAR_ROUTES.length
      ];

    cars.push({
      el,
      route,
      segment:i%Math.max(1,route.length-1),
      t:(i*.17)%1,
      speed:.012+Math.random()*.008
    });
  }
}

function updateCars(dt){

  cars.forEach(car=>{

    const a=
      car.route[car.segment];

    const b=
      car.route[
        (car.segment+1)%
        car.route.length
      ];

    car.t+=
      car.speed*
      dt*
      60;

    if(car.t>=1){

      car.t=0;

      car.segment=
        (car.segment+1)%
        Math.max(
          1,
          car.route.length-1
        );
    }

    const x=
      a[0]+
      (b[0]-a[0])*car.t;

    const y=
      a[1]+
      (b[1]-a[1])*car.t;

    car.el.style.left=x+"%";
    car.el.style.top=y+"%";

    const angle=
      Math.atan2(
        b[1]-a[1],
        b[0]-a[0]
      )*
      180/
      Math.PI;

    car.el.style.transform=
      `translate(-50%,-50%) rotate(${angle}deg)`;
  });
}

/* ============================================================
   CAMERA
   Clash-of-Clans style
============================================================ */

const camera={
  x:0,
  y:0,

  /*
    Start slightly zoomed out.
    Maximum zoom OUT is now much further than before.
  */
  zoom:0.78,

  minZoom:0.48,
  maxZoom:2.4,

  dragging:false,
  moved:false,

  startX:0,
  startY:0,
  startCamX:0,
  startCamY:0,

  pinchStartDistance:0,
  pinchStartZoom:0
};

const world=
  document.getElementById("world");

const content=
  document.getElementById("worldContent");

function applyCamera(){

  content.style.transform=
    `translate(${camera.x}px,${camera.y}px) scale(${camera.zoom})`;
}

function clampCamera(){

  const rect=
    world.getBoundingClientRect();

  const contentWidth=
    world.clientWidth*
    camera.zoom;

  const contentHeight=
    world.clientHeight*
    camera.zoom;

  const maxX=
    Math.max(
      0,
      (contentWidth-world.clientWidth)
    );

  const maxY=
    Math.max(
      0,
      (contentHeight-world.clientHeight)
    );

  camera.x=
    clamp(
      camera.x,
      -maxX,
      0
    );

  camera.y=
    clamp(
      camera.y,
      -maxY,
      0
    );
}

function zoomAt(clientX,clientY,newZoom){

  const rect=
    world.getBoundingClientRect();

  const px=
    clientX-rect.left;

  const py=
    clientY-rect.top;

  const oldZoom=
    camera.zoom;

  newZoom=
    clamp(
      newZoom,
      camera.minZoom,
      camera.maxZoom
    );

  const worldX=
    (px-camera.x)/
    oldZoom;

  const worldY=
    (py-camera.y)/
    oldZoom;

  camera.zoom=newZoom;

  camera.x=
    px-
    worldX*newZoom;

  camera.y=
    py-
    worldY*newZoom;

  clampCamera();
  applyCamera();
}

/*
  Touch controls:
  One finger = move city.
  Two fingers = pinch zoom.
*/

function distance(t1,t2){

  const dx=
    t1.clientX-
    t2.clientX;

  const dy=
    t1.clientY-
    t2.clientY;

  return Math.sqrt(
    dx*dx+
    dy*dy
  );
}

world.addEventListener(
  "touchstart",
  e=>{

    if(e.touches.length===1){

      const t=e.touches[0];

      camera.dragging=true;
      camera.moved=false;

      camera.startX=t.clientX;
      camera.startY=t.clientY;

      camera.startCamX=camera.x;
      camera.startCamY=camera.y;

    }else if(e.touches.length===2){

      camera.dragging=false;

      camera.pinchStartDistance=
        distance(
          e.touches[0],
          e.touches[1]
        );

      camera.pinchStartZoom=
        camera.zoom;
    }

  },
  {passive:false}
);

world.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    if(e.touches.length===2){

      const d=
        distance(
          e.touches[0],
          e.touches[1]
        );

      if(camera.pinchStartDistance>0){

        const ratio=
          d/
          camera.pinchStartDistance;

        const newZoom=
          camera.pinchStartZoom*
          ratio;

        const cx=
          (e.touches[0].clientX+
           e.touches[1].clientX)/2;

        const cy=
          (e.touches[0].clientY+
           e.touches[1].clientY)/2;

        zoomAt(
          cx,
          cy,
          newZoom
        );
      }

      return;
    }

    if(e.touches.length!==1)
      return;

    if(!camera.dragging)
      return;

    const t=e.touches[0];

    const dx=
      t.clientX-camera.startX;

    const dy=
      t.clientY-camera.startY;

    if(
      Math.abs(dx)>5 ||
      Math.abs(dy)>5
    ){
      camera.moved=true;
    }

    camera.x=
      camera.startCamX+
      dx;

    camera.y=
      camera.startCamY+
      dy;

    clampCamera();
    applyCamera();

  },
  {passive:false}
);

world.addEventListener(
  "touchend",
  ()=>{
    camera.dragging=false;
  },
  {passive:false}
);

/* Mouse / desktop */

let mouseDown=false;
let mouseStartX=0;
let mouseStartY=0;
let mouseStartCamX=0;
let mouseStartCamY=0;
let mouseMoved=false;

world.addEventListener(
  "mousedown",
  e=>{

    mouseDown=true;
    mouseMoved=false;

    mouseStartX=e.clientX;
    mouseStartY=e.clientY;

    mouseStartCamX=camera.x;
    mouseStartCamY=camera.y;
  }
);

window.addEventListener(
  "mousemove",
  e=>{

    if(!mouseDown)
      return;

    const dx=
      e.clientX-mouseStartX;

    const dy=
      e.clientY-mouseStartY;

    if(
      Math.abs(dx)>5 ||
      Math.abs(dy)>5
    )
      mouseMoved=true;

    camera.x=
      mouseStartCamX+dx;

    camera.y=
      mouseStartCamY+dy;

    clampCamera();
    applyCamera();
  }
);

window.addEventListener(
  "mouseup",
  ()=>{
    mouseDown=false;
  }
);

world.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    const factor=
      e.deltaY<0
        ? 1.12
        : .89;

    zoomAt(
      e.clientX,
      e.clientY,
      camera.zoom*factor
    );
  },
  {passive:false}
);

/*
  Prevent a drag from accidentally pressing
  a shop when the player was moving the map.
*/

world.addEventListener(
  "click",
  e=>{

    if(camera.moved){

      e.preventDefault();
      e.stopPropagation();

      camera.moved=false;
    }
  },
  true
);
