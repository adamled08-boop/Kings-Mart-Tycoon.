<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>King's Mart Tycoon</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#111a20;
  color:white;
}

button{
  font-family:inherit;
  cursor:pointer;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#80a960;
}

/* =========================================================
   HUD
========================================================= */

#topBar{
  position:absolute;
  z-index:1000;
  top:0;
  left:0;
  width:100%;
  height:67px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  background:#111b22;
  border-bottom:3px solid #354852;
  box-shadow:0 4px 14px #0008;
}

.logo{
  min-width:190px;
  color:#ffd447;
  font-size:19px;
  font-weight:1000;
}

.stat{
  min-width:92px;
  height:47px;
  padding:5px 9px;
  border-radius:8px;
  background:#1d2b33;
  border:1px solid #41535d;
}

.stat small{
  display:block;
  color:#94a8b2;
  font-size:9px;
  text-transform:uppercase;
}

.stat strong{
  display:block;
  margin-top:3px;
  font-size:14px;
}

#companyName{
  color:#ffd447;
}

/* =========================================================
   WORLD
========================================================= */

#world{
  position:absolute;
  left:0;
  top:67px;
  width:100%;
  height:calc(100% - 127px);
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      #87ae68 0%,
      #79a45d 50%,
      #83aa64 100%
    );
}

/* subtle city districts */

.district{
  position:absolute;
  z-index:1;
  opacity:.35;
  background:#6e9956;
}

.district.one{
  left:0;
  top:0;
  width:31%;
  height:48%;
}

.district.two{
  left:0;
  bottom:0;
  width:47%;
  height:39%;
}

.district.three{
  right:0;
  top:0;
  width:28%;
  height:44%;
}

.district.four{
  right:0;
  bottom:0;
  width:28%;
  height:38%;
}

/* =========================================================
   RIVER
========================================================= */

#river{
  position:absolute;
  z-index:50;
  left:57%;
  top:0;
  width:12%;
  height:100%;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 25px,
      #d7f4ff22 25px 27px
    ),
    linear-gradient(
      90deg,
      #3a8fb7,
      #58b9dc,
      #3c94bb
    );
  border-left:5px solid #27799d;
  border-right:5px solid #27799d;
}

.riverLabel{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-90deg);
  white-space:nowrap;
  font-size:11px;
  font-weight:bold;
  letter-spacing:5px;
  color:#e3f7ff;
  opacity:.65;
}

/* =========================================================
   ROADS
========================================================= */

.road{
  position:absolute;
  z-index:20;
  background:#474c50;
  box-shadow:inset 0 0 0 2px #383d40;
}

.road.horizontal{
  left:0;
  width:100%;
  height:54px;
}

.road.vertical{
  top:0;
  width:54px;
  height:100%;
}

.h1{top:20%}
.h2{top:51%}
.h3{top:78%}

.v1{left:16%}
.v2{left:38%}
.v3{left:51%}
.v4{left:76%}
.v5{left:89%}

.road.horizontal::after{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  height:2px;
  background:repeating-linear-gradient(
    90deg,
    #eadc82 0 26px,
    transparent 26px 51px
  );
}

.road.vertical::after{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:2px;
  height:100%;
  background:repeating-linear-gradient(
    0deg,
    #eadc82 0 26px,
    transparent 26px 51px
  );
}

/* intersections */

.intersection{
  position:absolute;
  z-index:23;
  width:54px;
  height:54px;
  background:#474c50;
}

/* =========================================================
   PAVEMENTS
========================================================= */

.pavement{
  position:absolute;
  z-index:28;
  background:#c9c5b5;
  border:2px solid #aaa697;
  box-shadow:0 1px 2px #0003;
}

.pavement.horizontal{
  left:0;
  width:100%;
  height:12px;
}

.pavement.vertical{
  top:0;
  width:12px;
  height:100%;
}

.p1{
  top:calc(20% + 60px);
}

.p2{
  top:calc(51% + 60px);
}

.p3{
  top:calc(78% + 60px);
}

.pv1{
  left:calc(16% - 13px);
}

.pv2{
  left:calc(38% - 13px);
}

.pv3{
  left:calc(51% + 60px);
}

/* crossing stripes */

.crossing{
  position:absolute;
  z-index:31;
  width:48px;
  height:12px;
  background:repeating-linear-gradient(
    90deg,
    white 0 5px,
    transparent 5px 10px
  );
  opacity:.85;
}

.crossA{
  left:16%;
  top:calc(51% + 60px);
}

.crossB{
  left:38%;
  top:calc(51% + 60px);
}

.crossC{
  left:51%;
  top:calc(51% + 60px);
}

.crossD{
  left:76%;
  top:calc(51% + 60px);
}

/* =========================================================
   ROUNDABOUT
========================================================= */

#roundabout{
  position:absolute;
  z-index:40;
  left:29%;
  top:47%;
  width:185px;
  height:185px;
  transform:translate(-50%,-50%);
}

.roundRoad{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#44494c;
  border:4px solid #353a3d;
  box-shadow:0 6px 12px #0005;
}

.roundMarkings{
  position:absolute;
  inset:15px;
  border-radius:50%;
  border:3px dashed #e6d675;
}

.roundIsland{
  position:absolute;
  inset:55px;
  border-radius:50%;
  background:#6fa357;
  border:6px solid #568a47;
}

.roundTree{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#34733d;
  border:3px solid #4d914d;
}

.rt1{left:72px;top:63px}
.rt2{left:101px;top:78px}
.rt3{left:73px;top:103px}

/* arrows */

.roundArrow{
  position:absolute;
  color:#e6d675;
  font-size:19px;
  font-weight:bold;
}

.ra1{top:13px;left:83px}
.ra2{right:14px;top:80px}
.ra3{bottom:12px;left:83px}
.ra4{left:13px;top:80px}

/* =========================================================
   BRIDGES
========================================================= */

.bridge{
  position:absolute;
  z-index:70;
  left:51%;
  width:25%;
  height:65px;
  background:
    repeating-linear-gradient(
      90deg,
      #696f73 0 18px,
      #7b8184 18px 22px
    );
  border-top:6px solid #292e31;
  border-bottom:6px solid #292e31;
}

.bridge.one{top:17%}
.bridge.two{top:75%}

.bridgeText{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:9px;
  font-weight:bold;
  letter-spacing:2px;
}

/* =========================================================
   GRASS PLOTS
========================================================= */

.plot{
  position:absolute;
  z-index:8;
  background:#709b55;
  border:3px solid #638b4e;
  border-radius:12px;
  box-shadow:
    inset 0 0 0 2px #86b366,
    0 3px 5px #0002;
}

.plot::after{
  content:"";
  position:absolute;
  inset:6px;
  border:1px dashed #94b977;
  border-radius:8px;
  pointer-events:none;
}

/*
  These plots deliberately leave room
  between buildings, roads and pavements.
*/

.plot1{
  left:4%;
  top:5%;
  width:27%;
  height:25%;
}

.plot2{
  left:21%;
  top:29%;
  width:18%;
  height:18%;
}

.plot3{
  left:3%;
  top:59%;
  width:28%;
  height:25%;
}

.plot4{
  left:23%;
  top:68%;
  width:18%;
  height:20%;
}

.plot5{
  right:3%;
  top:7%;
  width:25%;
  height:31%;
}

.plot6{
  right:6%;
  top:56%;
  width:20%;
  height:22%;
}

/* =========================================================
   LOW POLY BUILDINGS
========================================================= */

.building{
  position:absolute;
  z-index:100;
  overflow:visible;
}

.buildingBody{
  position:absolute;
  inset:0;
  overflow:hidden;
  border:3px solid #42494c;
  border-radius:5px;
  box-shadow:
    0 8px 9px #0005,
    inset 0 0 0 2px #ffffff22;
}

.buildingRoof{
  position:absolute;
  z-index:5;
  left:-6%;
  top:-12%;
  width:112%;
  height:34%;
  background:#343b3f;
  clip-path:polygon(
    4% 38%,
    50% 0,
    96% 38%,
    100% 100%,
    0 100%
  );
}

.windowRow{
  position:absolute;
  z-index:8;
  left:8%;
  right:8%;
  top:30%;
  height:28%;
  display:flex;
  gap:4px;
}

.window{
  flex:1;
  background:#75bdd2;
  border:2px solid #35474e;
  box-shadow:inset 0 0 5px #fff5;
}

.shopFront{
  position:absolute;
  z-index:6;
  left:0;
  bottom:0;
  width:100%;
  height:39%;
  background:#7c4f28;
  border-top:3px solid #4e321d;
}

.door{
  position:absolute;
  z-index:12;
  left:50%;
  bottom:0;
  width:23%;
  height:34%;
  transform:translateX(-50%);
  background:#2c2824;
  border:2px solid #1d1b19;
}

.playerBuilding .buildingBody{
  background:#e0b52f;
  border-color:#f2d35d;
}

.playerBuilding .buildingRoof{
  background:#59646a;
}

.playerBuilding .shopFront{
  background:#855226;
}

.abandonedBuilding .buildingBody{
  background:#666;
  border-color:#4d4d4d;
}

.abandonedBuilding .buildingRoof{
  background:#46494a;
}

.abandonedBuilding .shopFront{
  background:#50463d;
}

.rivalBuilding .buildingBody{
  background:#cdd4d8;
  border-color:#39444a;
}

.rivalBuilding .buildingRoof{
  background:#283137;
}

.rivalBuilding .shopFront{
  background:#56636a;
}

.buildingNameSign{
  position:absolute;
  z-index:200;
  left:50%;
  top:-33px;
  transform:translateX(-50%);
  min-width:125%;
  padding:5px 8px;
  text-align:center;
  white-space:nowrap;
  background:#dfad20;
  color:#211b08;
  border:2px solid #fff0a0;
  border-radius:5px;
  font-size:10px;
  font-weight:1000;
  box-shadow:0 3px 5px #0007;
}

.abandonedBuilding .buildingNameSign{
  background:#555;
  color:#ddd;
  border-color:#777;
}

.rivalBuilding .buildingNameSign{
  background:#b72129;
  color:white;
  border-color:#f2686d;
}

.levelBadge{
  position:absolute;
  z-index:205;
  right:-7px;
  top:-8px;
  padding:3px 6px;
  border-radius:10px;
  background:#172027;
  border:2px solid white;
  font-size:8px;
  font-weight:bold;
}

/* =========================================================
   PLAYER BUILDING POSITIONS
========================================================= */

/*
  Buildings sit inside plots.
  None overlap roads.
*/

#shop1{
  left:8%;
  top:10%;
  width:100px;
  height:72px;
}

#shop2{
  left:24%;
  top:33%;
  width:82px;
  height:61px;
}

#shop3{
  left:8%;
  top:64%;
  width:103px;
  height:74px;
}

#shop4{
  left:27%;
  top:72%;
  width:83px;
  height:62px;
}

/* =========================================================
   KING'S MART
========================================================= */

#kingsHQ{
  position:absolute;
  z-index:110;
  right:7%;
  top:12%;
  width:160px;
  height:125px;
}

.kingsLogo{
  position:absolute;
  z-index:20;
  left:7%;
  right:7%;
  top:26%;
  height:28%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#c1222b;
  border:3px solid #85151b;
  color:white;
  border-radius:4px;
  font-size:15px;
  font-weight:1000;
  box-shadow:0 3px 5px #0006;
}

.kingsWindows{
  position:absolute;
  z-index:14;
  left:6%;
  right:6%;
  bottom:32%;
  height:18%;
  display:flex;
  gap:3px;
}

.kingsWindows span{
  flex:1;
  background:#78c6dd;
  border:2px solid #3b4b52;
}

.kingsEntrance{
  position:absolute;
  z-index:20;
  left:38%;
  bottom:0;
  width:24%;
  height:31%;
  background:#27343b;
  border:3px solid #182126;
}

.kingsCustomerCount{
  position:absolute;
  z-index:250;
  left:50%;
  top:-50px;
  transform:translateX(-50%);
  padding:5px 9px;
  border-radius:13px;
  background:#971b23;
  border:2px solid #ef646a;
  font-size:9px;
  font-weight:1000;
  white-space:nowrap;
}

#kingsStore2{
  position:absolute;
  z-index:110;
  right:9%;
  top:59%;
  width:105px;
  height:76px;
}

/* =========================================================
   STREET DETAILS
========================================================= */

.lamp{
  position:absolute;
  z-index:35;
  width:5px;
  height:24px;
  background:#303437;
}

.lamp::before{
  content:"";
  position:absolute;
  left:-5px;
  top:-3px;
  width:14px;
  height:7px;
  border-radius:50%;
  background:#f6e7a0;
  box-shadow:0 0 8px #f6e7a088;
}

.lamp.a{left:13%;top:43%}
.lamp.b{left:43%;top:14%}
.lamp.c{left:47%;top:70%}
.lamp.d{right:29%;top:44%}
.lamp.e{right:4%;top:46%}

.park{
  position:absolute;
  z-index:9;
  left:43%;
  top:6%;
  width:10%;
  height:15%;
  border-radius:14px;
  background:#6a9952;
  border:3px solid #598448;
}

.park::before{
  content:"PARK";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:9px;
  color:#cde4ae;
  font-weight:bold;
}

.bench{
  position:absolute;
  z-index:30;
  width:26px;
  height:7px;
  background:#754d2c;
  border:2px solid #51341f;
}

.bench.a{left:45%;top:10%}
.bench.b{right:24%;top:47%}

.parking{
  position:absolute;
  z-index:15;
  width:120px;
  height:46px;
  display:flex;
  gap:5px;
  padding:6px;
  background:#697077;
  border:2px solid #50565b;
}

.parking span{
  flex:1;
  border-left:2px solid #d9d9d9;
  transform:skew(-15deg);
}

.parking.a{
  left:11%;
  top:44%;
}

.parking.b{
  right:9%;
  top:41%;
}

/* =========================================================
   PEOPLE
========================================================= */

#peopleLayer{
  position:absolute;
  inset:0;
  z-index:500;
  pointer-events:none;
}

.person{
  position:absolute;
  width:8px;
  height:13px;
  border-radius:50% 50% 3px 3px;
  background:#ffd1aa;
  box-shadow:0 2px 2px #0006;
  transform:translate(-50%,-50%);
}

.person::after{
  content:"";
  position:absolute;
  left:-2px;
  top:6px;
  width:12px;
  height:8px;
  border-radius:2px;
  background:#3e6da2;
}

.person.red::after{
  background:#b7242c;
}

.person.walking{
  transition:
    left 7s linear,
    top 7s linear;
}

/* =========================================================
   CARS
========================================================= */

#carsLayer{
  position:absolute;
  inset:0;
  z-index:600;
  pointer-events:none;
}

.car{
  position:absolute;
  width:23px;
  height:12px;
  border-radius:4px;
  border:2px solid #202326;
  transform:translate(-50%,-50%);
  box-shadow:0 2px 3px #0007;
}

.car::before,
.car::after{
  content:"";
  position:absolute;
  bottom:-4px;
  width:5px;
  height:4px;
  background:#111;
  border-radius:2px;
}

.car::before{left:2px}
.car::after{right:2px}

.car.red{background:#d43a3a}
.car.blue{background:#3d79b9}
.car.yellow{background:#ddba36}
.car.white{background:#e7e7e7}
.car.black{background:#25292b}

/* =========================================================
   BOTTOM BAR
========================================================= */

#bottomBar{
  position:absolute;
  z-index:1000;
  left:0;
  bottom:0;
  width:100%;
  height:60px;
  display:flex;
  justify-content:center;
  gap:7px;
  padding:7px;
  background:#111b22;
  border-top:3px solid #354852;
}

.navButton{
  min-width:100px;
  border:1px solid #435761;
  border-radius:7px;
  background:#1e2d35;
  color:white;
  font-weight:bold;
}

.navButton.company{
  color:#ffd447;
}

/* =========================================================
   PANEL
========================================================= */

#panel{
  display:none;
  position:absolute;
  z-index:2000;
  right:15px;
  top:83px;
  width:315px;
  max-height:calc(100vh - 150px);
  overflow:auto;
  padding:15px;
  border-radius:12px;
  background:#17232b;
  border:3px solid #40545f;
  box-shadow:0 10px 25px #0009;
}

#panel.show{
  display:block;
}

.closePanel{
  position:absolute;
  right:7px;
  top:7px;
  width:27px;
  height:27px;
  border:0;
  border-radius:50%;
  background:#3b484f;
  color:white;
}

.panelTitle{
  margin-bottom:12px;
  color:#ffd447;
  font-size:19px;
  font-weight:1000;
}

.panelSection{
  margin-bottom:9px;
  padding:10px;
  border-radius:8px;
  background:#203039;
  line-height:1.45;
}

.action{
  width:100%;
  padding:10px;
  margin-top:7px;
  border:0;
  border-radius:7px;
  background:#dfad20;
  color:#211b08;
  font-weight:1000;
}

.action.dark{
  background:#354952;
  color:white;
}

.action.red{
  background:#c32932;
  color:white;
}

input{
  width:100%;
  padding:10px;
  margin-top:7px;
  border:2px solid #4b606b;
  border-radius:7px;
  background:#10181d;
  color:white;
  font-size:16px;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:absolute;
  z-index:3000;
  left:50%;
  top:80px;
  transform:translateX(-50%) translateY(-10px);
  opacity:0;
  padding:10px 16px;
  border-radius:9px;
  background:#17242b;
  border:2px solid #ffd447;
  box-shadow:0 5px 12px #0007;
  font-weight:bold;
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  #topBar{
    height:55px;
    gap:4px;
    padding:4px;
  }

  .logo{
    min-width:112px;
    font-size:11px;
  }

  .stat{
    min-width:61px;
    height:42px;
    padding:4px;
  }

  .stat small{
    font-size:7px;
  }

  .stat strong{
    font-size:10px;
  }

  #world{
    top:55px;
    height:calc(100% - 109px);
  }

  #bottomBar{
    height:54px;
  }

  .navButton{
    min-width:72px;
    font-size:9px;
  }

  #panel{
    top:62px;
    right:7px;
    width:calc(100vw - 14px);
  }

  #roundabout{
    transform:translate(-50%,-50%) scale(.7);
  }

  #kingsHQ{
    width:140px;
    height:105px;
  }

  .buildingNameSign{
    font-size:8px;
  }

}
</style>
</head>

<body>

<div id="game">

<!-- =======================================================
     HUD
======================================================= -->

<div id="topBar">

  <div class="logo">
    👑 KING'S MART TYCOON
  </div>

  <div class="stat">
    <small>Company</small>
    <strong id="companyName">Your Company</strong>
  </div>

  <div class="stat">
    <small>Cash</small>
    <strong id="cash">£5,000</strong>
  </div>

  <div class="stat">
    <small>Income</small>
    <strong id="income">£12/s</strong>
  </div>

  <div class="stat">
    <small>Customers</small>
    <strong id="customers">42</strong>
  </div>

  <div class="stat">
    <small>Market</small>
    <strong id="market">8%</strong>
  </div>

<script>

/* =========================================================
   GAME STATE
========================================================= */

const SAVE_KEY =
  "kings_mart_tycoon_city_v9";


let game = {

  company:"Your Company",

  cash:5000,

  reputation:50,

  marketShare:8,

  customers:42,

  totalStores:1,

  selectedShop:0,

  staff:[],

  properties:[

    {
      name:"Old Corner Shop",
      price:2200,
      bought:false,
      storeIndex:null
    },

    {
      name:"Empty High Street",
      price:3500,
      bought:false,
      storeIndex:null
    },

    {
      name:"Abandoned Supermarket",
      price:4800,
      bought:false,
      storeIndex:null
    }

  ],

  stores:[

    {
      name:"My Mart",
      level:1,
      condition:65,
      baseIncome:12,
      customers:42,
      upgrades:0
    }

  ],

  rival:{

    name:"King's Mart",

    customers:220,

    health:100,

    marketShare:32,

    income:95,

    stage:"HEALTHY"

  },

  lastSave:Date.now()

};


/* =========================================================
   LOAD / MIGRATE OLD SAVES
========================================================= */

function loadGame(){

  const possibleKeys=[

    SAVE_KEY,

    "kings_mart_tycoon_city_v8",

    "kings_mart_tycoon_city_v7",

    "kings_mart_tycoon_v5"

  ];


  let saved=null;

  let oldKey=null;


  for(const key of possibleKeys){

    const data=
      localStorage.getItem(key);

    if(data){

      saved=data;

      oldKey=key;

      break;

    }

  }


  if(!saved) return;


  try{

    const old=
      JSON.parse(saved);


    game={
      ...game,
      ...old
    };


    /*
      Make sure newer systems
      always have the required arrays.
    */

    if(!Array.isArray(game.stores))
      game.stores=[];

    if(!Array.isArray(game.properties))
      game.properties=[];

    if(!Array.isArray(game.staff))
      game.staff=[];


    /*
      Add any missing properties.
    */

    const defaults=[

      {
        name:"Old Corner Shop",
        price:2200
      },

      {
        name:"Empty High Street",
        price:3500
      },

      {
        name:"Abandoned Supermarket",
        price:4800
      }

    ];


    defaults.forEach(
      (item,index)=>{

        if(!game.properties[index]){

          game.properties[index]={
            ...item,
            bought:false,
            storeIndex:null
          };

        }

      }
    );


    /*
      Fix missing store fields.
    */

    game.stores.forEach(
      shop=>{

        shop.level=
          shop.level||1;

        shop.condition=
          shop.condition||50;

        shop.baseIncome=
          shop.baseIncome||12;

        shop.customers=
          shop.customers||10;

        shop.upgrades=
          shop.upgrades||0;

      }
    );


    /*
      Old abandoned purchases can be
      restored as player buildings.
    */

    game.properties.forEach(
      property=>{

        if(
          property.bought &&
          property.storeIndex===null
        ){

          property.bought=false;

        }

      }
    );


    if(oldKey!==SAVE_KEY){

      saveGame();

    }

  }catch(error){

    console.log(
      "Save migration error",
      error
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  game.lastSave=Date.now();

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(game)
  );

}


/* =========================================================
   OFFLINE EARNINGS
========================================================= */

function offlineIncome(){

  const elapsed=
    Math.min(
      28800,
      Math.floor(
        (Date.now()-game.lastSave)/1000
      )
    );


  if(elapsed<=10) return;


  const amount=
    Math.floor(
      getIncome()*elapsed
    );


  if(amount>0){

    game.cash+=amount;

    toast(
      "💰 Offline earnings +"+
      formatMoney(amount)
    );

  }

}


/* =========================================================
   ECONOMY
========================================================= */

function getIncome(){

  return game.stores.reduce(
    (total,shop)=>{

      return total+
        shop.baseIncome+
        ((shop.level-1)*10)+
        (shop.upgrades*8);

    },
    0
  );

}


function formatMoney(value){

  return "£"+
    Math.floor(value)
      .toLocaleString();

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  document.getElementById(
    "companyName"
  ).textContent=
    game.company;


  document.getElementById(
    "cash"
  ).textContent=
    formatMoney(game.cash);


  document.getElementById(
    "income"
  ).textContent=
    formatMoney(getIncome())+"/s";


  document.getElementById(
    "customers"
  ).textContent=
    Math.floor(game.customers);


  document.getElementById(
    "market"
  ).textContent=
    game.marketShare.toFixed(1)+"%";


  document.getElementById(
    "reputation"
  ).textContent=
    Math.floor(game.reputation);


  renderBuildings();

  renderRival();

}


/* =========================================================
   BUILDINGS
========================================================= */

function renderBuildings(){

  if(game.stores[0]){

    document.getElementById(
      "sign0"
    ).textContent=
      game.stores[0].name;


    document.getElementById(
      "badge0"
    ).textContent=
      "LV "+game.stores[0].level;

  }


  const ids=[
    "shop2",
    "shop3",
    "shop4"
  ];


  game.properties.forEach(
    (property,index)=>{

      const building=
        document.getElementById(
          ids[index]
        );


      if(!building) return;


      const sign=
        document.getElementById(
          "sign"+(index+1)
        );


      const badge=
        document.getElementById(
          "badge"+(index+1)
        );


      if(property.bought){

        const shop=
          game.stores[
            property.storeIndex
          ];


        building.classList.remove(
          "abandonedBuilding"
        );

        building.classList.add(
          "playerBuilding"
        );


        if(shop){

          sign.textContent=
            shop.name;

          badge.textContent=
            "LV "+shop.level;

          /*
            Higher levels make the building
            visually slightly more substantial,
            without allowing it to leave its plot.
          */

          const scale=
            Math.min(
              1.12,
              1+
              (shop.level-1)*.035
            );

          building.style.transform=
            "scale("+scale+")";

        }

      }else{

        building.classList.remove(
          "playerBuilding"
        );

        building.classList.add(
          "abandonedBuilding"
        );

        building.style.transform=
          "scale(1)";

        sign.textContent=
          property.name;

        badge.textContent=
          formatMoney(property.price);

      }

    }
  );

}


/* =========================================================
   SHOP
========================================================= */

function openShop(index){

  const shop=
    game.stores[index];


  if(!shop){

    toast(
      "You don't own this shop yet."
    );

    return;

  }


  game.selectedShop=index;


  const upgradeCost=
    1000+
    shop.level*850+
    shop.upgrades*700;


  openPanel(`

    <div class="panelTitle">
      🏪 ${shop.name}
    </div>

    <div class="panelSection">

      <b>Level:</b>
      ${shop.level}

      <br>

      <b>Customers:</b>
      ${Math.floor(shop.customers)}

      <br>

      <b>Condition:</b>
      ${shop.condition}%

      <br>

      <b>Income:</b>
      ${formatMoney(
        shop.baseIncome+
        ((shop.level-1)*10)+
        shop.upgrades*8
      )}/s

    </div>

    <div class="panelSection">

      <b>SHOP DEVELOPMENT</b>

      <button
        class="action"
        onclick="upgradeShop(${index})"
      >
        ⬆️ UPGRADE —
        ${formatMoney(upgradeCost)}
      </button>

      <button
        class="action dark"
        onclick="renovateShop(${index})"
      >
        🔨 RENOVATE — £750
      </button>

      <button
        class="action dark"
        onclick="advertiseShop(${index})"
      >
        📣 ADVERTISE — £500
      </button>

    </div>

  `);

}


/* =========================================================
   UPGRADE
========================================================= */

function upgradeShop(index){

  const shop=
    game.stores[index];


  if(!shop) return;


  const cost=
    1000+
    shop.level*850+
    shop.upgrades*700;


  if(game.cash<cost){

    toast("❌ Not enough cash.");

    return;

  }


  game.cash-=cost;

  shop.level++;

  shop.upgrades++;

  shop.condition=
    Math.min(
      100,
      shop.condition+10
    );

  shop.customers+=12;

  game.customers+=12;

  game.reputation+=2;


  saveGame();

  render();

  openShop(index);

  toast(
    "⬆️ "+
    shop.name+
    " upgraded to Level "+
    shop.level
  );

}


/* =========================================================
   RENOVATE
========================================================= */

function renovateShop(index){

  if(game.cash<750){

    toast("❌ You need £750.");

    return;

  }


  game.cash-=750;


  const shop=
    game.stores[index];


  shop.condition=
    Math.min(
      100,
      shop.condition+20
    );


  shop.customers+=5;

  game.customers+=5;

  game.reputation+=2;


  saveGame();

  render();

  toast(
    "🔨 Shop renovated!"
  );

}


/* =========================================================
   ADVERTISE
========================================================= */

function advertiseShop(index){

  if(game.cash<500){

    toast("❌ You need £500.");

    return;

  }


  game.cash-=500;


  const shop=
    game.stores[index];


  shop.customers+=10;

  game.customers+=10;

  game.marketShare+=.4;

  game.reputation+=1;


  saveGame();

  render();

  toast(
    "📣 Advertising brought customers!"
  );

}


/* =========================================================
   PROPERTIES
========================================================= */

function openProperty(index){

  const property=
    game.properties[index];


  if(!property) return;


  if(property.bought){

    openShop(
      property.storeIndex
    );

    return;

  }


  openPanel(`

    <div class="panelTitle">
      🏚️ ${property.name}
    </div>

    <div class="panelSection">

      This building is abandoned.

      <br><br>

      Purchase it and turn it into
      one of your shops.

      <br><br>

      Price:
      <b>${formatMoney(property.price)}</b>

    </div>

    <button
      class="action"
      onclick="buyProperty(${index})"
    >
      🏗️ BUY BUILDING
    </button>

  `);

}


/* =========================================================
   BUY PROPERTY
========================================================= */

function buyProperty(index){

  const property=
    game.properties[index];


  if(!property){

    return;

  }


  if(property.bought){

    toast(
      "You already own this building."
    );

    return;

  }


  if(game.cash<property.price){

    toast(
      "❌ You need "+
      formatMoney(property.price)
    );

    return;

  }


  game.cash-=property.price;


  const storeIndex=
    game.stores.length;


  property.bought=true;

  property.storeIndex=
    storeIndex;


  game.stores.push({

    name:
      property.name+
      " Mart",

    level:1,

    condition:45,

    baseIncome:15,

    customers:15,

    upgrades:0

  });


  game.totalStores++;

  game.customers+=15;

  game.reputation+=3;


  saveGame();

  render();

  closePanel();


  /*
    Important:
    the building itself is immediately
    changed from grey to yellow.
  */

  toast(
    "🏗️ "+property.name+
    " is now YOUR SHOP!"
  );

}


/* =========================================================
   COMPANY
========================================================= */

function openCompany(){

  openPanel(`

    <div class="panelTitle">
      🏢 COMPANY
    </div>

    <div class="panelSection">

      Company name

      <input
        id="companyInput"
        maxlength="24"
        value="${game.company.replace(
          /"/g,
          "&quot;"
        )}"
      >

      <button
        class="action"
        onclick="changeCompany()"
      >
        SAVE NAME
      </button>

    </div>

    <div class="panelSection">

      <b>Shops:</b>
      ${game.stores.length}

      <br>

      <b>Customers:</b>
      ${Math.floor(game.customers)}

      <br>

      <b>Market Share:</b>
      ${game.marketShare.toFixed(1)}%

      <br>

      <b>Income:</b>
      ${formatMoney(getIncome())}/s

    </div>

  `);

}


function changeCompany(){

  const input=
    document.getElementById(
      "companyInput"
    );


  const value=
    input.value.trim();


  if(!value){

    toast(
      "Please enter a company name."
    );

    return;

  }


  game.company=value;

  saveGame();

  render();

  closePanel();

  toast(
    "🏢 Company renamed!"
  );

}


/* =========================================================
   STAFF
========================================================= */

function openStaff(){

  let html=`

    <div class="panelTitle">
      👥 STAFF
    </div>

  `;


  if(game.staff.length===0){

    html+=`

      <div class="panelSection">
        You haven't hired anyone yet.
      </div>

    `;

  }


  game.staff.forEach(
    person=>{

      html+=`

        <div class="panelSection">

          <b>${person.name}</b>

          <br>

          Age:
          ${person.age}

          <br>

          Intelligence:
          ${person.intelligence}

          <br>

          Management:
          ${person.management}

          <br>

          Stocking:
          ${person.stocking||65}

          <br>

          Customer Service:
          ${person.service}

          <br>

          Problem Solving:
          ${person.problemSolving||70}

        </div>

      `;

    }
  );


  html+=`

    <button
      class="action"
      onclick="hireAdam()"
    >
      👔 HIRE ADAM — £1,000
    </button>

  `;


  openPanel(html);

}


/* =========================================================
   ADAM
========================================================= */

function hireAdam(){

  if(
    game.staff.some(
      person=>person.name==="Adam"
    )
  ){

    toast(
      "Adam already works here."
    );

    return;

  }


  if(game.cash<1000){

    toast(
      "❌ You need £1,000."
    );

    return;

  }


  game.cash-=1000;


  game.staff.push({

    name:"Adam",

    age:18,

    intelligence:100,

    management:95,

    stocking:65,

    service:72,

    problemSolving:100

  });


  game.reputation+=5;


  saveGame();

  render();

  openStaff();

  toast(
    "👔 Adam joined your company!"
  );

}


/* =========================================================
   RIVAL AI
========================================================= */

function rivalAI(){

  const r=
    game.rival;


  if(r.health>75){

    r.stage="HEALTHY";

  }else if(r.health>50){

    r.stage="UNDER PRESSURE";

  }else if(r.health>30){

    r.stage="STRUGGLING";

  }else if(r.health>10){

    r.stage="DISTRESSED";

  }else{

    r.stage="FOR SALE";

  }


  /*
    Customer population follows
    King's Mart's health.
  */

  const maximum=
    Math.max(
      0,
      Math.floor(
        220*
        (r.health/100)
      )
    );


  r.customers=
    Math.min(
      r.customers,
      maximum
    );

}

/* =========================================================
   ATTACK RIVAL
========================================================= */

function attackRival(){

  const loss=
    Math.floor(
      10+
      Math.random()*9
    );


  game.rival.customers=
    Math.max(
      0,
      game.rival.customers-loss
    );


  game.rival.health=
    Math.max(
      0,
      game.rival.health-7
    );


  game.rival.marketShare=
    Math.max(
      0,
      game.rival.marketShare-.65
    );


  game.marketShare+=.5;


  game.customers+=
    Math.floor(
      loss*.65
    );


  game.reputation+=1;


  rivalAI();

  saveGame();

  render();

  createPeople();

  openRival();


  toast(
    "⚔️ King's Mart lost "+
    loss+
    " customers!"
  );

}


/* =========================================================
   BUY KING'S MART
========================================================= */

function buyRival(){

  if(
    game.rival.stage!=="FOR SALE"
  ){

    toast(
      "King's Mart isn't for sale yet."
    );

    return;

  }


  if(game.cash<9000){

    toast(
      "❌ You need £9,000."
    );

    return;

  }


  game.cash-=9000;

  game.rival.customers=0;

  game.rival.health=0;

  game.rival.marketShare=0;

  game.marketShare+=12;

  game.reputation+=10;


  saveGame();

  render();

  createPeople();

  closePanel();


  toast(
    "👑 You bought King's Mart!"
  );

}

/* =========================================================
   CREATE PEOPLE
========================================================= */

function createPeople(){

  const layer=
    document.getElementById(
      "peopleLayer"
    );


  layer.innerHTML="";


  const playerCount=
    Math.min(
      14,
      Math.max(
        5,
        Math.floor(
          game.customers/12
        )
      )
    );


  for(
    let i=0;
    i<playerCount;
    i++
  ){

    const route=
      playerRoutes[
        i%playerRoutes.length
      ];


    const person=
      document.createElement("div");


    person.className=
      "person walking";


    person.dataset.route=
      i%playerRoutes.length;


    person.dataset.index=
      "0";


    const first=
      route[0];


    person.style.left=
      first[0]+"%";


    person.style.top=
      first[1]+"%";


    layer.appendChild(person);


    setTimeout(
      ()=>{
        movePerson(
          person,
          route
        );
      },
      Math.random()*5000
    );

  }


  /*
    Keep King's Mart's visible population
    deliberately small.
  */

  const rivalCount=
    Math.min(
      5,
      Math.ceil(
        game.rival.customers/60
      )
    );


  for(
    let i=0;
    i<rivalCount;
    i++
  ){

    const route=
      rivalRoutes[
        i%rivalRoutes.length
      ];


    const person=
      document.createElement("div");


    person.className=
      "person red walking";


    person.dataset.rival="true";

    person.dataset.route=
      i%rivalRoutes.length;

    person.dataset.index=
      "0";


    const first=
      route[0];


    person.style.left=
      first[0]+"%";


    person.style.top=
      first[1]+"%";


    layer.appendChild(person);


    setTimeout(
      ()=>{
        movePerson(
          person,
          route
        );
      },
      Math.random()*6000
    );

  }

}


/* =========================================================
   MOVE PERSON ALONG ROUTE
========================================================= */

function movePerson(
  person,
  route
){

  if(!person.isConnected)
    return;


  let index=
    Number(
      person.dataset.index||0
    );


  index++;


  if(index>=route.length){

    index=0;

  }


  person.dataset.index=
    index;


  const target=
    route[index];


  /*
    Seven-second CSS transition means
    people move slowly and visibly.
  */

  person.style.left=
    target[0]+"%";


  person.style.top=
    target[1]+"%";


  setTimeout(
    ()=>{
      movePerson(
        person,
        route
      );
    },
    7000
  );

}

/* =========================================================
   CREATE CARS
========================================================= */

function createCars(){

  const layer=
    document.getElementById(
      "carsLayer"
    );


  layer.innerHTML="";

  cars=[];


  const colours=[
    "red",
    "blue",
    "yellow",
    "white",
    "black"
  ];


  trafficRoutes.forEach(
    (route,index)=>{

      const car=
        document.createElement("div");


      car.className=
        "car "+
        colours[
          index%colours.length
        ];


      layer.appendChild(car);


      cars.push({

        element:car,

        route:route,

        progress:
          Math.random()*
          route.length,

        speed:
          .0018+
          Math.random()*.0012

      });

    }
  );

}


/* =========================================================
   UPDATE CARS
========================================================= */

function updateCars(){

  cars.forEach(
    car=>{

      car.progress+=
        car.speed;


      if(
        car.progress>=
        car.route.length-1
      ){

        car.progress=0;

      }


      const index=
        Math.floor(
          car.progress
        );


      const next=
        Math.min(
          index+1,
          car.route.length-1
        );


      const amount=
        car.progress-index;


      const a=
        car.route[index];


      const b=
        car.route[next];


      const x=
        a[0]+
        (b[0]-a[0])*
        amount;


      const y=
        a[1]+
        (b[1]-a[1])*
        amount;


      car.element.style.left=
        x+"%";


      car.element.style.top=
        y+"%";


      const dx=
        b[0]-a[0];


      const dy=
        b[1]-a[1];


      let angle=0;


      if(Math.abs(dx)>Math.abs(dy)){

        angle=
          dx>=0
          ?0
          :180;

      }else{

        angle=
          dy>=0
          ?90
          :-90;

      }


      car.element.style.transform=
        "translate(-50%,-50%) rotate("+
        angle+
        "deg)";

    }
  );

}

  const element=
    document.getElementById(
      "toast"
    );

    );

/* =========================================================
   MAIN GAME LOOP
========================================================= */

let lastTick=
  Date.now();


function gameLoop(){

  const now=
    Date.now();


  const seconds=
    (now-lastTick)/1000;


  lastTick=now;


  /*
    Business income.
  */

  game.cash+=
    getIncome()*seconds;


  /*
    Slow organic customer growth.
  */

  game.customers+=
    game.stores.length*
    .018*
    seconds;


  /*
    Rival pressure.

    We deliberately make this slow so the
    player has to actively compete rather
    than King's Mart instantly collapsing.
  */

  if(
    game.marketShare>12 &&
    game.rival.health>0
  ){

    game.rival.health=
      Math.max(
        0,
        game.rival.health-
        .0009*seconds
      );

  }


  rivalAI();

  updateCars();

  renderRival();

}
