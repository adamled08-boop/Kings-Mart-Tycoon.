<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no,
      viewport-fit=cover">

<title>King's Mart Tycoon</title>

<style>

/* =========================================================
   CORE
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#10161c;
    color:white;
}

body{
    touch-action:manipulation;
}

button{
    font-family:inherit;
    border:0;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#79aa69;
}


/* =========================================================
   TOP HUD
========================================================= */

#topBar{
    position:absolute;
    z-index:100;

    top:0;
    left:0;
    right:0;

    height:76px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:8px;

    background:rgba(11,16,21,.97);
    border-bottom:2px solid #3c4852;
}

.brand{
    width:185px;
    min-width:185px;
    padding:4px 9px;
}

.brandName{
    color:#ffd447;
    font-size:20px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.brandSub{
    color:#84909b;
    font-size:9px;
    margin-top:2px;
    font-weight:bold;
}

.stats{
    flex:1;

    display:flex;
    gap:7px;

    overflow:hidden;
}

.stat{
    min-width:85px;

    padding:7px 9px;

    border-radius:9px;

    background:#202a33;
    border:1px solid #3c4a55;
}

.statLabel{
    color:#8f9ca7;
    font-size:9px;
    text-transform:uppercase;
}

.statValue{
    margin-top:3px;
    font-size:15px;
    font-weight:900;
}

.money{
    color:#6ee184;
}


/* =========================================================
   WORLD
========================================================= */

#world{
    position:absolute;

    left:0;
    right:0;
    top:76px;
    bottom:70px;

    overflow:hidden;

    background:#79aa69;
}

.city{
    position:absolute;
    width:100%;
    height:100%;
}


/* =========================================================
   ROADS
========================================================= */

.road{
    position:absolute;
    background:#50565b;
    box-shadow:
        inset 0 0 0 3px rgba(0,0,0,.12);
}

.horizontal{
    left:0;
    right:0;
    height:72px;
}

.vertical{
    top:0;
    bottom:0;
    width:72px;
}

.h1{
    top:32%;
}

.h2{
    top:69%;
}

.v1{
    left:22%;
}

.v2{
    left:78%;
}

.roadLine{
    position:absolute;
    background:
        repeating-linear-gradient(
            90deg,
            #e8d46d 0 32px,
            transparent 32px 62px
        );
}

.horizontal .roadLine{
    left:0;
    right:0;
    top:34px;
    height:4px;
}

.vertical .roadLine{
    top:0;
    bottom:0;
    left:34px;
    width:4px;

    background:
        repeating-linear-gradient(
            180deg,
            #e8d46d 0 32px,
            transparent 32px 62px
        );
}


/* =========================================================
   AREA LABELS
========================================================= */

.areaLabel{
    position:absolute;
    z-index:15;

    padding:7px 11px;

    border-radius:9px;

    background:rgba(15,21,26,.82);
    border:2px solid rgba(255,255,255,.2);

    font-size:11px;
    font-weight:900;
    letter-spacing:.5px;

    pointer-events:none;
}

.playerLabel{
    left:3%;
    top:3%;
    color:#ffd447;
    border-color:#c89e25;
}

.rivalLabel{
    right:3%;
    top:3%;
    color:#ff6a6a;
    border-color:#b94747;
}


/* =========================================================
   BUILDINGS
========================================================= */

.building{
    position:absolute;

    z-index:20;

    border-radius:9px;

    border:4px solid #222a30;

    overflow:hidden;

    box-shadow:
        0 7px 0 rgba(0,0,0,.22),
        0 12px 25px rgba(0,0,0,.22);

    transition:.15s;
}

.building:active{
    transform:scale(.96);
}


/* =========================================================
   PLAYER BUILDINGS
========================================================= */

.playerBuilding{
    background:#e1d8bd;
}

.playerBuilding .roof{
    background:#30291e;
}

.playerBuilding .sign{
    background:#ffd447;
    color:#171717;
}


/* =========================================================
   ABANDONED BUILDINGS
========================================================= */

.abandonedBuilding{
    background:#777b7c;
}

.abandonedBuilding .roof{
    background:#34383a;
}

.abandonedBuilding .sign{
    background:#4b5052;
    color:#e4e7e8;
}


/* =========================================================
   KING'S MART MODERN BUILDING
========================================================= */

.rivalBuilding{
    background:#d7dce1;

    border-color:#20262c;

    box-shadow:
        0 9px 0 rgba(0,0,0,.28),
        0 15px 35px rgba(0,0,0,.3);
}

.rivalBuilding .roof{
    background:#101820;
}

.rivalBuilding .sign{
    background:#d52f39;
    color:white;
    font-size:14px;
    letter-spacing:1px;
}

.rivalBuilding .glass{
    background:#63a9c2;
    border-color:#273840;
}

.rivalBuilding .entrance{
    width:40px;
    height:58px;
    background:#24343c;
}


/* =========================================================
   BUILDING PARTS
========================================================= */

.roof{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:27px;

    border-bottom:3px solid #1d252b;
}

.front{
    position:absolute;

    top:27px;
    left:0;
    right:0;
    bottom:0;
}

.sign{
    position:absolute;

    top:30px;
    left:8px;
    right:8px;

    height:26px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:4px;

    font-size:9px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.windows{
    position:absolute;

    top:62px;
    left:8px;
    right:8px;

    display:flex;
    gap:5px;
}

.glass{
    flex:1;

    height:29px;

    background:#6fb3ca;

    border:2px solid #293740;
}

.entrance{
    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:27px;
    height:44px;

    background:#526b75;

    border:3px solid #29333a;
}


/* =========================================================
   PLAYER BUILDING POSITIONS
========================================================= */

/* Main shop */
.player1{
    left:4%;
    top:9%;

    width:145px;
    height:112px;
}

/* Purchased shops */
.property1{
    left:27%;
    top:9%;

    width:135px;
    height:105px;
}

.property2{
    left:4%;
    top:48%;

    width:135px;
    height:105px;
}

.property3{
    left:27%;
    top:48%;

    width:135px;
    height:105px;
}

.property4{
    left:27%;
    top:78%;

    width:135px;
    height:105px;
}


/* =========================================================
   KING'S MART POSITION
========================================================= */

.rivalMain{
    right:4%;
    top:8%;

    width:230px;
    height:175px;
}

.rivalSecond{
    right:5%;
    top:49%;

    width:170px;
    height:125px;
}

.rivalMain .roof{
    height:35px;
}

.rivalMain .front{
    top:35px;
}

.rivalMain .sign{
    top:40px;
    height:36px;
}

.rivalMain .windows{
    top:86px;
}

.rivalMain .glass{
    height:43px;
}

.rivalMain .entrance{
    width:48px;
    height:60px;
}

.rivalSecond .sign{
    top:28px;
}

.rivalSecond .windows{
    top:59px;
}


/* =========================================================
   BUILDING LEVEL VISUALS
========================================================= */

.level2{
    border-color:#d8a92f;
}

.level3{
    border-color:#ffd447;
    box-shadow:
        0 8px 0 rgba(0,0,0,.25),
        0 0 20px rgba(255,212,71,.28);
}

.level4{
    border-color:#fff0a2;
    box-shadow:
        0 8px 0 rgba(0,0,0,.25),
        0 0 28px rgba(255,212,71,.38);
}


/* =========================================================
   PROPERTY SIGN
========================================================= */

.propertyBadge{
    position:absolute;

    z-index:40;

    top:-12px;
    left:50%;

    transform:translateX(-50%);

    padding:4px 7px;

    background:#10161b;

    border:2px solid #606b74;

    border-radius:6px;

    font-size:8px;
    font-weight:900;

    white-space:nowrap;
}


/* =========================================================
   PEOPLE
========================================================= */

.person{
    position:absolute;

    z-index:30;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#f1bd94;

    border:2px solid #20262a;

    animation:
        walk 5s linear infinite;
}

.person:after{
    content:"";

    position:absolute;

    left:0;
    top:9px;

    width:8px;
    height:10px;

    border-radius:5px;

    background:#3567a2;
}

@keyframes walk{

    0%{
        transform:translateX(-20px);
    }

    50%{
        transform:translateX(80px);
    }

    100%{
        transform:translateX(-20px);
    }

}


/* =========================================================
   CARS
========================================================= */

.car{
    position:absolute;

    z-index:25;

    width:44px;
    height:20px;

    border-radius:6px;

    background:#d65353;

    border:2px solid #222;

    animation:
        drive 9s linear infinite;
}

.car:before{
    content:"";

    position:absolute;

    left:11px;
    top:2px;

    width:18px;
    height:9px;

    background:#8dc3d1;
}

@keyframes drive{

    from{
        left:-60px;
    }

    to{
        left:110%;
    }

}


/* =========================================================
   KING'S MART CUSTOMER CROWD
========================================================= */

.rivalCustomer{
    position:absolute;

    z-index:31;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#f1bd94;

    border:1px solid #222;

    transition:.5s;
}

.rivalCustomer:after{
    content:"";

    position:absolute;

    top:7px;
    left:1px;

    width:6px;
    height:7px;

    background:#b73842;

    border-radius:4px;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

#bottomBar{
    position:absolute;

    z-index:100;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    display:flex;
    gap:6px;

    padding:7px;

    background:rgba(11,16,21,.98);

    border-top:2px solid #3c4852;
}

.navButton{
    flex:1;

    border-radius:10px;

    background:#202a33;

    border:1px solid #3c4a55;

    color:#c8d1d8;

    font-size:10px;
    font-weight:900;
}

.navButton span{
    display:block;
    font-size:18px;
    margin-bottom:2px;
}

.navButton:active{
    transform:scale(.96);
}


/* =========================================================
   PANEL
========================================================= */

#panel{
    position:absolute;

    z-index:200;

    display:none;

    top:90px;
    right:12px;

    width:min(410px,94vw);

    max-height:
        calc(100vh - 175px);

    overflow:auto;

    background:#151c23;

    border:2px solid #566470;

    border-radius:15px;

    box-shadow:
        0 15px 55px rgba(0,0,0,.7);
}

.panelHeader{
    position:sticky;

    top:0;

    z-index:5;

    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:13px;

    background:#202a33;

    border-bottom:1px solid #3b4750;
}

.panelTitle{
    font-size:18px;
    font-weight:900;
}

.close{
    width:32px;
    height:32px;

    border-radius:8px;

    background:#414d57;

    color:white;

    font-size:20px;
}

.panelBody{
    padding:13px;
}


/* =========================================================
   CARDS
========================================================= */

.card{
    margin-bottom:10px;

    padding:12px;

    background:#202a33;

    border:1px solid #3d4b56;

    border-radius:11px;
}

.cardTitle{
    font-size:15px;
    font-weight:900;

    margin-bottom:6px;
}

.cardText{
    color:#adb8c1;

    font-size:12px;

    line-height:1.5;
}

.action{
    width:100%;

    margin-top:8px;

    padding:11px;

    border-radius:8px;

    background:#ffd447;

    color:#151515;

    font-weight:900;

    font-size:12px;
}

.action.green{
    background:#68db7d;
}

.action.red{
    background:#dc5555;
    color:white;
}

.action.blue{
    background:#5ca6dd;
    color:white;
}

.action.gray{
    background:#4b5660;
    color:white;
}

.action:active{
    transform:scale(.98);
}


/* =========================================================
   PROGRESS
========================================================= */

.progress{
    height:9px;

    margin-top:8px;

    background:#0e1419;

    border-radius:20px;

    overflow:hidden;
}

.progressFill{
    height:100%;

    background:#67d97c;

    transition:.3s;
}


/* =========================================================
   TOAST
========================================================= */

#toast{
    position:absolute;

    z-index:500;

    left:50%;
    bottom:83px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:max-content;
    max-width:90%;

    padding:11px 16px;

    border-radius:10px;

    background:#10161c;

    border:2px solid #566470;

    box-shadow:
        0 8px 30px rgba(0,0,0,.6);

    text-align:center;

    font-size:12px;
    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

#toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   EVENT
========================================================= */

#eventBox{
    position:absolute;

    z-index:150;

    left:12px;
    bottom:82px;

    width:min(330px,calc(100vw - 24px));

    display:none;

    padding:12px;

    background:#182129;

    border:2px solid #596875;

    border-radius:11px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.65);
}

.eventTitle{
    color:#ffd447;
    font-weight:900;
    margin-bottom:4px;
}

.eventText{
    color:#c4cdd4;
    font-size:11px;
    line-height:1.4;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    #topBar{
        height:61px;
        padding:5px;
    }

    .brand{
        width:115px;
        min-width:115px;
    }

    .brandName{
        font-size:13px;
    }

    .brandSub{
        display:none;
    }

    .stats{
        gap:4px;
    }

    .stat{
        min-width:65px;
        padding:5px;
    }

    .statLabel{
        font-size:7px;
    }

    .statValue{
        font-size:11px;
    }

    #world{
        top:61px;
        bottom:64px;
    }

    #bottomBar{
        height:64px;
    }

    .navButton{
        font-size:8px;
    }

    .navButton span{
        font-size:16px;
    }

    .player1{
        width:105px;
        height:82px;
    }

    .property1,
    .property2,
    .property3,
    .property4{
        width:100px;
        height:78px;
    }

    .rivalMain{
        width:155px;
        height:118px;
    }

    .rivalSecond{
        width:120px;
        height:92px;
    }

    .roof{
        height:19px;
    }

    .front{
        top:19px;
    }

    .sign{
        top:21px;
        height:18px;
        font-size:6px;
    }

    .windows{
        top:44px;
        left:5px;
        right:5px;
        gap:3px;
    }

    .glass{
        height:18px;
    }

    .entrance{
        width:20px;
        height:29px;
    }

    .rivalMain .roof{
        height:25px;
    }

    .rivalMain .front{
        top:25px;
    }

    .rivalMain .sign{
        top:29px;
        height:25px;
        font-size:9px;
    }

    .rivalMain .windows{
        top:61px;
    }

    .rivalMain .glass{
        height:27px;
    }

    .rivalMain .entrance{
        width:30px;
        height:36px;
    }

    #panel{
        top:68px;
        right:6px;

        width:min(360px,94vw);

        max-height:
            calc(100vh - 136px);
    }

    #toast{
        bottom:72px;
    }

    #eventBox{
        bottom:72px;
    }

}


@media(max-width:480px){

    .stat:nth-child(4),
    .stat:nth-child(5){
        display:none;
    }

    .brand{
        width:90px;
        min-width:90px;
    }

    .brandName{
        font-size:11px;
    }

    .player1{
        width:82px;
        height:65px;
    }

    .property1,
    .property2,
    .property3,
    .property4{
        width:78px;
        height:62px;
    }

    .rivalMain{
        width:125px;
        height:95px;
    }

    .rivalSecond{
        width:100px;
        height:75px;
    }

}


/* =========================================================
   SMALL LANDSCAPE
========================================================= */

@media(max-height:500px)
and (orientation:landscape){

    #topBar{
        height:53px;
    }

    #world{
        top:53px;
        bottom:55px;
    }

    #bottomBar{
        height:55px;
    }

    .navButton span{
        display:inline;
        font-size:14px;
    }

    .navButton{
        font-size:9px;
    }

    #panel{
        top:58px;
        max-height:
            calc(100vh - 108px);
    }

}

</style>
</head>


<body>

<div id="game">


<!-- =====================================================
     TOP HUD
===================================================== -->

<div id="topBar">

    <div class="brand">

        <div
            class="brandName"
            id="companyName"
        >
            MY MART
        </div>

        <div class="brandSub">
            BUILD YOUR CITY EMPIRE
        </div>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="statLabel">
                Cash
            </div>

            <div
                class="statValue money"
                id="cash"
            >
                £5,000
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Income
            </div>

            <div
                class="statValue"
                id="income"
            >
                £0/s
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Customers
            </div>

            <div
                class="statValue"
                id="customers"
            >
                42
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Market
            </div>

            <div
                class="statValue"
                id="market"
            >
                4.2%
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Reputation
            </div>

            <div
                class="statValue"
                id="reputation"
            >
                45
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     WORLD
===================================================== -->

<div id="world">

<div class="city">


<!-- ROADS -->

<div class="road horizontal h1">
    <div class="roadLine"></div>
</div>

<div class="road horizontal h2">
    <div class="roadLine"></div>
</div>

<div class="road vertical v1">
    <div class="roadLine"></div>
</div>

<div class="road vertical v2">
    <div class="roadLine"></div>
</div>


<!-- AREA LABELS -->

<div class="areaLabel playerLabel">
    🏙️ YOUR CITY
</div>

<div class="areaLabel rivalLabel">
    👑 KING'S MART DISTRICT
</div>


<!-- =====================================================
     YOUR MAIN SHOP
===================================================== -->

<div
    id="building0"
    class="building playerBuilding player1"
    onclick="openShop(0)"
>

    <div class="roof"></div>

    <div class="front">

        <div
            class="sign"
            id="storeSign0"
        >
            MY MART
        </div>

        <div class="windows">

            <div class="glass"></div>
            <div class="glass"></div>
            <div class="glass"></div>

        </div>

        <div class="entrance"></div>

    </div>

</div>


<!-- =====================================================
     PLAYER PROPERTY 1
===================================================== -->

<div
    id="propertyBuilding0"
    class="building abandonedBuilding property1"
    onclick="propertyClicked(0)"
>

    <div
        class="propertyBadge"
        id="propertyBadge0"
    >
        FOR SALE
    </div>

    <div class="roof"></div>

    <div class="front">

        <div
            class="sign"
            id="propertySign0"
        >
            ABANDONED
        </div>

        <div class="windows">

            <div class="glass"></div>
            <div class="glass"></div>

        </div>

        <div class="entrance"></div>

    </div>

</div>


<!-- =====================================================
     PLAYER PROPERTY 2
===================================================== -->

<div
    id="propertyBuilding1"
    class="building abandonedBuilding property2"
    onclick="propertyClicked(1)"
>

    <div
        class="propertyBadge"
        id="propertyBadge1"
    >
        FOR SALE
    </div>

    <div class="roof"></div>

    <div class="front">

        <div
            class="sign"
            id="propertySign1"
        >
            FOR SALE
        </div>

        <div class="windows">

            <div class="glass"></div>
            <div class="glass"></div>

        </div>

        <div class="entrance"></div>

    </div>

</div>


<!-- =====================================================
     PLAYER PROPERTY 3
===================================================== -->

<div
    id="propertyBuilding2"
    class="building abandonedBuilding property3"
    onclick="propertyClicked(2)"
>

<script>

/* =========================================================
   GAME STATE
========================================================= */

const SAVE_KEY =
    "kings_mart_tycoon_city_v6";


let game = {

    company:"My Mart",

    cash:5000,

    reputation:45,

    customers:42,

    marketShare:4.2,

    totalEarned:0,

    selectedShop:0,

    lastSave:Date.now(),

    stores:[

        {
            name:"Main Street Mart",

            level:1,

            condition:65,

            baseIncome:12,

            customers:42,

            shelves:1,

            fridges:0,

            lighting:0,

            security:0,

            checkout:0,

            staffRoom:0,

            expansion:0
        }

    ],


    properties:[

        {
            name:"Old Corner Shop",
            price:2200,
            bought:false,
            storeIndex:null
        },

        {
            name:"Empty High Street",
            price:3500,
            bought:false,
            storeIndex:null
        },

        {
            name:"Abandoned Supermarket",
            price:4800,
            bought:false,
            storeIndex:null
        },

        {
            name:"Old Warehouse Shop",
            price:6500,
            bought:false,
            storeIndex:null
        }

    ],


    staff:[

        {
            name:"Adam",
            age:18,
            intelligence:100,
            management:95,
            stocking:65,
            service:72,
            problemSolving:100,
            role:"Natural Manager",
            hired:true
        },

        {
            name:"Sarah",
            age:24,
            intelligence:72,
            management:62,
            stocking:82,
            service:91,
            problemSolving:70,
            role:"Customer Specialist",
            hired:true
        },

        {
            name:"Jack",
            age:31,
            intelligence:61,
            management:48,
            stocking:94,
            service:63,
            problemSolving:61,
            role:"Stock Specialist",
            hired:true
        }

    ],


    rival:{

        name:"King's Mart",

        stores:4,

        health:100,

        customers:220,

        marketShare:32,

        income:95,

        stage:"HEALTHY"

    }

};


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

    const saved =
        localStorage.getItem(SAVE_KEY);

    if(!saved){

        render();

        return;

    }

    try{

        const data =
            JSON.parse(saved);

        game =
            Object.assign(
                game,
                data
            );

        calculateOffline();

        render();

    }
    catch(error){

        console.log(error);

        render();

    }

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    game.lastSave =
        Date.now();

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(game)
    );

}


/* =========================================================
   OFFLINE
========================================================= */

function calculateOffline(){

    const seconds =
        Math.min(
            (Date.now()-game.lastSave)/1000,
            28800
        );

    if(seconds<10){
        return;
    }

    const earned =
        Math.floor(
            getIncomePerSecond()*
            seconds
        );

    if(earned>0){

        game.cash+=earned;

        game.totalEarned+=earned;

        setTimeout(()=>{

            toast(
                "While you were away: +£"+
                formatMoney(earned)
            );

        },500);

    }

}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(value){

    return Math.floor(value)
        .toLocaleString("en-GB");

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SHOP POWER
========================================================= */

function shopPower(shop){

    let power=1;

    power +=
        shop.shelves*.12;

    power +=
        shop.fridges*.15;

    power +=
        shop.lighting*.10;

    power +=
        shop.security*.08;

    power +=
        shop.checkout*.15;

    power +=
        shop.staffRoom*.10;

    power +=
        shop.expansion*.30;


    for(
        const person of game.staff
    ){

        if(person.hired){

            power +=
                (
                    person.management+
                    person.service+
                    person.stocking
                )/1000;

        }

    }

    return power;

}


/* =========================================================
   INCOME
========================================================= */

function getIncomePerSecond(){

    let total=0;

    for(
        const shop of game.stores
    ){

        total +=
            shop.baseIncome*
            shop.level*
            shopPower(shop)*
            Math.max(
                .2,
                shop.condition/100
            );

    }

    return total;

}


/* =========================================================
   CUSTOMER COUNT
========================================================= */

function updateCustomers(){

    let total=0;

    for(
        const shop of game.stores
    ){

        total +=
            shop.customers+
            shop.level*4+
            shop.shelves*2+
            shop.checkout*3;

    }

    game.customers =
        Math.max(
            0,
            Math.floor(total)
        );

}


/* =========================================================
   RIVAL AI
========================================================= */

function rivalAI(){

    /* Our market pressure slowly hurts King's Mart */

    const passivePressure =
        game.marketShare*.018;

    game.rival.health -=
        passivePressure/100;


    game.rival.health =
        Math.max(
            0,
            Math.min(
                100,
                game.rival.health
            )
        );


    /* Rival customers follow their health */

    const targetCustomers =
        Math.max(
            0,
            Math.floor(
                220*
                (game.rival.health/100)
            )
        );

    game.rival.customers =
        Math.max(
            0,
            Math.min(
                game.rival.customers,
                targetCustomers
            )
        );


    if(game.rival.health>75){

        game.rival.stage =
            "HEALTHY";

    }
    else if(game.rival.health>50){

        game.rival.stage =
            "UNDER PRESSURE";

    }
    else if(game.rival.health>30){

        game.rival.stage =
            "STRUGGLING";

    }
    else if(game.rival.health>10){

        game.rival.stage =
            "DISTRESSED";

    }
    else{

        game.rival.stage =
            "FOR SALE";

    }

}


/* =========================================================
   MAIN GAME LOOP
========================================================= */

setInterval(()=>{

    const income =
        getIncomePerSecond();

    game.cash+=income;

    game.totalEarned+=income;


    updateCustomers();

    rivalAI();

    renderRivalCustomers();

    randomEvent();

    render();

    saveGame();

},1000);

        <div class="card">

            </div>

                Stores:

        </div>


        <div class="card">

            </div>

            <button

            </button>

        <div class="card">

            </div>

            <div class="cardText">

            </div>

            <button

                RESET GAME
            </button>

        </div>

        `
    );

}


function changeCompanyName(){

    const input =
        document.getElementById(
            "companyInput"
        );

    if(!input){
        return;
    }

    const name =
        input.value.trim();

    if(!name){

        toast(
            "Enter a company name."
        );

        return;
    }

    game.company =
        name.substring(0,24);

    saveGame();

    render();

    toast(
        "Company renamed!"
    );

}


function resetGame(){

    if(
        !confirm(
            "Delete your current empire?"
        )
    ){
        return;
    }

    localStorage.removeItem(
        SAVE_KEY
    );

    location.reload();

}


/* =========================================================
   OPEN SHOP
========================================================= */

function openShop(index){

    const shop =
        game.stores[index];

    if(!shop){
        return;
    }

    game.selectedShop =
        index;


    panel(

        escapeHtml(shop.name),

        shopPanelHTML(
            shop,
            index
        )

    );

}


/* =========================================================
   SHOP PANEL
========================================================= */

function shopPanelHTML(shop,index){

    const income =
        shop.baseIncome*
        shop.level*
        shopPower(shop);


    return `

    <div class="card">

        <div class="cardTitle">
            🏪 ${escapeHtml(shop.name)}
        </div>

            Level:
            ${shop.level}<br>

        </div>

                style="width:${shop.condition}%"
            ></div>

        </div>

    </div>


    <div class="card">

        </div>

        <div class="cardText">

            of the building and attracts customers.
        </div>

        <button
            class="action"
            onclick="renovate(${index})"

            RENOVATE — £500
        </button>

        <button
            class="action green"
            onclick="advertise(${index})"
        >
            ADVERTISE — £300
        </button>

    </div>


    <div class="card">

        <div class="cardTitle">
            🏗️ Building Level
        </div>

        <div class="cardText">
            Upgrade this specific building to
            make it bigger and more profitable.
        </div>

        <button
            class="action"
            onclick="upgradeBuilding(${index})"
        >

            £${formatMoney(
                getBuildingUpgradeCost(shop)
            )}
        </button>

    </div>


    <div class="card">

        <div class="cardTitle">
            📦 Store Equipment
        </div>

        <button
            class="action"
            onclick="upgrade(${index},'shelves',250)"
        >
            📚 Shelves — £250
        </button>

        <button
            class="action"
            onclick="upgrade(${index},'fridges',400)"
        >
            🧊 Fridges — £400
        </button>

        <button
            class="action"
            onclick="upgrade(${index},'lighting',350)"
        >
            💡 Lighting — £350
        </button>

        <button
            class="action"
            onclick="upgrade(${index},'security',450)"
        >
            🔐 Security — £450
        </button>

        <button
            class="action"
            onclick="upgrade(${index},'checkout',500)"
        >

        </button>

        <button
            class="action"

        </button>

        >
            🏢 Expansion — £1,200
        </button>

    </div>

    `;

}


/* =========================================================
   BUILDING UPGRADE
========================================================= */

function getBuildingUpgradeCost(shop){

    return (
        shop.level*
        shop.level*
        1200
    );

}


function upgradeBuilding(index){

    const shop =
        game.stores[index];

    if(!shop){
        return;
    }


    const cost =
        getBuildingUpgradeCost(shop);


    if(game.cash<cost){

        toast(
            "You need £"+
            formatMoney(
                cost-game.cash
            )+
            " more."
        );

        return;
    }


    game.cash-=cost;

    shop.level++;

    shop.condition =
        Math.min(
            100,
            shop.condition+10
        );

    shop.baseIncome+=
        5;

    shop.customers+=
        10;

    game.reputation+=2;

    game.marketShare+=.4;


    toast(
        shop.name+
        " upgraded to Level "+
        shop.level+"!"
    );


    render();

    openShop(index);

}


/* =========================================================
   RENOVATE
========================================================= */

function renovate(index){

    const shop =
        game.stores[index];

    if(game.cash<500){

        toast(
            "Not enough cash."
        );

        return;
    }


    game.cash-=500;

    shop.condition =
        Math.min(
            100,
            shop.condition+20
        );

    shop.customers+=10;

    game.reputation+=2;


    toast(
        "Building renovated!"
    );

    render();

    openShop(index);

}


/* =========================================================
   ADVERTISE
========================================================= */

function advertise(index){

    if(game.cash<300){

        toast(
            "Not enough cash."
        );

        return;
    }


    game.cash-=300;


    const shop =
        game.stores[index];

    shop.customers+=15;

    game.marketShare+=.5;

    game.reputation+=1;


    toast(
        "Advertising brought customers!"
    );


    render();

    openShop(index);

}


/* =========================================================
   STORE EQUIPMENT
========================================================= */

function upgrade(index,type,cost){

    const shop =
        game.stores[index];

    if(!shop){
        return;
    }


    if(game.cash<cost){

        toast(
            "Not enough cash."
        );

        return;
    }


    game.cash-=cost;

    shop[type]++;


    if(type==="security"){
        game.reputation+=1;
    }

    if(type==="checkout"){
        shop.customers+=5;
    }

    if(type==="expansion"){
        shop.baseIncome+=5;
    }


    toast(
        "Upgrade installed!"
    );


    render();

    openShop(index);

}

                        ?

                        `

                            OWNED
                        </strong>
                        `

                        :

                        ""
                    }

                </div>


                ${
                    property.bought

                    ?

                    `
                    <button
                        class="action green"
                        onclick="
                            openShop(
                                ${property.storeIndex}
                            )
                        "
                    >
                        MANAGE BUILDING

                    `

                    :

                    `

                        class="action"

                        "

/* =========================================================
   PROPERTY CLICK
========================================================= */

function propertyClicked(index){

    const property =
        game.properties[index];

    if(!property){
        return;
    }


    if(property.bought){

        openShop(
            property.storeIndex
        );

    }
    else{

        openProperties();

    }

}


/* =========================================================
   BUY PROPERTY
========================================================= */

function buyProperty(index){

    const property =
        game.properties[index];

    if(!property){
        return;
    }


    if(property.bought){

        openShop(
            property.storeIndex
        );

        return;
    }


    if(game.cash<property.price){

        toast(
            "You need £"+
            formatMoney(
                property.price-game.cash
            )+
            " more."
        );

        return;
    }


    game.cash -=
        property.price;


    property.bought =
        true;


    const newStore = {

        name:
            property.name+
            " Mart",

        level:1,

        condition:55,

        baseIncome:15,

        customers:15,

        shelves:0,

        fridges:0,

        lighting:0,

        security:0,

        checkout:0,

        staffRoom:0,

        expansion:0

    };


    game.stores.push(
        newStore
    );


    property.storeIndex =
        game.stores.length-1;


    game.reputation+=2;

    game.marketShare+=.7;


    toast(
        "BUILDING PURCHASED! It is now YOUR shop."
    );


    render();

    closePanel();

}

                    Age:
                    ${person.age}<br>

                    Role:
                    ${person.role}<br><br>

                    Intelligence:
                    ${person.intelligence}/100<br>

                    Management:
                    ${person.management}/100<br>

                    Stocking:
                    ${person.stocking}/100<br>

                    Customer Service:
                    ${person.service}/100<br>

                    Problem Solving:
                    ${person.problemSolving}/100

                </div>


                ${
                    person.hired

                    ?

                    `
                    <button
                        class="action green"
                    >
                        HIRED
                    </button>
                    `

                    :

                    `
                    <button
                        class="action"
                        onclick="
                            hireStaff(${index})
                        "
                    >
                        HIRE — £400
                    </button>
                    `

                }

            </div>

            `;

        }
    );


    panel(
        "Employees",
        html
    );

}


function hireStaff(index){

    const person =
        game.staff[index];

    if(!person){
        return;
    }


    if(person.hired){

        toast(
            person.name+
            " already works for you."
        );

        return;
    }


    if(game.cash<400){

        toast(
            "Not enough cash."
        );

        return;
    }


    game.cash-=400;

    person.hired=true;


    toast(
        person.name+
        " joined your company!"
    );


    render();

    openStaff();

}

function openUpgrades(){

    const index =

    if(!game.stores[index]){

/* =========================================================
   ATTACK RIVAL
========================================================= */

function attackRival(){

    if(game.cash<500){

        toast(
            "You need £500."
        );

        return;
    }


    game.cash-=500;


    /*
       BIG CUSTOMER HIT
    */

    const customerLoss =
        Math.floor(
            10+
            Math.random()*8
        );


    game.rival.customers =
        Math.max(
            0,
            game.rival.customers-
            customerLoss
        );


    /*
       HEALTH HIT
    */

    game.rival.health =
        Math.max(
            0,
            game.rival.health-7
        );


    /*
       MARKET SHARE MOVES
    */

    game.marketShare +=
        .45;


    game.rival.marketShare =
        Math.max(
            0,
            game.rival.marketShare-
            .55
        );


    game.customers +=
        Math.floor(
            customerLoss*.7
        );


    game.reputation+=1;


    rivalAI();

    renderRivalCustomers();

    render();


    toast(
        "⚔️ King's Mart lost "+
        customerLoss+
        " customers!"
    );


    /*
       Re-open the rival panel so the player
       immediately sees the damage.
    */

    setTimeout(()=>{

        openRival();

    },400);

}


/* =========================================================
   BUY KING'S MART
========================================================= */

function buyRival(){

    const cost=9000;


    if(game.rival.stage!=="FOR SALE"){

        toast(
            "King's Mart is not for sale yet."
        );

        return;
    }


    if(game.cash<cost){

        toast(
            "You need £"+
            formatMoney(
                cost-game.cash
            )+
            " more."
        );

        return;
    }


    game.cash-=cost;


    const acquired =
        game.rival.stores;


    game.rival.stores=0;

    game.rival.customers=0;

    game.rival.income=0;

    game.rival.marketShare=0;


    game.totalEarned+=0;


    /*
       Give the player a big market share boost.
    */

    game.marketShare +=
        acquired*4;


    game.reputation+=10;


    toast(
        "🏆 YOU BOUGHT KING'S MART!"
    );


    closePanel();

    render();

}


/* =========================================================
   RIVAL CUSTOMER VISUALS
========================================================= */

function renderRivalCustomers(){

    const box =
        document.getElementById(
            "rivalCustomers"
        );

    if(!box){
        return;
    }


    box.innerHTML="";


    /*
       Fewer visible people as King's Mart
       loses customers.
    */

    const count =
        Math.max(
            4,
            Math.min(
                24,
                Math.floor(
                    game.rival.customers/10
                )
            )
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const customer =
            document.createElement(
                "div"
            );


        customer.className =
            "rivalCustomer";


        /*
           Keep customers around the
           King's Mart building.
        */

        const x =
            79+
            Math.random()*17;

        const y =
            28+
            Math.random()*55;


        customer.style.left =
            x+"%";

        customer.style.top =
            y+"%";


        box.appendChild(
            customer
        );

    }

}


/* =========================================================
   RANDOM EVENTS
========================================================= */

let lastEvent =
    Date.now();


function randomEvent(){

    if(
        Date.now()-lastEvent
        <35000
    ){
        return;
    }


    if(Math.random()>.07){
        return;
    }


    lastEvent =
        Date.now();


    const events=[

        {

            title:"🛒 Shopping Rush",

            text:
                "A busy weekend brought extra shoppers to your city.",

            effect:()=>{

                game.customers+=25;

                game.cash+=300;

            }

        },

        {

            title:"📱 Viral Advertisement",

            text:
                "Your company suddenly went viral!",

            effect:()=>{

                game.reputation+=5;

                game.marketShare+=1;

                game.customers+=20;

            }

        },

        {

            title:"📦 Supplier Discount",

            text:
                "A supplier gave your company a special discount.",

            effect:()=>{

                game.cash+=450;

            }

        },

        {

            title:"👑 King's Mart Mistake",

            text:
                "King's Mart made a pricing mistake and lost customers.",

            effect:()=>{

                game.rival.customers =
                    Math.max(
                        0,
                        game.rival.customers-15
                    );

                game.rival.health =
                    Math.max(
                        0,
                        game.rival.health-3
                    );

            }

        },

        {

            title:"💡 Power Problem",

            text:
                "One of your stores had a temporary power problem.",

            effect:()=>{

                game.cash =
                    Math.max(
                        0,
                        game.cash-250
                    );

            }

        }

    ];


    const event =
        events[
            Math.floor(
                Math.random()*
                events.length
            )
        ];


    event.effect();


    document.getElementById(
        "eventTitle"
    ).textContent =
        event.title;


    document.getElementById(
        "eventText"
    ).textContent =
        event.text;


    document.getElementById(
        "eventBox"
    ).style.display =
        "block";


    setTimeout(()=>{

        document.getElementById(
            "eventBox"
        ).style.display =
            "none";

    },6000);

}


/* =========================================================
   PANEL
========================================================= */

function panel(title,html){

    document.getElementById(
        "panelTitle"
    ).textContent =
        title;


    document.getElementById(
        "panelBody"
    ).innerHTML =
        html;


    document.getElementById(
        "panel"
    ).style.display =
        "block";

}


function closePanel(){

    document.getElementById(
        "panel"
    ).style.display =
        "none";

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(message){

    const box =
        document.getElementById(
            "toast"
        );


    box.textContent =
        message;


    box.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(()=>{

            box.classList.remove(
                "show"
            );

        },3000);

}


/* =========================================================
   RENDER BUILDINGS
========================================================= */

function renderBuildings(){

    game.stores.forEach(
        (shop,index)=>{

            /*
               Main store is already present.
               Purchased properties are mapped
               onto the property buildings.
            */

        }
    );


    game.properties.forEach(
        (property,index)=>{

            const building =
                document.getElementById(
                    "propertyBuilding"+
                    index
                );

            const sign =
                document.getElementById(
                    "propertySign"+
                    index
                );

            const badge =
                document.getElementById(
                    "propertyBadge"+
                    index
                );


            if(!building){
                return;
            }


            if(property.bought){

                const shop =
                    game.stores[
                        property.storeIndex
                    ];


                building.classList.remove(
                    "abandonedBuilding"
                );

                building.classList.add(
                    "playerBuilding"
                );


                if(shop){

                    if(shop.level>=2){

                        building.classList.add(
                            "level2"
                        );

                    }

                    if(shop.level>=3){

                        building.classList.add(
                            "level3"
                        );

                    }

                    if(shop.level>=4){

                        building.classList.add(
                            "level4"
                        );

                    }


                    sign.textContent =
                        shop.name
                            .toUpperCase();


                    badge.textContent =
                        "YOUR SHOP • LV "+
                        shop.level;

                    badge.style.borderColor =
                        "#ffd447";

                    badge.style.color =
                        "#ffd447";

                }

            }
            else{

                building.classList.remove(
                    "playerBuilding",
                    "level2",
                    "level3",
                    "level4"
                );

                building.classList.add(
                    "abandonedBuilding"
                );


                sign.textContent =
                    index===0
                    ?
                    "ABANDONED"
                    :
                    "FOR SALE";


                badge.textContent =
                    "FOR SALE";

                badge.style.borderColor =
                    "#606b74";

                badge.style.color =
                    "white";

            }

        }
    );


    /*
       Main store visual upgrade.
    */

    const main =
        game.stores[0];


    const mainBuilding =
        document.getElementById(
            "building0"
        );


    if(mainBuilding && main){

        mainBuilding.classList.remove(
            "level2",
            "level3",
            "level4"
        );


        if(main.level>=2){

            mainBuilding.classList.add(
                "level2"
            );

        }

        if(main.level>=3){

            mainBuilding.classList.add(
                "level3"
            );

        }

        if(main.level>=4){

            mainBuilding.classList.add(
                "level4"
            );

        }

    }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    document.getElementById(
        "companyName"
    ).textContent =
        game.company;


    document.getElementById(
        "cash"
    ).textContent =
        "£"+
        formatMoney(game.cash);


    document.getElementById(
        "income"
    ).textContent =
        "£"+
        formatMoney(
            getIncomePerSecond()
        )+
        "/s";


    document.getElementById(
        "customers"
    ).textContent =
        Math.floor(
            game.customers
        );


    document.getElementById(
        "market"
    ).textContent =
        game.marketShare
            .toFixed(1)+
        "%";


    document.getElementById(
        "reputation"
    ).textContent =
        Math.floor(
            game.reputation
        );


    if(game.stores[0]){

        document.getElementById(
            "storeSign0"
        ).textContent =
            game.stores[0].name
                .toUpperCase();

    }


    renderBuildings();

}


/* =========================================================
   START GAME
========================================================= */

loadGame();

updateCustomers();

renderRivalCustomers();

render();

</script>
