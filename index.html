<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>King's Mart Tycoon</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#101820;
  color:#fff;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

#game{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#101820;
}

/* =========================================================
   TOP HUD
========================================================= */

#topBar{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 12px;
  background:linear-gradient(#263640,#172128);
  border-bottom:2px solid #53656e;
  z-index:1000;
  overflow:hidden;
}

.logo{
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#f6ca43,#c48b19);
  color:#3d2a06;
  font-size:25px;
  box-shadow:inset 0 2px #fff8,0 3px 8px #0008;
}

.companyTitle{
  min-width:100px;
  max-width:180px;
  overflow:hidden;
}

.companyTitle b{
  display:block;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.companyTitle small{
  color:#9eafb7;
  font-size:9px;
}

.stats{
  margin-left:auto;
  display:flex;
  gap:7px;
  align-items:center;
}

.stat{
  min-width:74px;
  padding:5px 8px;
  border-radius:8px;
  background:#111a1f;
  border:1px solid #42545e;
  text-align:center;
  box-shadow:inset 0 1px #fff1;
}

.stat span{
  display:block;
  color:#91a5ae;
  font-size:8px;
  text-transform:uppercase;
}

.stat strong{
  display:block;
  margin-top:2px;
  font-size:12px;
}

/* =========================================================
   WORLD
========================================================= */

#world{
  position:relative;
  flex:1;
  overflow:hidden;
  background:
    linear-gradient(135deg,#76a95b 0%,#679d51 45%,#5d934d 100%);
  isolation:isolate;
}

#world::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%,#ffffff0b 0 2px,transparent 3px),
    radial-gradient(circle at 70% 70%,#00000008 0 2px,transparent 3px);
  background-size:55px 55px,70px 70px;
  pointer-events:none;
}

/* =========================================================
   DISTRICTS
========================================================= */

.district{
  position:absolute;
  border-radius:20px;
  opacity:.55;
  z-index:2;
}

.district.one{
  left:0;
  top:0;
  width:53%;
  height:50%;
  background:#83b967;
}

.district.two{
  left:0;
  top:50%;
  width:53%;
  height:50%;
  background:#72a95b;
}

.district.three{
  left:67%;
  top:0;
  width:33%;
  height:50%;
  background:#7eae61;
}

.district.four{
  left:67%;
  top:50%;
  width:33%;
  height:50%;
  background:#6fa256;
}

.zoneLabel{
  position:absolute;
  z-index:15;
  padding:5px 9px;
  border-radius:8px;
  background:#172027aa;
  border:1px solid #ffffff22;
  font-size:8px;
  font-weight:bold;
  letter-spacing:1px;
  pointer-events:none;
}

.playerZone{
  left:3%;
  top:2%;
}

.rivalZone{
  right:3%;
  top:2%;
}

/* =========================================================
   RIVER
========================================================= */

#river{
  position:absolute;
  z-index:20;
  left:57%;
  top:0;
  width:12%;
  height:100%;
  background:
    repeating-linear-gradient(
      0deg,
      #438bb0 0 18px,
      #4b96b9 18px 36px
    );
  border-left:5px solid #80b5c8;
  border-right:5px solid #80b5c8;
  box-shadow:inset 0 0 20px #174c6c99;
}

#river::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      -18deg,
      transparent 0 34px,
      #ffffff18 34px 38px,
      transparent 38px 70px
    );
}

/* =========================================================
   ROADS
========================================================= */

.road{
  position:absolute;
  z-index:30;
  background:#3b4144;
  box-shadow:
    inset 0 2px #555c5f,
    inset 0 -2px #25292b;
}

.road.horizontal{
  left:0;
  width:100%;
  height:8%;
  transform:translateY(-50%);
}

.road.vertical{
  top:0;
  height:100%;
  width:5%;
  transform:translateX(-50%);
}

.h1{top:20%}
.h2{top:51%}
.h3{top:78%}

.v1{left:16%}
.v2{left:38%}
.v3{left:51%}
.v4{left:76%}
.v5{left:89%}

.road.horizontal::after{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  height:3px;
  transform:translateY(-50%);
  background:repeating-linear-gradient(
    90deg,
    #f1d34d 0 22px,
    transparent 22px 42px
  );
}

.road.vertical::after{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:3px;
  height:100%;
  transform:translateX(-50%);
  background:repeating-linear-gradient(
    0deg,
    #f1d34d 0 22px,
    transparent 22px 42px
  );
}

/* intersection patches stop visual overlap */
.intersection{
  position:absolute;
  z-index:35;
  width:5%;
  height:8%;
  transform:translate(-50%,-50%);
  background:#3b4144;
}

/* =========================================================
   PAVEMENTS / PEDESTRIAN PATHS
========================================================= */

.pavement{
  position:absolute;
  z-index:40;
  background:#b8b5a7;
  border-top:2px solid #d4d0bd;
  border-bottom:2px solid #8d8a7e;
  box-shadow:0 2px 4px #0003;
}

.pavement.horizontal{
  left:0;
  width:100%;
  height:2.8%;
  transform:translateY(-50%);
}

.pavement.vertical{
  top:0;
  height:100%;
  width:2%;
  transform:translateX(-50%);
}

.ph1{top:25%}
.ph2{top:56%}
.ph3{top:83%}

.pv1{left:12%}
.pv2{left:33%}
.pv3{left:47%}
.pv4{left:73%}
.pv5{left:94%}

.path{
  position:absolute;
  z-index:42;
  background:#c8c4b2;
  border:1px solid #aaa697;
  box-shadow:0 1px 3px #0002;
}

.path.h{
  height:1.5%;
  left:3%;
  width:48%;
}

.path.p1{top:30%}
.path.p2{top:47%}
.path.p3{top:59%}
.path.p4{top:87%}

.path.v{
  width:1.3%;
  height:25%;
}

.path.v1{left:13%;top:5%}
.path.v2{left:29%;top:29%}
.path.v3{left:13%;top:59%}
.path.v4{left:31%;top:68%}

.shopPath{
  position:absolute;
  z-index:44;
  width:12px;
  background:#c8c4b2;
  border-left:1px solid #aaa697;
  border-right:1px solid #aaa697;
}

/* =========================================================
   CROSSINGS
========================================================= */

.crossing{
  position:absolute;
  z-index:50;
  width:6%;
  height:8%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:3px;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.crossing i{
  width:4px;
  height:65%;
  background:#eee;
}

/* =========================================================
   ROUNDABOUT
========================================================= */

#roundabout{
  position:absolute;
  z-index:38;
  left:29%;
  top:47%;
  width:185px;
  height:185px;
  transform:translate(-50%,-50%);
}

.roundRoad{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#383e40;
  border:5px solid #555b5d;
  box-shadow:0 4px 9px #0005;
}

.roundRoad::before{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  border:3px dashed #f1d34d;
}

.roundIsland{
  position:absolute;
  inset:55px;
  border-radius:50%;
  background:#72a653;
  border:4px solid #527b3d;
  box-shadow:inset 0 0 8px #0004;
}

.roundIsland::after{
  content:"🌳";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:27px;
}

.roundArrow{
  position:absolute;
  color:#f4e68b;
  font-size:18px;
}

.ra1{left:20px;top:79px}
.ra2{right:20px;top:79px;transform:rotate(180deg)}
.ra3{left:81px;top:18px;transform:rotate(90deg)}
.ra4{left:81px;bottom:18px;transform:rotate(-90deg)}

/* =========================================================
   BRIDGES
========================================================= */

.bridge{
  position:absolute;
  z-index:55;
  left:51%;
  width:25%;
  height:5%;
  transform:translate(-50%,-50%);
  background:
    repeating-linear-gradient(
      90deg,
      #6b7376 0 22px,
      #51585b 22px 44px
    );
  border-top:3px solid #d0d1c8;
  border-bottom:3px solid #d0d1c8;
  box-shadow:0 3px 8px #0006;
}

.bridge1{top:20%}
.bridge2{top:78%}

/* =========================================================
   GRASS PLOTS
========================================================= */

.plot{
  position:absolute;
  z-index:60;
  border-radius:16px;
  background:#83b866;
  border:3px solid #67974e;
  box-shadow:
    inset 0 0 0 2px #ffffff12,
    0 4px 7px #0002;
}

.plot::after{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:11px;
  border:1px dashed #ffffff1a;
  pointer-events:none;
}

/* exact plots */
.plot1{left:4%;top:5%;width:27%;height:25%}
.plot2{left:21%;top:29%;width:18%;height:18%}
.plot3{left:3%;top:59%;width:28%;height:25%}
.plot4{left:23%;top:68%;width:18%;height:20%}

.plot5{right:3%;top:7%;width:25%;height:31%}
.plot6{right:6%;top:56%;width:20%;height:22%}

/* =========================================================
   BUILDINGS
========================================================= */

.building{
  position:absolute;
  z-index:100;
  border-radius:7px;
  cursor:pointer;
  user-select:none;
  transition:filter .15s,transform .15s;
}

.building:hover{
  filter:brightness(1.1);
}

.buildingBody{
  position:absolute;
  inset:12% 0 0;
  border:3px solid #3c3f3c;
  border-radius:5px;
  background:#d8c58a;
  box-shadow:
    0 7px 0 #756e59,
    0 10px 12px #0005;
}

.roof{
  position:absolute;
  left:-4%;
  right:-4%;
  top:0;
  height:23%;
  clip-path:polygon(7% 100%,50% 0,93% 100%);
  background:#7a4e35;
  border:2px solid #4d3426;
  z-index:4;
}

.windows{
  position:absolute;
  left:10%;
  right:10%;
  top:31%;
  display:flex;
  justify-content:space-around;
  gap:4px;
}

.window{
  width:20%;
  height:19px;
  background:#8ed3e8;
  border:2px solid #34464a;
  box-shadow:inset 0 0 7px #fff8;
}

.door{
  position:absolute;
  bottom:0;
  left:50%;
  width:17%;
  height:35%;
  transform:translateX(-50%);
  background:#543d2d;
  border:2px solid #30241d;
  z-index:5;
}

.sign{
  position:absolute;
  z-index:15;
  left:50%;
  top:-18%;
  transform:translateX(-50%);
  min-width:80%;
  padding:4px 7px;
  text-align:center;
  border-radius:5px;
  background:#f1c63e;
  color:#2c250d;
  border:2px solid #725c18;
  box-shadow:0 3px 4px #0005;
  font-weight:900;
  font-size:9px;
  white-space:nowrap;
}

.levelBadge{
  position:absolute;
  z-index:20;
  right:-7px;
  top:-7px;
  min-width:23px;
  padding:3px 4px;
  border-radius:10px;
  background:#172027;
  border:1px solid #9aa9ad;
  color:#fff;
  text-align:center;
  font-size:7px;
  font-weight:bold;
}

.stockBadge{
  position:absolute;
  z-index:20;
  left:50%;
  bottom:-23px;
  transform:translateX(-50%);
  padding:3px 6px;
  border-radius:8px;
  background:#172027;
  border:1px solid #647984;
  font-size:7px;
  white-space:nowrap;
}

/* player buildings fit plots */
#shop1{
  left:8%;
  top:10%;
  width:9.2%;
  height:11%;
}

#shop2{
  left:24%;
  top:33%;
  width:7.2%;
  height:8.5%;
}

#shop3{
  left:8%;
  top:64%;
  width:9.5%;
  height:10.5%;
}

#shop4{
  left:26%;
  top:72%;
  width:7.2%;
  height:8.5%;
}

/* player's building colours */
.playerBuilding .buildingBody{
  background:#e3c35a;
}

.playerBuilding .roof{
  background:#9b622d;
}

/* abandoned */
.abandonedBuilding{
  background:#555;
}

.abandonedBuilding .buildingBody{
  background:#777;
}

.abandonedBuilding .roof{
  background:#494949;
}

.abandonedBuilding .sign{
  background:#555;
  color:#eee;
}

/* purchased abandoned building */
.playerPurchased .buildingBody{
  background:#e3c35a;
}

.playerPurchased .roof{
  background:#9b622d;
}

.playerPurchased .sign{
  background:#f1c63e;
  color:#2c250d;
}

/* =========================================================
   KING'S MART HQ
========================================================= */

#kingsHQ{
  position:absolute;
  z-index:110;
  right:7%;
  top:12%;
  width:16.5%;
  height:20%;
  cursor:pointer;
}

#kingsHQ .buildingBody{
  background:#d7dce0;
  border:4px solid #26343b;
  box-shadow:
    0 9px 0 #657078,
    0 13px 16px #0007;
}

#kingsHQ .roof{
  height:27%;
  clip-path:none;
  left:0;
  right:0;
  background:#1e2930;
  border:3px solid #11181c;
}

#kingsHQ .sign{
  top:-17%;
  background:#dc3434;
  color:#fff;
  border-color:#751c1c;
  font-size:10px;
  min-width:100%;
}

#kingsHQ .windows{
  top:35%;
}

#kingsHQ .window{
  height:25px;
  background:#78bdd5;
}

#kingsHQ .door{
  height:43%;
  width:20%;
  background:#303d43;
}

#kingsHQ .hqBanner{
  position:absolute;
  left:5%;
  right:5%;
  bottom:5%;
  padding:3px;
  text-align:center;
  background:#e43131;
  color:#fff;
  border-radius:3px;
  font-size:7px;
  font-weight:bold;
}

/* Express */
#kingsExpress{
  position:absolute;
  z-index:110;
  right:9%;
  top:61%;
  width:12%;
  height:13%;
  cursor:pointer;
}

#kingsExpress .buildingBody{
  background:#e0e3e3;
  border-color:#3c4246;
}

#kingsExpress .roof{
  clip-path:none;
  background:#222c32;
}

#kingsExpress .sign{
  background:#dc3434;
  color:#fff;
  border-color:#711d1d;
}

/* =========================================================
   PARK / CITY DETAILS
========================================================= */

.park{
  position:absolute;
  z-index:65;
  right:31%;
  top:3%;
  width:19%;
  height:13%;
  border-radius:18px;
  background:#72a95b;
  border:3px solid #5b914a;
}

.park::before{
  content:"🌳   🌳   🌳";
  position:absolute;
  left:15%;
  top:30%;
  font-size:22px;
}

.bench{
  position:absolute;
  z-index:70;
  width:35px;
  height:8px;
  border-radius:3px;
  background:#6c432c;
  border:2px solid #412719;
}

.bench.b1{right:34%;top:10%}
.bench.b2{right:38%;top:13%}

.lamp{
  position:absolute;
  z-index:75;
  width:4px;
  height:22px;
  background:#30383b;
}

.lamp::before{
  content:"";
  position:absolute;
  left:-3px;
  top:-4px;
  width:10px;
  height:7px;
  border-radius:50%;
  background:#fff3a3;
  box-shadow:0 0 8px #fff3a3;
}

.l1{left:7%;top:35%}
.l2{left:19%;top:44%}
.l3{left:47%;top:63%}
.l4{right:26%;top:45%}
.l5{right:12%;top:81%}

.tree{
  position:absolute;
  z-index:67;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#43833e;
  border:4px solid #316633;
  box-shadow:
    inset 5px 5px #72ad5a,
    0 5px 4px #0003;
}

.tree::after{
  content:"";
  position:absolute;
  width:7px;
  height:13px;
  left:9px;
  top:25px;
  background:#65442b;
  z-index:-1;
}

.t1{left:34%;top:8%}
.t2{left:43%;top:16%}
.t3{left:46%;top:90%}
.t4{right:29%;top:42%}
.t5{right:4%;top:48%}
.t6{right:27%;top:84%}

.parking{
  position:absolute;
  z-index:64;
  right:4%;
  top:42%;
  width:20%;
  height:11%;
  background:#747875;
  border:3px solid #555a58;
  border-radius:8px;
}

.parking span{
  position:absolute;
  width:25%;
  height:65%;
  top:18%;
  border-left:2px solid #ddd;
  border-right:2px solid #ddd;
}

.parking span:nth-child(1){left:5%}
.parking span:nth-child(2){left:35%}
.parking span:nth-child(3){left:65%}

/* =========================================================
   PEOPLE + CARS
========================================================= */

#peopleLayer,
#carsLayer,
#deliveryLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:500;
}

.person{
  position:absolute;
  width:9px;
  height:14px;
  border-radius:5px 5px 3px 3px;
  background:#2f6fb3;
  border:1px solid #182f4a;
  box-shadow:0 2px 3px #0007;
  transition:
    left 9s linear,
    top 9s linear;
}

.person::before{
  content:"";
  position:absolute;
  left:1px;
  top:-5px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ffd0aa;
  border:1px solid #7c4c36;
}

.person.red{
  background:#d83434;
  border-color:#701919;
}

.person.red::before{
  background:#ffc0a5;
}

.car{
  position:absolute;
  width:27px;
  height:13px;
  border-radius:4px;
  background:#e7e7e7;
  border:2px solid #333a3e;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 5px #0008;
}

.car::before,
.car::after{
  content:"";
  position:absolute;
  top:2px;
  width:5px;
  height:7px;
  background:#91cfe4;
  border:1px solid #42565e;
}

.car::before{left:4px}
.car::after{right:4px}

.car.redCar{
  background:#c94343;
}

.car.blueCar{
  background:#4288b8;
}

.car.yellowCar{
  background:#d7aa35;
}

.deliveryVan{
  position:absolute;
  width:30px;
  height:15px;
  border-radius:4px;
  background:#f2f2f2;
  border:2px solid #303437;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 5px #0008;
}

.deliveryVan::before{
  content:"DELIVERY";
  position:absolute;
  left:4px;
  top:2px;
  color:#222;
  font-size:4px;
  font-weight:bold;
}

/* =========================================================
   BOTTOM BAR
========================================================= */

#bottomBar{
  height:57px;
  flex-shrink:0;
  display:flex;
  background:#182229;
  border-top:2px solid #4c5e67;
  z-index:1000;
}

.navButton{
  flex:1;
  background:#1d2930;
  color:#9caeb6;
  border-right:1px solid #3b4a51;
  font-size:9px;
  font-weight:bold;
}

.navButton span{
  display:block;
  font-size:19px;
  margin-bottom:1px;
}

.navButton:active{
  background:#30424c;
}

/* =========================================================
   PANEL
========================================================= */

#panel{
  position:absolute;
  z-index:2000;
  right:15px;
  top:15px;
  width:330px;
  max-width:calc(100% - 30px);
  max-height:calc(100% - 30px);
  overflow:auto;
  padding:16px;
  border-radius:15px;
  background:linear-gradient(#293940,#182329);
  border:2px solid #667982;
  box-shadow:0 15px 35px #000b;
  display:none;
}

#panel.open{
  display:block;
}

#panel h2{
  margin:0 0 5px;
  font-size:18px;
}

#panel p{
  margin:6px 0;
  color:#b8c7cd;
  font-size:12px;
  line-height:1.4;
}

.panelClose{
  position:absolute;
  right:9px;
  top:8px;
  width:27px;

<script>

/* =========================================================
   KING'S MART TYCOON
   COMPLETE SINGLE FILE
========================================================= */

const SAVE_KEY =
  "kings_mart_tycoon_city_v10";


/* =========================================================
   DEFAULT GAME
========================================================= */

let game={

  company:"Your Company",

  cash:5000,

  reputation:50,

  marketShare:8,

  customers:42,

  totalStores:1,

  selectedShop:0,

  staff:[],

  properties:[

    {
      name:"Old Corner Shop",
      price:2200,
      bought:false,
      storeIndex:null
    },

    {
      name:"Empty High Street",
      price:3500,
      bought:false,
      storeIndex:null
    },

    {
      name:"Abandoned Supermarket",
      price:4800,
      bought:false,
      storeIndex:null
    }

  ],

  stores:[

    {
      name:"My Mart",
      level:1,
      condition:65,
      baseIncome:12,
      customers:42,
      upgrades:0,
      stock:100,
      maxStock:100
    }

  ],

  rival:{

    name:"King's Mart",

    customers:220,

    health:100,

    marketShare:32,

    income:95,

    stage:"HEALTHY"

  },

  lastSave:Date.now()

};


/* =========================================================
   LOAD OLD SAVES
========================================================= */

function loadGame(){

  let old=null;

  try{

    old=
      JSON.parse(
        localStorage.getItem(
          SAVE_KEY
        )
      );

  }catch(e){

    old=null;

  }


  /*
    Also migrate previous versions.
  */

  if(!old){

    const oldKeys=[
      "kings_mart_tycoon_city_v9",
      "kings_mart_tycoon_city_v8",
      "kings_mart_tycoon_city_v7",
      "kings_mart_tycoon_v5"
    ];

    for(
      const key of oldKeys
    ){

      try{

        const data=
          JSON.parse(
            localStorage.getItem(key)
          );

        if(data){

          old=data;
          break;

        }

      }catch(e){}

    }

  }


  if(old){

    game={
      ...game,
      ...old,

      rival:{
        ...game.rival,
        ...(old.rival||{})
      }

    };


    if(!Array.isArray(game.stores))
      game.stores=[];

    if(!Array.isArray(game.properties))
      game.properties=[];

    if(!Array.isArray(game.staff))
      game.staff=[];


    game.stores.forEach(
      shop=>{

        if(typeof shop.stock!=="number")
          shop.stock=100;

        if(typeof shop.maxStock!=="number")
          shop.maxStock=100;

        if(typeof shop.upgrades!=="number")
          shop.upgrades=0;

        if(typeof shop.level!=="number")
          shop.level=1;

        if(typeof shop.condition!=="number")
          shop.condition=50;

        if(typeof shop.customers!=="number")
          shop.customers=10;

      }
    );


    /*
      Make sure properties remain linked
      to their purchased shop.
    */

    game.properties.forEach(
      property=>{

        if(
          property.bought &&
          (
            property.storeIndex===null ||
            typeof property.storeIndex!=="number" ||
            !game.stores[property.storeIndex]
          )
        ){

          property.bought=false;
          property.storeIndex=null;

        }

      }
    );

  }


  if(!game.stores.length){

    game.stores.push({

      name:"My Mart",

      level:1,

      condition:65,

      baseIncome:12,

      customers:42,

      upgrades:0,

      stock:100,

      maxStock:100

    });

  }

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  game.lastSave=
    Date.now();

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(game)
    );

  }catch(e){}

}


/* =========================================================
   OFFLINE EARNINGS
========================================================= */

function offlineIncome(){

  const now=
    Date.now();

  const elapsed=
    Math.min(
      28800,
      Math.max(
        0,
        (now-game.lastSave)/1000
      )
    );


  if(elapsed<5)
    return;


  const amount=
    Math.floor(
      getIncome()*
      elapsed
    );


  if(amount>0){

    game.cash+=amount;

    setTimeout(
      ()=>{
        toast(
          "💰 Offline earnings: £"+
          amount.toLocaleString()
        );
      },
      500
    );

  }

}


/* =========================================================
   STAFF
========================================================= */

const ADAM={

  name:"Adam",

  age:18,

  intelligence:100,

  management:95,

  stocking:65,

  customerService:72,

  problemSolving:100,

  trait:"Natural Manager"

};


function getStaffBonus(){

  let incomeBonus=0;

  let customerBonus=0;


  game.staff.forEach(
    person=>{

      incomeBonus +=
        (person.management||0)
        *0.00035;


      incomeBonus +=
        (person.problemSolving||0)
        *0.00015;


      customerBonus +=
        (person.intelligence||0)
        *0.00008;


      customerBonus +=
        (person.customerService||0)
        *0.00006;


    }
  );


  return {
    incomeBonus,
    customerBonus
  };

}


/* =========================================================
   INCOME
========================================================= */

function getIncome(){

  let total=0;

  game.stores.forEach(
    shop=>{

      let shopIncome=
        shop.baseIncome+
        ((shop.level-1)*10)+
        ((shop.upgrades||0)*8);


      const stock=
        Math.max(
          0,
          Math.min(
            1,
            (shop.stock||0)/100
          )
        );


      /*
        Shops with stock still make money,
        but poor stock reduces income.
      */

      const stockMultiplier=
        0.5+
        stock*0.5;


      const conditionMultiplier=
        0.7+
        Math.max(
          0,
          Math.min(
            1,
            shop.condition/100
          )
        )*0.3;


      total +=
        shopIncome*
        stockMultiplier*
        conditionMultiplier;

    }
  );


  const staff=
    getStaffBonus();


  total *=
    1+
    staff.incomeBonus;


  return total;

}


/* =========================================================
   CUSTOMER UPDATE
========================================================= */

function updateCustomers(seconds){

  const staff=
    getStaffBonus();


  game.stores.forEach(
    shop=>{

      const stock=
        Math.min(
          1,
          Math.max(
            0,
            (shop.stock||0)/100
          )
        );


      const condition=
        Math.min(
          1,
          Math.max(
            0,
            shop.condition/100
          )
        );


      let growth=
        (
          .012+
          staff.customerBonus+
          stock*.007+
          condition*.006
        )*
        seconds;


      /*
        A well stocked shop grows faster.
      */

      shop.customers+=
        growth;


      /*
        Poor stock hurts customer numbers.
      */

      if(shop.stock<10){

        shop.customers=
          Math.max(
            5,
            shop.customers-
            .01*
            seconds
          );

      }

    }
  );


  game.customers=
    game.stores.reduce(
      (sum,shop)=>
        sum+shop.customers,
      0
    );

}


/* =========================================================
   STOCK
========================================================= */

let deliveryTimer=0;

function updateStock(seconds){

  game.stores.forEach(
    shop=>{

      if(
        typeof shop.stock!=="number"
      )
        shop.stock=100;


      /*
        Customers consume stock.
      */

      const consumption=
        shop.customers*
        .0022*
        seconds;


      shop.stock=
        Math.max(
          0,
          shop.stock-
          consumption
        );

    }
  );


  deliveryTimer+=seconds;


  if(deliveryTimer>=45){

    deliveryTimer=0;

    game.stores.forEach(
      shop=>{

        shop.stock=
          Math.min(
            shop.maxStock||100,
            (shop.stock||0)+35
          );

      }
    );


    createDeliveryVan();

    toast(
      "🚚 Your delivery has arrived!"
    );

  }

}


/* =========================================================
   STAFF PANEL
========================================================= */

function openStaff(){

  let html=
    "<h2>👷 Your Staff</h2>";

  html+=
    "<p>Good employees improve your stores.</p>";


  if(game.staff.length===0){

    html+=
      "<p>No employees hired yet.</p>";

  }


  game.staff.forEach(
    person=>{

      html+=`

        <div class="staffCard">

          <strong>${person.name}</strong>

          Age: ${person.age}<br>

          Intelligence:
          ${person.intelligence}<br>

          Management:
          ${person.management}<br>

          Stocking:
          ${person.stocking}<br>

          Customer Service:
          ${person.customerService}<br>

          Problem Solving:
          ${person.problemSolving}<br>

          ⭐ ${person.trait}

        </div>

      `;

    }
  );


  const alreadyHasAdam=
    game.staff.some(
      p=>p.name==="Adam"
    );


  if(!alreadyHasAdam){

    html+=`

      <button
        class="actionButton green"
        onclick="hireAdam()"
      >
        👨‍💼 Hire Adam — £1,000
      </button>

    `;

  }else{

    html+=
      "<p>Adam is already working for you.</p>";

  }


  openPanel(html);

}


function hireAdam(){

  if(game.cash<1000){

    toast(
      "❌ You need £1,000."
    );

    return;

  }


  game.cash-=1000;

  game.staff.push({
    ...ADAM
  });


  saveGame();

  render();

  openStaff();

  toast(
    "👨‍💼 Adam joined your company!"
  );

}


/* =========================================================
   SHOP PANEL
========================================================= */

function openShop(index){

  if(!game.stores[index])
    return;


  game.selectedShop=
    index;


  const shop=
    game.stores[index];


  const income=
    getShopIncome(shop);


  const upgradeCost=
    1000+
    shop.level*850+

function getShopIncome(shop){

  let income=
    shop.baseIncome+
    ((shop.level-1)*10)+
    ((shop.upgrades||0)*8);


  const stock=
    Math.max(
      0,
      Math.min(
        1,
        (shop.stock||0)/100
      )
    );


  const stockMultiplier=
    .5+
    stock*.5;


  const condition=
    .7+
    Math.max(
      0,
      Math.min(
        1,
        shop.condition/100
      )
    )*.3;


  return income*
    stockMultiplier*
    condition;

}


function upgradeShop(index){

  const shop=
    game.stores[index];

  if(!shop)
    return;


  const cost=
    1000+
    shop.level*850+
    (shop.upgrades||0)*700;


  if(game.cash<cost){

    toast(
      "❌ Not enough cash."
    );

    return;

  }


  game.cash-=cost;

  shop.level++;

  shop.upgrades++;

  shop.condition=
    Math.min(
      100,
      shop.condition+8
    );

  shop.customers+=
    10;

  shop.stock=
    Math.min(
      100,
      (shop.stock||0)+15
    );

  game.reputation+=2;


  saveGame();

  render();

  openShop(index);

  toast(
    "⬆️ "+shop.name+" upgraded!"
  );

}

          .textContent=

            ?shop.level

          );

          so upgrades never push it into

      }else{

          "playerPurchased"
        );

  game.stores.forEach(
    (shop,index)=>{

      if(index===0){

        el=
          document.getElementById(
            "shop1"
          );

      }else{

          game.properties.find(
            p=>p.storeIndex===index
          );


        if(property){

function rivalAI(){

  const health=
    game.rival.health;


  if(health>75){

    game.rival.stage=
      "HEALTHY";

  }else if(health>50){

    game.rival.stage=
      "UNDER PRESSURE";

  }else if(health>30){

    game.rival.stage=
      "STRUGGLING";

  }else if(health>10){

    game.rival.stage=
      "DISTRESSED";

  }else{

    game.rival.stage=
      "FOR SALE";

  }


  const maximum=
    Math.floor(
      220*
      health/
      100
    );


  game.rival.customers=
    Math.min(
      game.rival.customers,
      maximum
    );


  if(
    game.rival.health<=0
  ){

    game.rival.customers=0;

  }

}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function createPeople(){

  const layer=
    document.getElementById(
      "peopleLayer"
    );


  layer.innerHTML="";


  /*
    Keep visible customers sensible.
  */

  const playerCount=
    Math.min(
      18,
      Math.max(
        7,
        Math.floor(
          game.customers/12
        )
      )
    );


  for(
    let i=0;
    i<playerCount;
    i++
  ){

    const route=
      playerRoutes[
        i%playerRoutes.length
      ];


    const person=
      document.createElement(
        "div"
      );


    person.className=
      "person";


    person.dataset.route=
      i%playerRoutes.length;


    person.route=
      route;


    person.point=
      Math.floor(
        Math.random()*
        route.length
      );


    const start=
      route[
        person.point
      ];


    person.style.left=
      start[0]+"%";

    person.style.top=
      start[1]+"%";


    layer.appendChild(
      person
    );


    setTimeout(
      ()=>{
        movePerson(person);
      },
      Math.random()*3000
    );

  }


  /*
    Rival customers are deliberately
    limited visually.
  */

  const rivalCount=
    Math.min(
      5,
      Math.max(
        1,
        Math.ceil(
          game.rival.customers/70
        )
      )
    );


  for(
    let i=0;
    i<rivalCount;
    i++
  ){

    const route=
      rivalRoutes[
        i%rivalRoutes.length
      ];


    const person=
      document.createElement(
        "div"
      );


    person.className=
      "person red";


    person.route=
      route;


    person.point=
      Math.floor(
        Math.random()*
        route.length
      );


    const start=
      route[
        person.point
      ];


    person.style.left=
      start[0]+"%";

    person.style.top=
      start[1]+"%";


    layer.appendChild(
      person
    );


    setTimeout(
      ()=>{
        movePerson(person);
      },
      Math.random()*5000
    );

  }

}


function movePerson(person){

  if(!person.route)
    return;


  person.point=
    (person.point+1)%
    person.route.length;


  const target=
    person.route[
      person.point
    ];


  /*
    Slow pedestrians.
  */

  person.style.transition=
    "left 9s linear, top 9s linear";


  person.style.left=
    target[0]+"%";

  person.style.top=
    target[1]+"%";


  /*
    Pause naturally at junctions.
  */

  const pause=
    8500+
    Math.random()*4500;


  setTimeout(
    ()=>{
      movePerson(person);
    },
    pause
  );

}

  trafficRoutes.forEach(
    (route,index)=>{

      /*
        Some routes get two cars.
      */

      const number=
        index===1||
        index===7
        ?2
        :1;


      for(
        let n=0;
        n<number;
        n++
      ){

        const car=
          document.createElement(
            "div"
          );


        car.className=
          "car "+
          (
            index%3===0
            ?"blueCar"
            :index%3===1
            ?"yellowCar"
            :""
          );


        layer.appendChild(
          car
        );


        cars.push({

          element:car,

          route:route,

          progress:
            (
              Math.random()*
              (route.length-1)
            ),

          speed:
            .0016+
            Math.random()*.0013

        });

      }

    }
  );

}


/* =========================================================
   BUILDING COLLISION
========================================================= */

function getSolidBuildingRects(){

  const world=
    document.getElementById(
      "world"
    );


  const worldRect=
    world.getBoundingClientRect();


  const ids=[
    "shop1",
    "shop2",
    "shop3",
    "shop4",
    "kingsHQ",
    "kingsExpress"
  ];


  return ids
    .map(
      id=>
        document.getElementById(id)
    )
    .filter(Boolean)
    .map(
      el=>{

        const r=
          el.getBoundingClientRect();


        return {

          left:
            (r.left-worldRect.left)/
            worldRect.width*
            100,

          right:
            (r.right-worldRect.left)/
            worldRect.width*
            100,

          top:
            (r.top-worldRect.top)/
            worldRect.height*
            100,

          bottom:
            (r.bottom-worldRect.top)/
            worldRect.height*
            100

        };

      }
    );

}


function carHitsBuilding(
  x,
  y
){

  const rects=
    getSolidBuildingRects();


  /*
    Small safety margin around buildings.
  */

  const paddingX=1.3;
  const paddingY=1.3;


  return rects.some(
    rect=>{

      return (
        x>
          rect.left-paddingX&&

        x<
          rect.right+paddingX&&

        y>
          rect.top-paddingY&&

        y<
          rect.bottom+paddingY
      );

    }
  );

}


/* =========================================================
   CAR-TO-CAR TRAFFIC
========================================================= */

function trafficTooClose(
  currentCar,
  x,
  y
){

  for(
    const other of cars
  ){

    if(
      other===currentCar
    )
      continue;


    const index=
      Math.floor(
        other.progress
      );


    const a=
      other.route[
        Math.min(
          index,
          other.route.length-1
        )
      ];


    if(!a)
      continue;


    const dx=
      a[0]-x;

    const dy=
      a[1]-y;


    const distance=
      Math.sqrt(
        dx*dx+
        dy*dy
      );


    if(distance<2.4)
      return true;

  }


  return false;

}


/* =========================================================
   UPDATE CARS
========================================================= */

function updateCars(){

  cars.forEach(
    car=>{

      let speed=
        car.speed;


      const index=
        Math.floor(
          car.progress
        );


      const next=
        Math.min(
          index+1,
          car.route.length-1
        );


      const amount=
        car.progress-index;


      const a=
        car.route[index];

      const b=
        car.route[next];


      if(!a||!b)
        return;


      const x=
        a[0]+
        (b[0]-a[0])*
        amount;


      const y=
        a[1]+
        (b[1]-a[1])*
        amount;


      /*
        Cars slow down when another car
        is in front of them.
      */

      if(
        trafficTooClose(
          car,
          x,
          y
        )
      ){

        speed*=.25;

      }


      /*
        Building collision protection.
      */

      const nextProgress=
        car.progress+
        speed;


      const testIndex=
        Math.floor(
          nextProgress
        );


      const testNext=
        Math.min(
          testIndex+1,
          car.route.length-1
        );


      const testAmount=
        nextProgress-testIndex;


      const testA=
        car.route[testIndex];


      const testB=
        car.route[testNext];


      if(testA&&testB){

        const testX=
          testA[0]+
          (testB[0]-testA[0])*
          testAmount;


        const testY=
          testA[1]+
          (testB[1]-testA[1])*
          testAmount;


        if(
          carHitsBuilding(
            testX,
            testY
          )
        ){

          speed=0;

        }

      }


      car.progress+=
        speed;


      if(
        car.progress>=
        car.route.length-1
      ){

        car.progress=0;

      }


      const finalIndex=
        Math.floor(
          car.progress
        );


      const finalNext=
        Math.min(
          finalIndex+1,
          car.route.length-1
        );


      const finalAmount=
        car.progress-
        finalIndex;


      const finalA=
        car.route[
          finalIndex
        ];

      const finalB=
        car.route[
          finalNext
        ];


      if(!finalA||!finalB)
        return;


      const finalX=
        finalA[0]+
        (finalB[0]-finalA[0])*
        finalAmount;


      const finalY=
        finalA[1]+
        (finalB[1]-finalA[1])*
        finalAmount;


      if(
        carHitsBuilding(
          finalX,
          finalY
        )
      ){

        return;

      }


      car.element.style.left=
        finalX+"%";

      car.element.style.top=
        finalY+"%";


      const dx=
        finalB[0]-
        finalA[0];

      const dy=
        finalB[1]-
        finalA[1];


      let angle=0;


      if(
        Math.abs(dx)>
        Math.abs(dy)
      ){

        angle=
          dx>=0
          ?0
          :180;

      }else{

        angle=
          dy>=0
          ?90
          :-90;

      }


      car.element.style.transform=
        "translate(-50%,-50%) rotate("+
        angle+
        "deg)";

    }
  );

}


/* =========================================================
   DELIVERY VAN
========================================================= */

function createDeliveryVan(){

  const layer=
    document.getElementById(
      "deliveryLayer"
    );


  const van=
    document.createElement(
      "div"
    );


  van.className=
    "deliveryVan";


  layer.appendChild(
    van
  );


  let progress=0;


  const route=[
    [3,51],
    [16,51],
    [28,51],
    [38,51],
    [51,51]
  ];


  function move(){

    progress+=.012;


    if(
      progress>=
      route.length-1
    ){

      van.remove();

      return;

    }


    const i=
      Math.floor(
        progress
      );


    const next=
      Math.min(
        i+1,
        route.length-1
      );


    const amount=
      progress-i;


    const a=
      route[i];

    const b=
      route[next];


    const x=
      a[0]+
      (b[0]-a[0])*
      amount;


    const y=
      a[1]+
      (b[1]-a[1])*
      amount;


    van.style.left=
      x+"%";

    van.style.top=
      y+"%";


    requestAnimationFrame(
      move
    );

  }


  move();

}


/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvent(){

  if(
    Math.random()>.12
  )
    return;


  const events=[

    {
      text:
        "🛍️ Shopping boom! Customers flood the city.",
      cash:500,
      customers:15
    },

    {
      text:
        "🚚 Supplier discount! Your delivery was cheap.",
      cash:300,
      customers:8
    },

    {
      text:
        "📺 Your shop appeared on TV!",
      cash:250,
      customers:12
    },

    {
      text:
        "⚡ Electricity bill!",
      cash:-150,
      customers:-4
    },

    {
      text:
        "🎉 City festival!",
      cash:700,
      customers:20
    }

  ];


  const event=
    events[
      Math.floor(
        Math.random()*
        events.length
      )
    ];


  game.cash+=
    event.cash;


  game.customers=
    Math.max(
      0,
      game.customers+
      event.customers
    );


  game.stores.forEach(
    shop=>{
      shop.customers=
        Math.max(
          1,
          shop.customers+
          event.customers/
          Math.max(
            1,
            game.stores.length
          )
        );
    }
  );


  saveGame();

  render();

  toast(
    event.text
  );

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastLoop=
  Date.now();


function gameLoop(){

  const now=
    Date.now();


  const seconds=
    Math.min(
      1,
      (now-lastLoop)/1000
    );


  lastLoop=
    now;


  /*
    Idle income.
  */

  game.cash+=
    getIncome()*
    seconds;


  /*
    Individual customer growth.
  */

  updateCustomers(
    seconds
  );


  /*
    Stock consumption and deliveries.
  */

  updateStock(
    seconds
  );


  /*
    Rival can weaken naturally
    when you dominate the market.
  */

  if(
    game.marketShare>12&&
    game.rival.health>0
  ){

    game.rival.health=
      Math.max(
        0,
        game.rival.health-
        .0009*
        seconds
      );

  }


  /*
    Rival customers slowly recover
    while healthy.
  */

  if(
    game.rival.health>50&&
    game.rival.customers<220
  ){

    game.rival.customers=
      Math.min(
        220,
        game.rival.customers+
        .008*
        seconds
      );

  }


  rivalAI();

  updateCars();

  renderRival();

}


/* =========================================================
   RENDER HUD
========================================================= */

function render(){

  document.getElementById(
    "companyName"
  ).textContent=
    game.company;


  document.getElementById(
    "cash"
  ).textContent=
    "£"+
    Math.floor(
      game.cash
    ).toLocaleString();


  document.getElementById(
    "income"
  ).textContent=
    "£"+
    getIncome().toFixed(1)+
    "/s";


  document.getElementById(
    "customers"
  ).textContent=
    Math.floor(
      game.customers
    );


  document.getElementById(
    "market"
  ).textContent=
    game.marketShare.toFixed(1)+
    "%";


  document.getElementById(
    "reputation"
  ).textContent=
    Math.floor(
      game.reputation
    );


  renderBuildings();

  renderRival();

}


/* =========================================================
   STARTUP
========================================================= */

function startGame(){

  loadGame();

  offlineIncome();

  rivalAI();

  render();

  createCars();

  createPeople();

  saveGame();


  /*
    Re-render after offline calculation.
  */

  setTimeout(
    ()=>{
      render();
      createPeople();
    },
    600
  );


  toast(
    "👑 Welcome to King's Mart Tycoon!"
  );

}

   TIMERS
========================================================= */

setInterval(
  ()=>{
    createPeople();
  },
  22000
);


setInterval(
  ()=>{
    randomEvent();
  },
  30000
);


setInterval(
  ()=>{
    saveGame();
  },
  5000
);


setInterval(
  ()=>{
    render();
  },
  1000
);


/* =========================================================
   START
========================================================= */

startGame();

setInterval(
  gameLoop,
  33
);

</script>
