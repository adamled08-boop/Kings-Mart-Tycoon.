<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no,
viewport-fit=cover">

<title>King's Mart Tycoon</title>

<style>

/* =========================================================
   BASIC
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#10151b;
    color:white;
}

body{
    touch-action:manipulation;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#78a96a;
}


/* =========================================================
   TOP HUD
========================================================= */

#topBar{
    position:absolute;
    z-index:50;
    top:0;
    left:0;
    right:0;

    min-height:76px;

    padding:8px;

    display:flex;
    align-items:center;
    gap:8px;

    background:rgba(12,17,22,.96);

    border-bottom:2px solid #38434d;
}

.brand{
    min-width:175px;
    padding:6px 10px;
}

.brandName{
    font-size:20px;
    font-weight:900;
    color:#ffd34d;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.brandSmall{
    color:#87939f;
    font-size:10px;
    margin-top:2px;
}

.stats{
    display:flex;
    gap:7px;
    flex:1;
    overflow:hidden;
}

.stat{
    min-width:88px;

    padding:7px 9px;

    border-radius:10px;

    background:#202a33;
    border:1px solid #3c4a55;
}

.statLabel{
    color:#8d9aa5;
    font-size:9px;
    text-transform:uppercase;
}

.statValue{
    margin-top:2px;
    font-size:16px;
    font-weight:900;
}

.money{
    color:#72e38a;
}


/* =========================================================
   CITY
========================================================= */

#world{
    position:absolute;

    top:76px;
    left:0;
    right:0;
    bottom:72px;

    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),
        #78a96a;

    background-size:45px 45px;
}

.city{
    position:absolute;
    inset:0;
}


/* =========================================================
   ROADS
========================================================= */

.road{
    position:absolute;
    background:#4b5156;
    box-shadow:
        inset 0 0 0 3px rgba(0,0,0,.12);
}

.road.horizontal{
    left:0;
    right:0;
    height:80px;
}

.road.vertical{
    top:0;
    bottom:0;
    width:80px;
}

.road.h1{
    top:31%;
}

.road.h2{
    top:69%;
}

.road.v1{
    left:25%;
}

.road.v2{
    left:73%;
}

.roadLine{
    position:absolute;
    background:#e4c95d;
}

.road.horizontal .roadLine{
    top:38px;
    left:0;
    right:0;
    height:4px;

    background:
        repeating-linear-gradient(
            90deg,
            #e6d16d 0 35px,
            transparent 35px 65px
        );
}

.road.vertical .roadLine{
    left:38px;
    top:0;
    bottom:0;
    width:4px;

    background:
        repeating-linear-gradient(
            180deg,
            #e6d16d 0 35px,
            transparent 35px 65px
        );
}


/* =========================================================
   BUILDINGS
========================================================= */

.building{
    position:absolute;

    width:150px;
    height:112px;

    border-radius:10px;

    border:4px solid #222a30;

    overflow:hidden;

    box-shadow:
        0 7px 0 rgba(0,0,0,.25),
        0 12px 25px rgba(0,0,0,.22);

    transition:.15s;
}

.building:active{
    transform:scale(.96);
}

.buildingRoof{
    height:25px;
    background:#202a32;
    border-bottom:3px solid #12181c;
}

.buildingFront{
    position:absolute;

    left:0;
    right:0;
    top:25px;
    bottom:0;

    background:#ddd4bd;
}

.windowRow{
    display:flex;
    gap:6px;
    padding:8px;
}

.window{
    flex:1;
    height:26px;

    background:#73b6d0;

    border:2px solid #24323b;
}

.shopDoor{
    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:27px;
    height:43px;

    background:#4d6670;

    border:3px solid #263038;
}

.shopSign{
    position:absolute;

    top:28px;
    left:10px;
    right:10px;

    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:4px;

    background:#ffd34d;
    color:#151515;

    font-size:11px;
    font-weight:900;

    overflow:hidden;
    white-space:nowrap;
}

.storeOwned .buildingFront{
    background:#e7dfc9;
}

.storeRival .buildingFront{
    background:#c9ccd0;
}

.storeRival .shopSign{
    background:#d94b4b;
    color:white;
}

.abandoned .buildingFront{
    background:#777b7d;
}

.abandoned .shopSign{
    background:#4d5255;
    color:#e0e5e8;
}


/* BUILDING POSITIONS */

.b1{
    left:5%;
    top:7%;
}

.b2{
    left:39%;
    top:7%;
}

.b3{
    left:78%;
    top:9%;
}

.b4{
    left:5%;
    top:48%;
}

.b5{
    left:39%;
    top:49%;
}

.b6{
    left:78%;
    top:48%;
}

.b7{
    left:39%;
    top:79%;
}


/* =========================================================
   PEOPLE
========================================================= */

.person{
    position:absolute;

    width:11px;
    height:11px;

    border-radius:50%;

    background:#f3c39b;

    border:2px solid #222;

    z-index:5;

    animation:
        walk 4s linear infinite;
}

.person:after{
    content:"";

    position:absolute;

    width:7px;
    height:9px;

    left:0;
    top:8px;

    border-radius:4px;

    background:#3567a5;
}

@keyframes walk{

    0%{
        transform:translateX(-20px);
    }

    50%{
        transform:translateX(80px);
    }

    100%{
        transform:translateX(-20px);
    }

}


/* =========================================================
   CARS
========================================================= */

.car{
    position:absolute;

    width:42px;
    height:20px;

    border-radius:6px;

    background:#d54c4c;

    border:2px solid #202020;

    z-index:4;

    animation:
        drive 9s linear infinite;
}

.car:before{
    content:"";

    position:absolute;

    width:16px;
    height:9px;

    left:11px;
    top:2px;

    background:#8ac0d2;
}

@keyframes drive{

    from{
        left:-60px;
    }

    to{
        left:110%;
    }

}


/* =========================================================
   CITY LABELS
========================================================= */

.marker{
    position:absolute;

    z-index:20;

    padding:5px 8px;

    border-radius:7px;

    background:#111820;

    border:2px solid #657381;

    color:white;

    font-size:10px;
    font-weight:900;

    box-shadow:
        0 4px 8px #0006;

    pointer-events:none;
}

.marker.player{
    background:#a67b14;
    border-color:#ffd34d;
}

.marker.rival{
    background:#9c2d2d;
    border-color:#f16b6b;
}


/* =========================================================
   BOTTOM MENU
========================================================= */

#bottomBar{
    position:absolute;

    z-index:60;

    left:0;
    right:0;
    bottom:0;

    height:72px;

    display:flex;
    gap:6px;

    padding:7px;

    background:rgba(12,17,22,.97);

    border-top:2px solid #38434d;
}

.navButton{
    flex:1;

    min-width:0;

    border-radius:10px;

    background:#202a33;

    color:#cbd4dc;

    border:1px solid #3d4b56;

    font-weight:800;

    font-size:11px;
}

.navButton span{
    display:block;

    font-size:19px;

    margin-bottom:2px;
}

.navButton.active{
    background:#ffd34d;
    color:#171717;
    border-color:#ffd34d;
}


/* =========================================================
   MANAGEMENT PANEL
========================================================= */

#panel{
    position:absolute;

    z-index:100;

    top:90px;
    right:12px;

    width:min(400px,94vw);

    max-height:
        calc(100vh - 175px);

    overflow:auto;

    display:none;

    background:#151c23;

    border:2px solid #52606d;

    border-radius:16px;

    box-shadow:
        0 15px 50px #000b;
}

.panelHeader{
    position:sticky;

    top:0;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:13px 15px;

    background:#1e2831;

    border-bottom:1px solid #394650;
}

.panelTitle{
    font-size:18px;
    font-weight:900;
}

.close{
    width:32px;
    height:32px;

    border-radius:8px;

    background:#3a4650;

    color:white;

    font-size:18px;
}

.panelBody{
    padding:14px;
}


/* =========================================================
   CARDS
========================================================= */

.card{
    background:#202a33;

    border:1px solid #3b4853;

    border-radius:12px;

    padding:12px;

    margin-bottom:10px;
}

.cardTitle{
    font-size:15px;
    font-weight:900;

    margin-bottom:6px;
}

.cardText{
    color:#aeb9c3;

    font-size:12px;

    line-height:1.5;
}

.action{
    width:100%;

    padding:12px;

    margin-top:8px;

    border-radius:9px;

    background:#ffd34d;

    color:#151515;

    font-weight:900;
}

.action.green{
    background:#65d77e;
}

.action.red{
    background:#dc5656;
    color:white;
}

.action.blue{
    background:#5da6e0;
    color:white;
}

.action.gray{
    background:#4a5660;
    color:white;
}

.action:active{
    transform:scale(.98);
}


/* =========================================================
   PROGRESS
========================================================= */

.progress{
    height:9px;

    margin-top:9px;

    border-radius:20px;

    background:#0f1419;

    overflow:hidden;
}

.progressFill{
    height:100%;
    background:#65d77e;
}


/* =========================================================
   TOAST
========================================================= */

#toast{
    position:absolute;

    z-index:500;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    min-width:220px;
    max-width:90%;

    padding:12px 16px;

    border-radius:10px;

    background:#10161c;

    border:2px solid #52606d;

    box-shadow:
        0 8px 30px #0008;

    text-align:center;

    font-weight:800;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

#toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   EVENT BOX
========================================================= */

#eventBox{
    position:absolute;

    z-index:80;

    left:12px;
    bottom:84px;

    width:min(330px,calc(100vw - 24px));

    background:#182129;

    border:2px solid #596875;

    border-radius:12px;

    padding:12px;

    display:none;

    box-shadow:
        0 10px 30px #0009;
}

.eventTitle{
    font-weight:900;
    color:#ffd34d;

    margin-bottom:4px;
}

.eventText{
    color:#c5cdd4;

    font-size:12px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    #topBar{
        min-height:62px;
        padding:5px;
    }

    .brand{
        min-width:115px;
        padding:5px;
    }

    .brandName{
        font-size:14px;
    }

    .brandSmall{
        display:none;
    }

    .stats{
        gap:4px;
    }

    .stat{
        min-width:68px;
        padding:5px;
    }

    .statLabel{
        font-size:8px;
    }

    .statValue{
        font-size:12px;
    }

    #world{
        top:62px;
        bottom:65px;
    }

    #bottomBar{
        height:65px;
    }

    .navButton{
        font-size:9px;
    }

    .navButton span{
        font-size:17px;
    }

    .building{
        width:105px;
        height:82px;
        border-width:3px;
    }

    .buildingRoof{
        height:18px;
    }

    .buildingFront{
        top:18px;
    }

    .shopSign{
        top:20px;
        height:18px;
        font-size:8px;

        left:5px;
        right:5px;
    }

    .windowRow{
        padding:5px;
        gap:3px;
    }

    .window{
        height:18px;
    }

    .shopDoor{
        width:20px;
        height:30px;
    }

    #panel{
        top:70px;
        right:7px;

        width:min(360px,94vw);

        max-height:
            calc(100vh - 140px);
    }

    #toast{
        bottom:76px;
    }

    #eventBox{
        bottom:76px;
    }
}


@media(max-width:480px){

    .stat:nth-child(4){
        display:none;
    }

    .stat:nth-child(5){
        display:none;
    }

    .brand{
        min-width:90px;
    }

    .brandName{
        font-size:12px;
    }

    .building{
        width:82px;
        height:65px;
    }

    .buildingRoof{
        height:14px;
    }

    .buildingFront{
        top:14px;
    }

    .shopSign{
        top:16px;
        height:14px;
        font-size:6px;
    }

    .window{
        height:13px;
    }

    .shopDoor{
        width:16px;
        height:24px;
    }

    .road.horizontal{
        height:58px;
    }

    .road.horizontal .roadLine{
        top:27px;
    }

    .road.vertical{
        width:58px;
    }

    .road.vertical .roadLine{
        left:27px;
    }
}


/* LANDSCAPE SMALL HEIGHT */

@media(max-height:500px)
and (orientation:landscape){

    #topBar{
        min-height:54px;
    }

    #world{
        top:54px;
        bottom:57px;
    }

    #bottomBar{
        height:57px;
    }

    .navButton span{
        display:inline;
        font-size:15px;
        margin-right:3px;
    }

    .navButton{
        font-size:10px;
    }

    #panel{
        top:60px;

        max-height:
            calc(100vh - 115px);
    }
}

</style>
</head>


<body>


<div id="game">


<!-- =====================================================
     TOP HUD
===================================================== -->

<div id="topBar">

    <div class="brand">

        <div
            class="brandName"
            id="companyName"
        >
            MY MART
        </div>

        <div class="brandSmall">
            CITY TYCOON
        </div>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="statLabel">
                Cash
            </div>

            <div
                class="statValue money"
                id="cash"
            >
                £5,000
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Income
            </div>

            <div
                class="statValue"
                id="income"
            >
                £0/s
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Customers
            </div>

            <div
                class="statValue"
                id="customers"
            >
                42
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Market
            </div>

            <div
                class="statValue"
                id="market"
            >
                4.2%
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Reputation
            </div>

            <div
                class="statValue"
                id="reputation"
            >
                45
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     CITY WORLD
===================================================== -->

<div id="world">

<div class="city">


<!-- ROADS -->

<div class="road horizontal h1">
    <div class="roadLine"></div>
</div>

<div class="road horizontal h2">
    <div class="roadLine"></div>
</div>

<div class="road vertical v1">
    <div class="roadLine"></div>
</div>

<div class="road vertical v2">
    <div class="roadLine"></div>
</div>


<!-- YOUR SHOP -->

<div
    class="building storeOwned b1"
    onclick="openShop(0)"
>

    <div class="buildingRoof"></div>

    <div class="buildingFront">

        <div class="windowRow">

            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>

        </div>

        <div
            class="shopSign"
            id="storeSign0"
        >
            YOUR SHOP
        </div>

        <div class="shopDoor"></div>

    </div>

</div>


<!-- KING'S MART -->

<div
    class="building storeRival b2"
    onclick="openRival()"
>

    <div class="buildingRoof"></div>

    <div class="buildingFront">

        <div class="windowRow">

            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>

        </div>

        <div class="shopSign">
            KING'S MART
        </div>

        <div class="shopDoor"></div>

    </div>

</div>


<!-- PROPERTY 1 -->

<div
    class="building abandoned b3"
    onclick="buyProperty(2)"
>

    <div class="buildingRoof"></div>

    <div class="buildingFront">

        <div class="windowRow">

            <div class="window"></div>
            <div class="window"></div>

        </div>

        <div class="shopSign">
            FOR SALE
        </div>

        <div class="shopDoor"></div>

    </div>

</div>


<!-- PROPERTY 2 -->

<div
    class="building abandoned b4"
    onclick="buyProperty(0)"
>

    <div class="buildingRoof"></div>

    <div class="buildingFront">

        <div class="windowRow">

            <div class="window"></div>
            <div class="window"></div>

        </div>

        <div class="shopSign">
            ABANDONED
        </div>

        <div class="shopDoor"></div>

    </div>

</div>


<!-- PROPERTY 3 -->

<div
    class="building abandoned b5"
    onclick="buyProperty(1)"
>

    <div class="buildingRoof"></div>

    <div class="buildingFront">

        <div class="windowRow">

            <div class="window"></div>
            <div class="window"></div>

        </div>

        <div class="shopSign">
            FOR SALE
        </div>

        <div class="shopDoor"></div>

    </div>

</div>


<!-- SECOND KING'S MART -->

<div
    class="building storeRival b6"
    onclick="openRival()"
>

    <div class="buildingRoof"></div>

    <div class="buildingFront">

        <div class="windowRow">

            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>

        </div>

        <div class="shopSign">
            KING'S MART
        </div>

        <div class="shopDoor"></div>

    </div>

</div>


<!-- PROPERTY 4 -->

<div
    class="building abandoned b7"
    onclick="buyProperty(1)"
>

    <div class="buildingRoof"></div>

    <div class="buildingFront">

        <div class="windowRow">

            <div class="window"></div>
            <div class="window"></div>

        </div>

        <div class="shopSign">
            ABANDONED
        </div>

        <div class="shopDoor"></div>

    </div>

</div>


<!-- LABELS -->

<div
    class="marker player"
    style="left:8%;top:4%;"
>
    YOUR SHOP
</div>

<div
    class="marker rival"
    style="left:42%;top:4%;"
>
    KING'S MART
</div>


<!-- PEOPLE -->

<div
    class="person"
    style="left:10%;top:31%;animation-delay:0s"
></div>

<div
    class="person"
    style="left:28%;top:68%;animation-delay:1s"
></div>

<div
    class="person"
    style="left:58%;top:31%;animation-delay:2s"
></div>

<div
    class="person"
    style="left:75%;top:69%;animation-delay:3s"
></div>

<div
    class="person"
    style="left:48%;top:89%;animation-delay:1.5s"
></div>


<!-- CARS -->

<div
    class="car"
    style="top:34%;animation-delay:0s"
></div>

<div
    class="car"
    style="top:72%;animation-delay:4s"
></div>


</div>
</div>


<!-- =====================================================
     BOTTOM MENU
===================================================== -->

<div id="bottomBar">

    <button
        class="navButton active"
        onclick="showCity()"
    >
        <span>🏙️</span>
        City
    </button>


    <button
        class="navButton"
        onclick="openShops()"
    >
        <span>🏪</span>
        Shops
    </button>


    <button
        class="navButton"
        onclick="openStaff()"
    >
        <span>👨‍💼</span>
        Staff
    </button>


    <button
        class="navButton"
        onclick="openUpgrades()"
    >
        <span>⬆️</span>
        Upgrades
    </button>


    <button
        class="navButton"
        onclick="openRival()"
    >
        <span>⚔️</span>
        Rival
    </button>


    <button
        class="navButton"
        onclick="openCompany()"
    >
        <span>🏢</span>
        Company
    </button>

</div>


<!-- =====================================================
     PANEL
===================================================== -->

<div id="panel">

    <div class="panelHeader">

        <div
            class="panelTitle"
            id="panelTitle"
        >
            Management
        </div>

        <button
            class="close"
            onclick="closePanel()"

            ×

    </div>

    <div
        class="panelBody"
        id="panelBody"
    ></div>

</div>


<!-- EVENT -->

<div id="eventBox">

    <div
        class="eventTitle"
        id="eventTitle"

/* =========================================================

========================================================= */

function loadGame(){

    try{

        const data =
            JSON.parse(saved);

        game =
            Object.assign(
                game,
                data
            );

        calculateOffline();

        render();

    }
    catch(error){

            "Could not load save.",
            error

        render();

    }

}


/* =========================================================

========================================================= */

}


/* =========================================================
   OFFLINE EARNINGS
========================================================= */

function calculateOffline(){

    const seconds =
        Math.min(
            (Date.now()-game.lastSave)/1000,
            8*60*60
        );

    if(seconds < 10){
        return;
    }

    const income =
        getIncomePerSecond();

    const earned =
        Math.floor(
            income*seconds
        );

    if(earned>0){

        game.cash += earned;

        game.totalEarned += earned;

        setTimeout(()=>{

            toast(

                formatMoney(earned)

        },500);

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(value){

    return Math.floor(value)
        .toLocaleString("en-GB");

}


/* =========================================================
   SHOP POWER
========================================================= */

function shopPower(shop){

    let power = 1;

    power +=
        shop.shelves*.12;

    power +=
        shop.fridges*.15;

    power +=
        shop.lighting*.10;

    power +=
        shop.security*.08;

    power +=
        shop.checkout*.15;

    power +=
        shop.staffRoom*.10;

    power +=
        shop.expansion*.30;


    for(
        const person
        of game.staff
    ){

        if(person.hired){

            power +=
                (
                    person.management+
                    person.service+
                    person.stocking
                )/900;

        }

    }

    return power;

}


/* =========================================================
   INCOME
========================================================= */

function getIncomePerSecond(){

    let total=0;

    for(
        const shop
        of game.stores
    ){

        total +=
            shop.baseIncome *
            shop.level *
            shopPower(shop) *
            Math.max(
                .2,
                shop.condition/100
            );

    }

    return total;

}


/* =========================================================
   GAME LOOP
========================================================= */

setInterval(()=>{

    const income =
        getIncomePerSecond();

    game.cash += income;

    game.totalEarned += income;

    rivalAI();

    randomEvent();

    render();

    saveGame();

},1000);


/* =========================================================

========================================================= */

function rivalAI(){

    const pressure =
        game.marketShare*.08+
        game.reputation*.025;

    game.rival.health -=
        pressure/100;

    game.rival.health =
        Math.max(
            0,
            Math.min(
                100,
                game.rival.health
            )
        );


    if(game.rival.health>75){

        game.rival.stage=
            "HEALTHY";

    }
    else if(game.rival.health>50){

        game.rival.stage=
            "UNDER PRESSURE";

    }
    else if(game.rival.health>30){

        game.rival.stage=
            "STRUGGLING";

    }
    else if(game.rival.health>10){

        game.rival.stage=
            "DISTRESSED";

    }
    else{

        game.rival.stage=
            "FOR SALE";

    }

}

            title:"📱 Viral Post",

            text:
                "Your company went viral online!",

            effect:()=>{

                game.reputation+=5;

                game.marketShare+=1;

                game.customers+=20;

            }

        },

        {

            title:"💡 Power Problem",

            text:
                "One of your stores suffered a power problem.",

            effect:()=>{

                game.cash =
                    Math.max(
                        0,
                        game.cash-250
                    );

            }

        }

    ];


    const event =
        events[
            Math.floor(
                Math.random()*events.length
            )
        ];


    event.effect();


    document.getElementById(
        "eventTitle"
    ).textContent =
        event.title;


    document.getElementById(
        "eventText"
    ).textContent =
        event.text;


    document.getElementById(
        "eventBox"
    ).style.display =
        "block";


    setTimeout(()=>{

        document.getElementById(
            "eventBox"
        ).style.display =
            "none";

    },6000);

}


/* =========================================================
   PANEL
========================================================= */

function panel(title,html){

    document.getElementById(
        "panelTitle"
    ).textContent =
        title;


    document.getElementById(
        "panelBody"
    ).innerHTML =
        html;


    document.getElementById(
        "panel"
    ).style.display =
        "block";

}


function closePanel(){

    document.getElementById(
        "panel"
    ).style.display =
        "none";

}


function showCity(){

    closePanel();

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(message){

    const box =
        document.getElementById(
            "toast"
        );


    box.textContent =
        message;


    box.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(()=>{

            box.classList.remove(
                "show"
            );

        },3000);

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    document.getElementById(
        "companyName"
    ).textContent =
        game.company;


    document.getElementById(
        "cash"
    ).textContent =
        "£"+
        formatMoney(game.cash);


    document.getElementById(
        "income"
    ).textContent =
        "£"+
        formatMoney(
            getIncomePerSecond()
        )+
        "/s";


    document.getElementById(
        "customers"
    ).textContent =
        Math.floor(
            game.customers
        );


    document.getElementById(
        "market"
    ).textContent =
        game.marketShare
            .toFixed(1)+
        "%";


    document.getElementById(
        "reputation"
    ).textContent =
        Math.floor(
            game.reputation
        );


    if(game.stores[0]){

        document.getElementById(
            "storeSign0"
        ).textContent =
            game.stores[0].name
                .toUpperCase();

    }

}


/* =========================================================
   START STRAIGHT INTO GAME
========================================================= */

loadGame();

render();

</script>
