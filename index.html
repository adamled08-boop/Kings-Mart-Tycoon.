<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>King's Mart Tycoon</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#101820;
  color:#fff;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

#game{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#101820;
}

/* =========================================================
   TOP HUD
========================================================= */

#topBar{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 12px;
  background:linear-gradient(#263640,#172128);
  border-bottom:2px solid #53656e;
  z-index:2000;
  overflow:hidden;
}

.logo{
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#f6ca43,#c48b19);
  color:#3d2a06;
  font-size:25px;
  box-shadow:inset 0 2px #fff8,0 3px 8px #0008;
  user-select:none;
}

.companyTitle{
  min-width:100px;
  max-width:190px;
  overflow:hidden;
}

.companyTitle b{
  display:block;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.companyTitle small{
  color:#9eafb7;
  font-size:9px;
}

.stats{
  margin-left:auto;
  display:flex;
  gap:7px;
  align-items:center;
}

.stat{
  min-width:74px;
  padding:5px 8px;
  border-radius:8px;
  background:#111a1f;
  border:1px solid #42545e;
  text-align:center;
  box-shadow:inset 0 1px #fff1;
}

.stat span{
  display:block;
  color:#91a5ae;
  font-size:8px;
  text-transform:uppercase;
}

.stat strong{
  display:block;
  margin-top:2px;
  font-size:12px;
}

/* =========================================================
   WORLD
========================================================= */

#world{
  position:relative;
  flex:1;
  overflow:hidden;
  background:#70a657;
  isolation:isolate;
}

#world::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 30%,#ffffff09 0 2px,transparent 3px),
    radial-gradient(circle at 70% 70%,#00000008 0 2px,transparent 3px);
  background-size:55px 55px,70px 70px;
}

/* =========================================================
   CITY BANDS
   The player district is deliberately organised into
   ROAD -> GRASS -> ROAD -> GRASS -> ROAD -> GRASS...
========================================================= */

.playerDistrict{
  position:absolute;
  left:0;
  top:0;
  width:58%;
  height:100%;
  z-index:2;
  background:#72a95a;
}

.rivalDistrict{
  position:absolute;
  left:69%;
  top:0;
  width:31%;
  height:100%;
  z-index:2;
  background:#6da052;
}

.zoneLabel{
  position:absolute;
  z-index:120;
  padding:5px 9px;
  border-radius:8px;
  background:#172027cc;
  border:1px solid #ffffff22;
  font-size:8px;
  font-weight:bold;
  letter-spacing:1px;
  pointer-events:none;
}

.playerZone{
  left:2%;
  top:2%;
}

.rivalZone{
  right:2%;
  top:2%;
}

/* =========================================================
   RIVER
========================================================= */

#river{
  position:absolute;
  z-index:25;
  left:58%;
  top:0;
  width:11%;
  height:100%;
  background:
    repeating-linear-gradient(
      0deg,
      #438bb0 0 18px,
      #4b96b9 18px 36px
    );
  border-left:5px solid #80b5c8;
  border-right:5px solid #80b5c8;
  box-shadow:inset 0 0 20px #174c6c99;
}

#river::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      -18deg,
      transparent 0 34px,
      #ffffff18 34px 38px,
      transparent 38px 70px
    );
}

/* =========================================================
   ROADS
========================================================= */

.road{
  position:absolute;
  z-index:70;
  background:#3a4043;
  box-shadow:
    inset 0 2px #555c5f,
    inset 0 -2px #25292b;
}

.road.horizontal{
  left:0;
  width:100%;
  height:7%;
  transform:translateY(-50%);
}

.road.vertical{
  top:0;
  height:100%;
  width:4.5%;
  transform:translateX(-50%);
}

/* Four major horizontal roads */
.hRoad1{top:18%}
.hRoad2{top:39%}
.hRoad3{top:60%}
.hRoad4{top:81%}

/* Player-side vertical roads */
.vRoad1{left:14%}
.vRoad2{left:36%}
.vRoad3{left:51%}

/* King's Mart road */
.vRoad4{left:82%}

/* road centre lines */
.road.horizontal::after{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  height:3px;
  transform:translateY(-50%);
  background:
    repeating-linear-gradient(
      90deg,
      #f1d34d 0 22px,
      transparent 22px 42px
    );
}

.road.vertical::after{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:3px;
  height:100%;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(
      0deg,
      #f1d34d 0 22px,
      transparent 22px 42px
    );
}

/* =========================================================
   ROAD INTERSECTIONS
========================================================= */

.intersection{
  position:absolute;
  z-index:75;
  width:4.5%;
  height:7%;
  transform:translate(-50%,-50%);
  background:#3a4043;
}

/* =========================================================
   PAVEMENTS
========================================================= */

.pavement{
  position:absolute;
  z-index:80;
  background:#bbb8aa;
  border-top:2px solid #d4d0bd;
  border-bottom:2px solid #8d8a7e;
  box-shadow:0 2px 4px #0003;
}

.pavement.horizontal{
  left:0;
  width:100%;
  height:2.4%;
  transform:translateY(-50%);
}

.pavement.vertical{
  top:0;
  height:100%;
  width:1.7%;
  transform:translateX(-50%);
}

.ph1{top:22%}
.ph2{top:43%}
.ph3{top:64%}
.ph4{top:85%}

.pv1{left:10%}
.pv2{left:32%}
.pv3{left:47%}
.pv4{left:86%}

/* =========================================================
   GRASS SHOP PLOTS
   These sit BETWEEN roads, never over them.
========================================================= */

.shopPlot{
  position:absolute;
  z-index:40;
  background:#83b866;
  border:3px solid #67974e;
  border-radius:14px;
  box-shadow:
    inset 0 0 0 2px #ffffff12,
    0 4px 8px #0002;
}

.shopPlot::after{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:9px;
  border:1px dashed #ffffff1c;
  pointer-events:none;
}

/*
  Player plots:
  plot 1 between road 1 and road 2
  plot 2 between road 2 and road 3
  plot 3 between road 3 and road 4
  plot 4 below road 4
*/

.playerPlot1{
  left:3%;
  top:22.8%;
  width:25%;
  height:14%;
}

.playerPlot2{
  left:3%;
  top:43.8%;
  width:25%;
  height:14%;
}

.playerPlot3{
  left:3%;
  top:64.8%;
  width:25%;
  height:14%;
}

.playerPlot4{
  left:3%;
  top:85.8%;
  width:25%;
  height:11%;
}

/* More grass beside the shops */

.sideGrass1{
  position:absolute;
  z-index:38;
  left:29%;
  top:23%;
  width:26%;
  height:13%;
  background:#79ad5d;
  border-radius:14px;
}

.sideGrass2{
  position:absolute;
  z-index:38;
  left:29%;
  top:44%;
  width:26%;
  height:13%;
  background:#79ad5d;
  border-radius:14px;
}

.sideGrass3{
  position:absolute;
  z-index:38;
  left:29%;
  top:65%;
  width:26%;
  height:13%;
  background:#79ad5d;
  border-radius:14px;
}

.bottomGrass{
  position:absolute;
  z-index:35;
  left:0;
  bottom:0;
  width:58%;
  height:10%;
  background:#67994f;
}

/* =========================================================
   SHOP BUILDINGS
========================================================= */

.building{
  position:absolute;
  z-index:140;
  cursor:pointer;
  user-select:none;
  border-radius:7px;
}

.buildingBody{
  position:absolute;
  inset:13% 0 0;
  border:3px solid #3c3f3c;
  border-radius:5px;
  background:#d8c58a;
  box-shadow:
    0 6px 0 #756e59,
    0 9px 12px #0005;
}

.roof{
  position:absolute;
  left:-5%;
  right:-5%;
  top:0;
  height:25%;
  clip-path:polygon(7% 100%,50% 0,93% 100%);
  background:#7a4e35;
  border:2px solid #4d3426;
  z-index:4;
}

.windows{
  position:absolute;
  left:10%;
  right:10%;
  top:31%;
  display:flex;
  justify-content:space-around;
  gap:3px;
}

.window{
  width:20%;
  height:16px;
  background:#8ed3e8;
  border:2px solid #34464a;
  box-shadow:inset 0 0 7px #fff8;
}

.door{
  position:absolute;
  bottom:0;
  left:50%;
  width:19%;
  height:35%;
  transform:translateX(-50%);
  background:#543d2d;
  border:2px solid #30241d;
  z-index:5;
}

.sign{
  position:absolute;
  z-index:20;
  left:50%;
  top:-21%;
  transform:translateX(-50%);
  min-width:100%;
  padding:4px 7px;
  text-align:center;
  border-radius:5px;
  background:#f1c63e;
  color:#2c250d;
  border:2px solid #725c18;
  box-shadow:0 3px 4px #0005;
  font-weight:900;
  font-size:8px;
  white-space:nowrap;
}

.levelBadge{
  position:absolute;
  z-index:30;
  right:-7px;
  top:-7px;
  min-width:23px;
  padding:3px 4px;
  border-radius:10px;
  background:#172027;
  border:1px solid #9aa9ad;
  color:#fff;
  text-align:center;
  font-size:7px;
  font-weight:bold;
}

.stockBadge{
  position:absolute;
  z-index:30;
  left:50%;
  bottom:-22px;
  transform:translateX(-50%);
  padding:3px 6px;
  border-radius:8px;
  background:#172027;
  border:1px solid #647984;
  font-size:7px;
  white-space:nowrap;
}

.stateBadge{
  position:absolute;
  z-index:31;
  left:50%;
  bottom:-38px;
  transform:translateX(-50%);
  padding:2px 6px;
  border-radius:8px;
  font-size:6px;
  white-space:nowrap;
  font-weight:bold;
  border:1px solid #0004;
}

.stateBadge.OPEN{
  background:#3f8f4d;
}

.stateBadge.BUSY{
  background:#c98b2c;
}

.stateBadge.LOW_STOCK{
  background:#c93e3e;
}

.stateBadge.CLOSED{
  background:#555;
}

.stateBadge.RENOVATING{
  background:#3f85b4;
}

.stateBadge.OPENING{
  background:#8a5cc9;
}

/* ---------------------------------------------------------
   PLAYER SHOPS
   One vertical line.
   Each building stays completely inside its grass plot.
--------------------------------------------------------- */

#shop1{
  left:8%;
  top:26%;
  width:15%;
  height:9%;
}

#shop2{
  left:8%;
  top:47%;
  width:15%;
  height:9%;
}

#shop3{
  left:8%;
  top:68%;
  width:15%;
  height:9%;
}

#shop4{
  left:8%;
  top:88%;
  width:15%;
  height:7%;
}

.playerBuilding .buildingBody,
.playerPurchased .buildingBody{
  background:#e3c35a;
}

.playerBuilding .roof,
.playerPurchased .roof{
  background:#9b622d;
}

.abandonedBuilding .buildingBody{
  background:#777;
}

.abandonedBuilding .roof{
  background:#494949;
}

.abandonedBuilding .sign{
  background:#555;
  color:#eee;
}

/* =========================================================
   KING'S MART DISTRICT
========================================================= */

#kingsHQ{
  position:absolute;
  z-index:145;
  left:74%;
  top:23%;
  width:22%;
  height:16%;
  cursor:pointer;
}

#kingsHQ .buildingBody{
  background:#d7dce0;
  border:4px solid #26343b;
  box-shadow:
    0 9px 0 #657078,
    0 13px 16px #0007;
}

#kingsHQ .roof{
  height:27%;
  left:0;
  right:0;
  clip-path:none;
  background:#1e2930;
  border:3px solid #11181c;
}

#kingsHQ .sign{
  top:-18%;
  background:#dc3434;
  color:#fff;
  border-color:#751c1c;
  font-size:10px;
}

#kingsHQ .window{
  height:23px;
  background:#78bdd5;
}

#kingsHQ .door{
  height:43%;
  width:20%;
  background:#303d43;
}

.hqBanner{
  position:absolute;
  left:5%;
  right:5%;
  bottom:5%;
  padding:3px;
  text-align:center;
  background:#e43131;
  color:#fff;
  border-radius:3px;
  font-size:7px;
  font-weight:bold;
}

#kingsExpress{
  position:absolute;
  z-index:145;
  left:77%;
  top:67%;
  width:16%;
  height:12%;
  cursor:pointer;
}

#kingsExpress .buildingBody{
  background:#e0e3e3;
  border-color:#3c4246;
}

#kingsExpress .roof{
  clip-path:none;
  background:#222c32;
}

#kingsExpress .sign{
  background:#dc3434;
  color:#fff;
  border-color:#711d1d;
}

#rivalCustomerLabel{
  position:absolute;
  z-index:180;
  left:75%;
  top:39%;
  width:20%;
  text-align:center;
  padding:5px;
  border-radius:7px;
  background:#571b1b;
  border:1px solid #e65b5b;
  color:#fff;
  font-size:8px;
  font-weight:bold;
}

/* =========================================================
   PARK / DETAILS
========================================================= */

.park{
  position:absolute;
  z-index:45;
  left:30%;
  top:5%;
  width:23%;
  height:11%;
  border-radius:16px;
  background:#72a95b;
  border:3px solid #5b914a;
}

.park::before{
  content:"🌳   🌳   🌳";
  position:absolute;
  left:13%;
  top:28%;
  font-size:20px;
}

.bench{
  position:absolute;
  z-index:90;
  width:35px;
  height:8px;
  border-radius:3px;
  background:#6c432c;
  border:2px solid #412719;
}

.b1{
  left:38%;
  top:9%;
}

.b2{
  left:46%;
  top:12%;
}

.tree{
  position:absolute;
  z-index:95;
  width:29px;
  height:29px;
  border-radius:50%;
  background:#43833e;
  border:4px solid #316633;
  box-shadow:
    inset 5px 5px #72ad5a,
    0 5px 4px #0003;
}

.tree::after{
  content:"";
  position:absolute;
  width:7px;
  height:13px;
  left:7px;
  top:23px;
  background:#65442b;
  z-index:-1;
}

.t1{left:32%;top:27%}
.t2{left:45%;top:33%}
.t3{left:34%;top:47%}
.t4{left:45%;top:58%}
.t5{left:31%;top:69%}
.t6{left:44%;top:90%}

.lamp{
  position:absolute;
  z-index:100;
  width:4px;
  height:22px;
  background:#30383b;
}

.lamp::before{
  content:"";
  position:absolute;
  left:-3px;
  top:-4px;
  width:10px;
  height:7px;
  border-radius:50%;
  background:#fff3a3;
  box-shadow:0 0 8px #fff3a3;
}

.l1{left:5%;top:31%}
.l2{left:27%;top:44%}
.l3{left:53%;top:69%}
.l4{left:55%;top:89%}
.l5{right:6%;top:54%}

.parking{
  position:absolute;
  z-index:60;
  left:73%;
  top:43%;
  width:23%;
  height:11%;
  background:#747875;
  border:3px solid #555a58;
  border-radius:8px;
}

.parking span{
  position:absolute;
  width:25%;
  height:65%;
  top:18%;
  border-left:2px solid #ddd;
  border-right:2px solid #ddd;
}

.parking span:nth-child(1){left:5%}
.parking span:nth-child(2){left:35%}
.parking span:nth-child(3){left:65%}

/* =========================================================
   BRIDGES
========================================================= */

.bridge{
  position:absolute;
  z-index:110;
  left:63.5%;
  width:11%;
  height:7%;
  transform:translate(-50%,-50%);
  background:
    repeating-linear-gradient(
      90deg,
      #6b7376 0 22px,
      #51585b 22px 44px
    );
  border-top:3px solid #d0d1c8;
  border-bottom:3px solid #d0d1c8;
  box-shadow:0 3px 8px #0006;
}

.bridge1{top:18%}
.bridge2{top:81%}

/* =========================================================
   ROUNDABOUT
========================================================= */

#roundabout{
  position:absolute;
  z-index:100;
  left:45%;
  top:39%;
  width:125px;
  height:125px;
  transform:translate(-50%,-50%);
}

.roundRoad{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#383e40;
  border:5px solid #555b5d;
  box-shadow:0 4px 9px #0005;
}

.roundRoad::before{
  content:"";
  position:absolute;
  inset:17px;
  border-radius:50%;
  border:3px dashed #f1d34d;
}

.roundIsland{
  position:absolute;
  inset:42px;
  border-radius:50%;
  background:#72a653;
  border:4px solid #527b3d;
  box-shadow:inset 0 0 8px #0004;
}

.roundIsland::after{
  content:"🌳";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:20px;
}

/* =========================================================
   PEOPLE / CARS / DELIVERIES
========================================================= */

#peopleLayer,
#carsLayer,
#deliveryLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:500;
}

.person{
  position:absolute;
  width:9px;
  height:14px;
  border-radius:5px 5px 3px 3px;
  background:#2f6fb3;
  border:1px solid #182f4a;
  box-shadow:0 2px 3px #0007;
  transform:translate(-50%,-50%);
}

.person::before{
  content:"";
  position:absolute;
  left:1px;
  top:-5px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ffd0aa;
  border:1px solid #7c4c36;
}

.person.red{
  background:#d83434;
  border-color:#701919;
}

.person.hidden{
  opacity:0;
}

.car{
  position:absolute;
  width:27px;
  height:13px;
  border-radius:4px;
  background:#e7e7e7;
  border:2px solid #333a3e;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 5px #0008;
}

.car::before,
.car::after{
  content:"";
  position:absolute;
  top:2px;
  width:5px;
  height:7px;
  background:#91cfe4;
  border:1px solid #42565e;
}

.car::before{left:4px}
.car::after{right:4px}

.car.blueCar{background:#4288b8}
.car.yellowCar{background:#d7aa35}
.car.redCar{background:#c94343}

.deliveryVan{
  position:absolute;
  width:30px;
  height:15px;
  border-radius:4px;
  background:#f2f2f2;
  border:2px solid #303437;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 5px #0008;
}

.deliveryVan::before{
  content:"DELIVERY";
  position:absolute;
  left:4px;
  top:2px;
  color:#222;
  font-size:4px;
  font-weight:bold;
}

/* =========================================================
   DEBUG
========================================================= */

#debugLayer{
  position:absolute;
  inset:0;
  z-index:900;
  pointer-events:none;
  display:none;
}

#debugLayer.on{
  display:block;
}

#debugBadge{
  position:absolute;
  left:6px;
  top:62px;
  z-index:950;
  background:#c93e3e;
  color:#fff;
  font-size:9px;
  font-weight:bold;
  padding:3px 7px;
  border-radius:6px;
  display:none;
}

#debugBadge.on{
  display:block;
}

/* =========================================================
   BOTTOM BAR
========================================================= */

#bottomBar{
  height:57px;
  flex-shrink:0;
  display:flex;
  background:#182229;
  border-top:2px solid #4c5e67;
  z-index:2000;
}

.navButton{
  flex:1;
  background:#1d2930;
  color:#9caeb6;
  border-right:1px solid #3b4a51;
  font-size:9px;
  font-weight:bold;
}

.navButton span{
  display:block;
  font-size:19px;
  margin-bottom:1px;
}

.navButton:active{
  background:#30424c;
}

/* =========================================================
   PANEL
========================================================= */

#panel{
  position:absolute;
  z-index:2500;
  right:15px;
  top:15px;
  width:330px;
  max-width:calc(100% - 30px);
  max-height:calc(100% - 30px);
  overflow:auto;
  padding:16px;
  border-radius:15px;

const SAVE_KEY = "kings_mart_tycoon_city_v12";

let DEBUG_MODE = false;


/* =========================================================
   GAME STATE
========================================================= */

let game = {

  company:"Your Company",

  cash:5000,

  reputation:50,

  marketShare:8,

  customers:42,

  totalStores:1,

  selectedShop:0,

  staff:[],

  properties:[

      customers:42,
      upgrades:0,

      maxStock:100,

    }

  ],

  rival:{

    name:"King's Mart",

    customers:220,

    health:100,

    marketShare:32,

    income:95,

    stage:"HEALTHY"

  },

  lastSave:Date.now()

};


/* =========================================================
   LOAD GAME
========================================================= */

function loadGame(){

  let old=null;

  try{

    old=JSON.parse(
      localStorage.getItem(SAVE_KEY)
    );

  }catch(e){

    old=null;

  }


  if(!old){

    const oldKeys=[

      "kings_mart_tycoon_city_v11",
      "kings_mart_tycoon_city_v10",
      "kings_mart_tycoon_city_v9",
      "kings_mart_tycoon_city_v8",
      "kings_mart_tycoon_city_v7",
      "kings_mart_tycoon_v5"

    ];

    for(const key of oldKeys){

      try{

        const data=
          JSON.parse(localStorage.getItem(key));

        if(data){

          old=data;

          break;

        }

      }catch(e){}

    }

  }


  if(old){

    game={
      ...game,
      ...old,
      rival:{
        ...game.rival,
        ...(old.rival||{})
      }
    };

  }


  if(!Array.isArray(game.stores))
    game.stores=[];

  if(!Array.isArray(game.properties))
    game.properties=[];

  if(!Array.isArray(game.staff))
    game.staff=[];


  game.stores.forEach(shop=>{

    if(typeof shop.stock!=="number")
      shop.stock=100;

    if(typeof shop.maxStock!=="number")
      shop.maxStock=100;

    if(typeof shop.upgrades!=="number")
      shop.upgrades=0;

    if(typeof shop.level!=="number")
      shop.level=1;

    if(typeof shop.condition!=="number")
      shop.condition=50;

    if(typeof shop.customers!=="number")
      shop.customers=10;

    if(typeof shop.renovatingUntil!=="number")
      shop.renovatingUntil=0;

    if(typeof shop.openingUntil!=="number")
      shop.openingUntil=0;

  });


  if(!game.stores.length){

    game.stores.push({

      name:"My Mart",
      level:1,
      condition:65,
      baseIncome:12,
      customers:42,
      upgrades:0,
      stock:100,
      maxStock:100,
      renovatingUntil:0,
      openingUntil:0

    });

  }


  while(game.properties.length<3){

    const defaults=[

      {
        name:"Old Corner Shop",
        price:2200,
        bought:false,
        storeIndex:null
      },

      {
        name:"Empty High Street",
        price:3500,
        bought:false,
        storeIndex:null
      },

      {
        name:"Abandoned Supermarket",
        price:4800,
        bought:false,
        storeIndex:null
      }

    ];

    game.properties.push(
      defaults[game.properties.length]
    );

  }


  game.properties.forEach(property=>{

    if(
      property.bought &&
      (
        property.storeIndex===null ||
        typeof property.storeIndex!=="number" ||
        !game.stores[property.storeIndex]
      )
    ){

      property.bought=false;
      property.storeIndex=null;

    }

  });

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  game.lastSave=Date.now();

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(game)
    );

  }catch(e){}

}


/* =========================================================
   OFFLINE EARNINGS
========================================================= */

function offlineIncome(){

  const now=Date.now();

  const elapsed=Math.min(
    28800,
    Math.max(
      0,
      (now-game.lastSave)/1000
    )
  );

  if(elapsed<5)
    return;


  const amount=Math.floor(
    getIncome()*elapsed
  );


  if(amount>0){

    game.cash+=amount;

    setTimeout(()=>{

      toast(
        "💰 Offline earnings: £"+
        amount.toLocaleString()
      );

    },500);

  }

}

   STAFF
========================================================= */

const ADAM={

  name:"Adam",

  age:18,

  intelligence:100,

  management:95,

  stocking:65,

  customerService:72,

  problemSolving:100,

  trait:"Natural Manager"

};


function getStaffBonus(){

  let incomeBonus=0;

  let customerBonus=0;

  let stockBonus=0;


  game.staff.forEach(p=>{

    incomeBonus+=
      (p.management||0)*0.00035;

    incomeBonus+=
      (p.problemSolving||0)*0.00015;

    customerBonus+=
      (p.intelligence||0)*0.00008;

    customerBonus+=
      (p.customerService||0)*0.00006;

    stockBonus+=
      (p.stocking||0)*0.0003;

  });


  return{
    incomeBonus,
    customerBonus,
    stockBonus
  };

}

========================================================= */

function getShopIncome(shop){

  let income=

    shop.baseIncome+

    ((shop.level-1)*10)+

    ((shop.upgrades||0)*8);


  const stock=Math.max(
    0,
    Math.min(
      1,
      (shop.stock||0)/100
    )
  );


  const stockMultiplier=
    0.5+(stock*0.5);


  const condition=
    0.7+
    Math.max(
      0,
      Math.min(
        1,
        shop.condition/100
      )
    )*0.3;
