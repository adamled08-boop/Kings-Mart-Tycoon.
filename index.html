<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>King's Mart Tycoon</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#172019;
  color:white;
  user-select:none;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}


/* =========================================================
   GAME FRAME
========================================================= */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#162019;
}


/* =========================================================
   TOP HUD
========================================================= */

#topBar{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:70px;
  z-index:9000;

  display:flex;
  align-items:center;
  gap:10px;

  padding:8px 12px;

  background:
    linear-gradient(
      180deg,
      rgba(20,25,23,.97),
      rgba(20,25,23,.88)
    );

  border-bottom:2px solid rgba(255,255,255,.1);

  box-shadow:
    0 4px 15px rgba(0,0,0,.35);
}

.logo{
  min-width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #f5c542,
      #d99616
    );

  color:#3c2600;
  font-size:25px;
  font-weight:900;

  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.4),
    0 3px 8px rgba(0,0,0,.3);
}

.companyHud{
  min-width:115px;
  max-width:170px;
  overflow:hidden;
}

.companyHud .small{
  color:#aeb8b1;
  font-size:10px;
  text-transform:uppercase;
  font-weight:bold;
}

#companyNameHud{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-weight:900;
  font-size:15px;
}

.stats{
  display:flex;
  gap:7px;
  flex:1;
  overflow:hidden;
}

.stat{
  min-width:72px;
  padding:7px 9px;

  border-radius:10px;

  background:
    rgba(255,255,255,.07);

  border:1px solid rgba(255,255,255,.08);

  text-align:center;
}

.statLabel{
  display:block;
  color:#9da9a0;
  font-size:9px;
  text-transform:uppercase;
  font-weight:bold;
}

.statValue{
  display:block;
  margin-top:2px;
  font-size:13px;
  font-weight:900;
}


/* =========================================================
   CITY CAMERA
========================================================= */

#world{
  position:absolute;
  left:0;
  right:0;
  top:70px;
  bottom:66px;

  overflow:hidden;

  touch-action:none;

  background:#76a65b;

  cursor:grab;

  z-index:100;
}

#world.dragging{
  cursor:grabbing;
}

#worldContent{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  transform-origin:0 0;

  will-change:transform;
}


/* =========================================================
   MAP GROUND
========================================================= */

.ground{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      #79aa5e 0%,
      #6f9f55 55%,
      #69964f 100%
    );
}

.bottomGrass{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:9%;

  background:
    linear-gradient(
      180deg,
      #6b9d50,
      #5d8d46
    );

  border-top:3px solid rgba(43,76,37,.35);
}


/* =========================================================
   DISTRICTS
========================================================= */

.district{
  position:absolute;
  border-radius:18px;
  pointer-events:none;
}

.playerDistrict{
  left:1%;
  top:1%;
  width:53%;
  height:96%;

  background:
    rgba(128,177,91,.12);
}

.rivalDistrict{
  right:1%;
  top:1%;
  width:41%;
  height:96%;

  background:
    rgba(103,153,83,.1);
}


/* =========================================================
   RIVER
========================================================= */

#river{
  position:absolute;
  left:57%;
  top:0;
  bottom:0;
  width:12%;

  background:
    linear-gradient(
      90deg,
      #347db0,
      #4f9dcb,
      #3276a8
    );

  box-shadow:
    inset 5px 0 0 rgba(255,255,255,.08),
    inset -5px 0 0 rgba(0,0,0,.12);

  z-index:20;
}

.waterLine{
  position:absolute;
  left:7%;
  width:86%;
  height:3px;

  background:rgba(255,255,255,.16);

  border-radius:50%;
}

.waterLine:nth-child(1){top:18%;}
.waterLine:nth-child(2){top:37%;}
.waterLine:nth-child(3){top:58%;}
.waterLine:nth-child(4){top:78%;}


/* =========================================================
   ROADS
========================================================= */

.road{
  position:absolute;

  background:
    #42474a;

  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.05),
    inset 0 -3px 0 rgba(0,0,0,.18);

  z-index:40;
}

.road::after{
  content:"";

  position:absolute;

  left:0;
  right:0;

  top:50%;

  height:3px;

  transform:translateY(-50%);

  background:
    repeating-linear-gradient(
      90deg,
      #e5d99b 0 30px,
      transparent 30px 58px
    );

  opacity:.75;
}

.hRoad{
  left:0;
  right:0;
  height:7%;
}

.h1{top:9%;}
.h2{top:35%;}
.h3{top:61%;}
.h4{top:78%;}

.vRoad{
  top:0;
  bottom:0;
  width:4.2%;
}

.v1{left:16%;}
.v2{left:38%;}
.v3{left:51%;}
.v4{left:76%;}
.v5{left:90%;}


/* =========================================================
   ROAD INTERSECTION PATCHES
========================================================= */

.intersection{
  position:absolute;
  width:4.2%;
  height:7%;

  background:#42474a;

  z-index:42;
}

.i1{left:16%;top:9%;}
.i2{left:38%;top:9%;}
.i3{left:51%;top:9%;}
.i4{left:76%;top:9%;}
.i5{left:90%;top:9%;}

.i6{left:16%;top:35%;}
.i7{left:38%;top:35%;}
.i8{left:51%;top:35%;}
.i9{left:76%;top:35%;}
.i10{left:90%;top:35%;}

.i11{left:16%;top:61%;}
.i12{left:38%;top:61%;}
.i13{left:51%;top:61%;}
.i14{left:76%;top:61%;}
.i15{left:90%;top:61%;}

.i16{left:16%;top:78%;}
.i17{left:38%;top:78%;}
.i18{left:51%;top:78%;}
.i19{left:76%;top:78%;}
.i20{left:90%;top:78%;}


/* =========================================================
   PAVEMENTS
========================================================= */

.pavement{
  position:absolute;

  background:
    #b9b6a5;

  border-top:2px solid rgba(255,255,255,.25);
  border-bottom:2px solid rgba(0,0,0,.15);

  z-index:48;
}

.pH{
  left:0;
  right:0;
  height:2.7%;
}

.pH1{top:17%;}
.pH2{top:43%;}
.pH3{top:69%;}
.pH4{top:86%;}

.pV{
  top:0;
  bottom:0;
  width:1.9%;
}

.pV1{left:12%;}
.pV2{left:33%;}
.pV3{left:47%;}
.pV4{left:85%;}


/* =========================================================
   CROSSINGS
========================================================= */

.crossing{
  position:absolute;
  width:4%;
  height:7%;

  z-index:55;

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.8) 0 5px,
      transparent 5px 10px
    );
}

.cross1{left:15.8%;top:9%;}
.cross2{left:37.8%;top:35%;}
.cross3{left:50.8%;top:61%;}
.cross4{left:75.8%;top:78%;}


/* =========================================================
   BRIDGES
========================================================= */

.bridge{
  position:absolute;
  left:53.5%;
  width:19%;
  height:7%;

  background:
    #706f69;

  z-index:70;

  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.22),
    inset 0 -3px 0 rgba(0,0,0,.2);
}

.bridge1{top:9%;}
.bridge2{top:78%;}

.bridge::after{
  content:"";

  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:3px;

  transform:translateY(-50%);

  background:
    repeating-linear-gradient(
      90deg,
      #e7d993 0 28px,
      transparent 28px 55px
    );
}


/* =========================================================
   GRASS PLOTS
========================================================= */

.plot{
  position:absolute;

  background:
    linear-gradient(
      145deg,
      #87b966,
      #78aa5a
    );

  border:3px solid rgba(48,91,43,.45);

  border-radius:13px;

  box-shadow:
    0 4px 0 rgba(50,76,42,.28),
    inset 0 0 20px rgba(255,255,255,.05);

  z-index:75;
}

.plot::before{
  content:"";

  position:absolute;
  inset:5px;

  border:
    1px dashed rgba(255,255,255,.09);

  border-radius:9px;

  pointer-events:none;
}


/*
   FOUR PLAYER PLOTS
   They sit between the road bands and never
   overlap the road.
*/

.plot1{
  left:4%;
  top:18%;
  width:27%;
  height:15%;
}

.plot2{
  left:21%;
  top:44%;
  width:18%;
  height:15%;
}

.plot3{
  left:3%;
  top:70%;
  width:28%;
  height:7%;
}

.plot4{
  left:23%;
  top:88%;
  width:18%;
  height:7%;
}


/*
   RIVAL PLOTS
*/

.plot5{
  right:4%;
  top:18%;
  width:25%;
  height:15%;
}

.plot6{
  right:6%;
  top:70%;
  width:20%;
  height:8%;
}


/* =========================================================
   BUILDINGS
========================================================= */

.building{
  position:absolute;

  z-index:160;

  border-radius:7px;

  overflow:visible;

  pointer-events:auto;

  cursor:pointer;

  filter:
    drop-shadow(0 4px 3px rgba(0,0,0,.25));
}

.playerBuilding{
  background:
    linear-gradient(
      180deg,
      #e2bd55,
      #c99527
    );

  border:
    3px solid #8c6415;
}

.playerBuilding .roof{
  background:
    #a96f20;
}

.rivalBuilding{
  background:
    linear-gradient(
      180deg,
      #d8dce0,
      #9ba5ad
    );

  border:
    3px solid #5e6870;
}

.rivalBuilding .roof{
  background:
    #28333b;
}

.roof{
  position:absolute;

  left:-3px;
  right:-3px;

  top:-9px;

  height:17px;

  border-radius:7px 7px 3px 3px;

  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.18);
}

.windows{
  position:absolute;

  left:12%;
  right:12%;

  bottom:18%;

  height:25%;

  display:flex;
  gap:6%;

  justify-content:center;
}

.window{
  flex:1;

  max-width:22px;

  background:
    linear-gradient(
      180deg,
      #aee0ec,
      #4e93ae
    );

  border:
    2px solid rgba(40,60,70,.6);

  border-radius:2px;
}

.door{
  position:absolute;

  left:40%;
  width:20%;

  bottom:0;
  height:34%;

  background:#533c25;

  border-radius:3px 3px 0 0;
}

.awning{
  position:absolute;

  left:20%;
  right:20%;

  bottom:39%;

  height:11%;

  background:
    repeating-linear-gradient(
      90deg,
      #f4e5a4 0 10px,
      #c64d32 10px 20px
    );

  border-radius:3px;
}

.sign{
  position:absolute;

  left:50%;

  top:-29px;

  transform:translateX(-50%);

  white-space:nowrap;

  padding:4px 9px;

  background:#f3c84b;

  color:#382500;

  border:
    2px solid #8e6410;

  border-radius:6px;

  font-size:11px;

  font-weight:900;

  box-shadow:
    0 3px 4px rgba(0,0,0,.3);

  z-index:500;
}

.levelBadge{
  position:absolute;

  right:-7px;
  top:-7px;

  min-width:22px;
  height:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#263238;

  color:white;

  font-size:10px;
  font-weight:900;

  border:2px solid white;
}


/* =========================================================
   PLAYER SHOP POSITIONS
========================================================= */

#shop1{
  left:7%;
  top:20%;
  width:7%;
  height:10%;
}

#shop2{
  left:25%;
  top:46%;
  width:7%;
  height:10%;
}

#shop3{
  left:6%;
  top:71%;
  width:9%;
  height:5%;
}

#shop4{
  left:26%;
  top:89%;
  width:7%;
  height:5%;
}


/* =========================================================
   KING'S MART HQ
========================================================= */

#kingsHQ{
  left:80%;
  top:20%;
  width:16%;
  height:14%;

  position:absolute;

  z-index:165;

  background:
    linear-gradient(
      180deg,
      #e8edf1,
      #9da8b0
    );

  border:
    4px solid #4e5b64;

  border-radius:10px;

  pointer-events:auto;

  cursor:pointer;

  box-shadow:
    0 7px 8px rgba(0,0,0,.3);
}

#kingsHQ .roof{
  height:25px;
  top:-14px;

  background:
    linear-gradient(
      180deg,
      #26343d,
      #121b20
    );
}

#kingsHQ .sign{
  background:#c9322f;
  color:white;
  border-color:#7e1b1b;

  font-size:13px;
}

#kingsHQ .windows{
  bottom:28%;
  height:24%;
}

#kingsHQ .door{
  background:#26343a;
}

#kingsExpress{
  left:80%;
  top:71%;
  width:12%;
  height:8%;

  position:absolute;

  z-index:165;

  background:
    linear-gradient(
      180deg,
      #dce2e6,
      #929da4
    );

  border:
    3px solid #59646b;

  border-radius:8px;

  pointer-events:auto;

  cursor:pointer;
}

#kingsExpress .roof{
  background:#252f35;
}

#kingsExpress .sign{
  background:#cf3834;
  color:white;
  border-color:#7f1e1c;
}


/* =========================================================
   RIVAL CUSTOMER COUNTER
========================================================= */

#rivalCounter{
  position:absolute;

  left:81%;
  top:35%;

  z-index:500;

  padding:6px 10px;

  background:
    rgba(104,19,18,.92);

  border:
    2px solid #ef6b67;

  border-radius:8px;

  font-size:11px;

  font-weight:900;

  box-shadow:
    0 3px 7px rgba(0,0,0,.3);
}


/* =========================================================
   ROUNDABOUT
========================================================= */

#roundabout{
  position:absolute;

  left:29%;
  top:47%;

  width:185px;
  height:185px;

  z-index:90;

  border-radius:50%;

  background:
    #4b5052;

  border:
    10px solid #b8b5a6;

  box-shadow:
    0 4px 8px rgba(0,0,0,.3);
}

.roundIsland{
  position:absolute;

  left:50%;
  top:50%;

  width:68px;
  height:68px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #7eb35d,
      #5c9446
    );

  border:
    5px solid #a8a48e;
}

.roundArrow{
  position:absolute;

  color:#e8dfb0;

  font-size:25px;
  font-weight:900;
}

.arrow1{
  left:50%;
  top:4px;
  transform:translateX(-50%);
}

.arrow2{
  right:5px;
  top:50%;
  transform:translateY(-50%);
}

.arrow3{
  left:50%;
  bottom:4px;
  transform:translateX(-50%);
}

.arrow4{
  left:5px;
  top:50%;
  transform:translateY(-50%);
}


/* =========================================================
   TREES / PARK
========================================================= */

.tree{
  position:absolute;

  width:28px;
  height:28px;

  z-index:120;
}

.tree::before{
  content:"";

  position:absolute;

  left:7px;
  top:9px;

  width:14px;
  height:17px;

  background:#72502e;

  border-radius:3px;
}

.tree::after{
  content:"";

  position:absolute;

  left:0;
  top:0;

  width:28px;
  height:25px;

  background:
    linear-gradient(
      145deg,
      #5f944a,
      #3f7239
    );

  clip-path:
    polygon(
      50% 0,
      100% 75%,
      75% 75%,
      88% 100%,
      12% 100%,
      25% 75%,
      0 75%
    );
}

.tree1{left:44%;top:23%;}
.tree2{left:47%;top:30%;}
.tree3{left:43%;top:73%;}
.tree4{left:48%;top:82%;}
.tree5{left:71%;top:43%;}
.tree6{left:73%;top:52%;}


/* =========================================================
   PARK
========================================================= */

.park{
  position:absolute;

  left:41%;
  top:4%;

  width:10%;
  height:15%;

  border-radius:15px;

  background:
    #75a95a;

  border:
    3px solid #4c813f;

  z-index:75;
}

.park::after{
  content:"PARK";

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  color:rgba(255,255,255,.45);

  font-size:10px;
  font-weight:900;
}


/* =========================================================
   STREET LIGHTS
========================================================= */

.lamp{
  position:absolute;

  width:5px;
  height:30px;

  background:#303437;

  z-index:130;
}

.lamp::before{
  content:"";

  position:absolute;

  left:-5px;
  top:-3px;

  width:15px;
  height:10px;

  border-radius:50%;

  background:#f6e4a1;

  box-shadow:
    0 0 9px rgba(255,226,125,.7);
}

.l1{left:18%;top:27%;}
.l2{left:37%;top:27%;}
.l3{left:18%;top:54%;}
.l4{left:37%;top:80%;}
.l5{left:76%;top:28%;}
.l6{left:90%;top:52%;}
.l7{left:76%;top:76%;}


/* =========================================================
   PARKING
========================================================= */

.parking{
  position:absolute;

  left:44%;
  top:88%;

  width:8%;
  height:7%;

  background:#777974;

  border-radius:8px;

  border:2px solid #595a57;

  z-index:80;
}

.parking::after{
  content:"";

  position:absolute;
  inset:8px;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 17px,
      rgba(255,255,255,.5) 17px 19px
    );
}


/* =========================================================
   CARS
========================================================= */

#carsLayer,
#deliveryLayer,
#peopleLayer{
  position:absolute;
  inset:0;

  z-index:300;

  pointer-events:none;
}

.car{
  position:absolute;

  width:25px;
  height:13px;

  border-radius:5px;

  background:
    #e5e8e8;

  border:
    2px solid #30383c;

  box-shadow:
    0 2px 3px rgba(0,0,0,.3);

  transform-origin:center;
}

.car::before,
.car::after{
  content:"";

  position:absolute;

  width:6px;
  height:5px;

  bottom:-3px;

  background:#202426;

  border-radius:2px;
}

.car::before{left:3px;}
.car::after{right:3px;}

.car.red{
  background:#d94a43;
}

.car.blue{
  background:#4c86c4;
}

.car.yellow{
  background:#e0b83d;
}

.deliveryVan{
  position:absolute;

  width:29px;
  height:15px;

  border-radius:4px;

  background:#f3c747;

  border:2px solid #725611;
}


/* =========================================================
   PEOPLE
========================================================= */

.person{
  position:absolute;

  width:10px;
  height:10px;

  border-radius:50%;

  z-index:400;

  box-shadow:
    0 2px 3px rgba(0,0,0,.3);
}

.person.player{
  background:#f4d5ad;
  border:2px solid #315b91;
}

.person.rival{
  background:#f2cbb0;
  border:2px solid #c63131;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

#bottomBar{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:66px;

  z-index:9000;

  display:flex;
  justify-content:space-around;
  align-items:center;

  background:
    rgba(20,25,23,.97);

  border-top:
    2px solid rgba(255,255,255,.1);

  box-shadow:
    0 -4px 15px rgba(0,0,0,.35);

  padding:5px;
}

.navButton{
  flex:1;

  max-width:115px;

  height:54px;

  margin:0 3px;

  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #343b39,
      #252b29
    );

  color:white;

  border:
    1px solid rgba(255,255,255,.1);

  font-weight:900;
  font-size:11px;

  touch-action:manipulation;
  pointer-events:auto;
}

.navButton:active{
  transform:scale(.96);
  background:#4b554f;
}


/* =========================================================
   PANELS
========================================================= */

#panel{
  position:absolute;

  right:14px;
  top:84px;

  width:min(390px,calc(100% - 28px));

  max-height:

<script>

/* =========================================================
   KING'S MART TYCOON
   FULL CITY VERSION
========================================================= */


const SAVE_KEY =
  "kings_mart_tycoon_city_v12";


let DEBUG_MODE=false;


let game={

  company:"Your Company",

  cash:5000,

  reputation:50,

  marketShare:8,

  customers:42,

  totalStores:1,

  selectedShop:0,

  staff:[],

  properties:[

    {
      name:"Old Corner Shop",
      price:2200,
      bought:false,
      storeIndex:null
    },

    {
      name:"Empty High Street",
      price:3500,
      bought:false,
      storeIndex:null
    },

    {
      name:"Abandoned Supermarket",
      price:4800,
      bought:false,
      storeIndex:null
    },

    {
      name:"Old Warehouse Shop",
      price:6500,
      bought:false,
      storeIndex:null
    }

  ],

  stores:[

    {
      name:"My Mart",

      level:1,

      condition:65,

      baseIncome:12,

      customers:42,

      upgrades:0,

      stock:100,

      maxStock:100,

      renovatingUntil:0,

      openingUntil:0

    }

  ],

  rival:{

    name:"King's Mart",

    customers:220,

    health:100,

    marketShare:32,

    income:95,

    stage:"HEALTHY"

  },

  lastSave:Date.now()

};


/* =========================================================
   STAFF
========================================================= */

game.staff=[

  {

    name:"Adam",

    age:18,

    intelligence:100,

    management:95,

    stocking:65,

    customerService:72,

    problemSolving:100,

    trait:"Natural Manager"

  }

];


/* =========================================================
   SAFE NUMBER
========================================================= */

function num(v,f=0){

  const n=Number(v);

  return Number.isFinite(n)?n:f;

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  game.lastSave=Date.now();

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(game)
  );

}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

  let raw=
    localStorage.getItem(SAVE_KEY);


  /*
   * Migrate older versions.
   */

  if(!raw){

    const oldKeys=[

      "kings_mart_tycoon_city_v11",
      "kings_mart_tycoon_city_v10",
      "kings_mart_tycoon_city_v9",
      "kings_mart_tycoon_city_v8",
      "kings_mart_tycoon_city_v7",
      "kings_mart_tycoon_v5"

    ];


    for(const key of oldKeys){

      const old=
        localStorage.getItem(key);

      if(old){

        raw=old;
        break;

      }

    }

  }


  if(!raw)
    return;


  try{

    const loaded=
      JSON.parse(raw);


    game={
      ...game,
      ...loaded
    };


    if(!Array.isArray(game.stores))
      game.stores=[];


    if(!Array.isArray(game.staff))
      game.staff=[];


    if(!Array.isArray(game.properties))
      game.properties=[];


    /*
     * Make sure Adam exists.
     */

    const adamExists=
      game.staff.some(
        s=>s.name==="Adam"
      );


    if(!adamExists){

      game.staff.unshift({

        name:"Adam",
        age:18,
        intelligence:100,
        management:95,
        stocking:65,
        customerService:72,
        problemSolving:100,
        trait:"Natural Manager"

      });

    }


    /*
     * Make sure at least one store exists.
     */

    if(!game.stores.length){

      game.stores.push({

        name:"My Mart",
        level:1,
        condition:65,
        baseIncome:12,
        customers:42,
        upgrades:0,
        stock:100,
        maxStock:100,
        renovatingUntil:0,
        openingUntil:0

      });

    }


  }catch(e){

    console.warn(
      "Save could not be loaded",
      e
    );

  }

}


/* =========================================================
   OFFLINE INCOME
========================================================= */

function offlineIncome(){

  const previous=
    num(game.lastSave,Date.now());

  const elapsed=
    Math.max(
      0,
      Date.now()-previous
    );


  const capped=
    Math.min(
      elapsed,
      8*60*60*1000
    );


  const seconds=
    capped/1000;


  const income=
    getIncome();


  const earned=
    Math.floor(
      income*seconds
    );


  if(earned>0){

    game.cash+=earned;

    toast(
      "💰 Offline earnings: £"+
      earned.toLocaleString()
    );

  }

}


/* =========================================================
   STAFF BONUS
========================================================= */

function getStaffBonus(){

  let bonus=0;


  for(const person of game.staff){

    bonus +=
      num(person.management)*0.002;

    bonus +=
      num(person.customerService)*0.001;

    bonus +=
      num(person.problemSolving)*0.001;

  }


  return bonus;

}


/* =========================================================
   SHOP INCOME
========================================================= */

function getShopIncome(shop){

  if(!shop)
    return 0;


  const level=
    num(shop.level,1);


  const condition=
    Math.max(
      .2,
      num(shop.condition,50)/100
    );


  const upgrades=
    num(shop.upgrades,0);


  const stockRatio=
    Math.max(
      .25,
      Math.min(
        1,
        num(shop.stock,0)/
        Math.max(
          1,
          num(shop.maxStock,100)
        )
      )
    );


  let income=
    num(shop.baseIncome,10);


  income *=
    1+
    (level-1)*.55;


  income *=
    1+
    upgrades*.15;


  income *=
    condition;


  income *=
    stockRatio;


  income *=
    1+getStaffBonus();


  if(
    shop.renovatingUntil>
    Date.now()
  ){

    income*=.25;

  }


  return Math.max(
    0,
    income
  );

}


/* =========================================================
   TOTAL INCOME
========================================================= */

function getIncome(){

  return game.stores.reduce(
    (total,shop)=>
      total+
      getShopIncome(shop),
    0
  );

}


/* =========================================================
   SHOP STATE
========================================================= */

function computeShopState(shop){

  if(!shop)
    return "CLOSED";


  if(
    shop.renovatingUntil>
    Date.now()
  )
    return "RENOVATING";


  if(
    shop.openingUntil>
    Date.now()
  )
    return "OPENING";


  if(
    num(shop.stock)<
    num(shop.maxStock)*.15
  )
    return "LOW STOCK";


  if(
    num(shop.condition)<30
  )
    return "POOR CONDITION";


  return "OPEN";

}


/* =========================================================
   CUSTOMER UPDATE
========================================================= */

function updateCustomers(){

  let total=0;


  for(const shop of game.stores){

    const condition=
      num(shop.condition,50)/100;


    const stock=
      Math.max(
        .2,
        Math.min(
          1,
          num(shop.stock)/
          Math.max(
            1,
            num(shop.maxStock)
          )
        )
      );


    const level=
      num(shop.level,1);


    const target=
      Math.floor(
        25+
        level*14+
        condition*25+
        stock*20
      );


    if(
      shop.customers<
      target
    ){

      shop.customers=
        Math.min(
          target,
          shop.customers+
          Math.ceil(
            (target-shop.customers)*.04
          )
        );

    }else{

      shop.customers=
        Math.max(
          target,
          shop.customers-
          Math.ceil(
            (shop.customers-target)*.03
          )
        );

    }


    total+=
      Math.floor(
        shop.customers
      );

  }


  game.customers=
    Math.max(
      0,
      total
    );


  game.marketShare=
    Math.min(
      95,
      Math.max(
        1,
        5+
        game.totalStores*2.2+
        game.reputation*.06+
        game.customers*.015
      )
    );

}


/* =========================================================
   STOCK
========================================================= */

function updateStock(){

  for(const shop of game.stores){

    const customers=
      num(shop.customers,0);


    /*
     * Customers use stock.
     */

    shop.stock=
      Math.max(
        0,
        shop.stock-
        customers*.0025
      );

  }

}


/* =========================================================
   RIVAL AI
========================================================= */

function rivalAI(){

  const r=
    game.rival;


  if(r.health>75){

    r.stage="HEALTHY";

  }else if(r.health>55){

    r.stage="UNDER PRESSURE";

  }else if(r.health>35){

    r.stage="STRUGGLING";

  }else if(r.health>15){

    r.stage="DISTRESSED";

  }else{

    r.stage="FOR SALE";

  }


  const maxCustomers=
    Math.max(
      0,
      Math.floor(
        220*
        (r.health/100)
      )
    );


  if(
    r.customers>
    maxCustomers
  ){

    r.customers=
      maxCustomers;

  }


  /*
   * Healthy rival slowly recovers.
   */

  if(
    r.health>60 &&
    Math.random()<.04
  ){

    r.customers=
      Math.min(
        220,
        r.customers+2
      );

  }


  r.marketShare=
    Math.max(
      0,
      32-
      (100-r.health)*.12
    );

}


/* =========================================================
   GAME TICK
========================================================= */

let lastEconomy=
  Date.now();


function economyTick(){

  const now=
    Date.now();


  const seconds=
    (now-lastEconomy)/1000;


  lastEconomy=
    now;


  if(seconds<=0)
    return;


  game.cash +=
    getIncome()*
    seconds;


  updateCustomers();

  updateStock();

  rivalAI();


  renderHUD();

}

========================================================= */

function renderBuildings(){

  const slots=[
    "shop1",
    "shop2",
    "shop3",
    "shop4"
  ];


  slots.forEach(
    (id,index)=>{

      const el=
        document.getElementById(id);


      if(!el)
        return;


      const shop=
        game.stores[index];


      if(shop){

        el.style.display=
          "block";


        const sign=
          el.querySelector(
            ".sign"
          );


        const badge=
          el.querySelector(
            ".levelBadge"
          );


        if(sign)
          sign.textContent=
            shop.name;


        if(badge)
          badge.textContent=
            "L"+
            shop.level;


        el.style.opacity=
          "1";


      }else{

        const property=
          game.properties.find(
            p=>
              p.storeIndex===
              index
          );


        /*
         * Available / abandoned property.
         */

        if(property){

          const sign=
            el.querySelector(
              ".sign"
            );


          const badge=
            el.querySelector(
              ".levelBadge"
            );


          if(property.bought){

            if(sign)
              sign.textContent=
                property.name;

            if(badge)
              badge.textContent=
                "L1";

            el.style.background=
              "linear-gradient(180deg,#e2bd55,#c99527)";

          }else{

            if(sign)
              sign.textContent=
                "£"+
                property.price.toLocaleString();

            if(badge)
              badge.textContent=
                "BUY";

            el.style.background=
              "linear-gradient(180deg,#8d8d75,#666858)";

          }

        }

      }

    }
  );

}


/* =========================================================

========================================================= */

function selectShop(index,event){

  if(event){

    event.stopPropagation();

  }


  game.selectedShop=
    index;


  const shop=
    game.stores[index];


  /*
   * Existing shop.
   */

  if(shop){

    openShop(index);

    return;

  }


  /*
   * Property associated with this building.
   */

  const property=
    game.properties.find(
      p=>
        p.storeIndex===
        index
    );


  /*
   * If a property has not been assigned
   * to this visible slot, find the first
   * unused property.
   */

  if(!property){

    const available=
      game.properties.find(
        p=>
          !p.bought &&
          p.storeIndex===null
      );


    if(available){

      available.storeIndex=
        index;

    }

  }


  const assigned=
    game.properties.find(
      p=>
        p.storeIndex===
        index
    );


  if(!assigned)
    return;


  openProperty(assigned,index);

}

/* =========================================================

========================================================= */

function buyProperty(propertyIndex,shopIndex){

  const property=
    game.properties[propertyIndex];


  if(!property)
    return;


  if(property.bought){

    toast(
      "You already own this property."
    );

    return;

  }


  if(
    game.cash<
    property.price
  ){

    toast(
      "❌ You need £"+
      (
        property.price-
        game.cash
      ).toFixed(0)
    );

    return;

  }


  game.cash-=
    property.price;


  property.bought=true;

  property.storeIndex=
    shopIndex;


  const names=[
    "High Street Mart",
    "City Mart",
    "Fresh Mart",
    "Warehouse Mart"
  ];


  const newShop={

    name:
      names[
        Math.floor(
          Math.random()*
          names.length
        )
      ],

    level:1,

    condition:40,

    baseIncome:15,

    customers:15,

    upgrades:0,

    stock:100,

    maxStock:100,

    renovatingUntil:0,

    openingUntil:
      Date.now()+
      10000

  };


  game.stores[shopIndex]=
    newShop;


  game.totalStores++;


  game.reputation=
    Math.min(
      100,
      game.reputation+2
    );


  saveGame();

  renderHUD();

  closePanel();


  toast(
    "🏗️ "+property.name+
    " is now your shop!"
  );

}


/* =========================================================
   UPGRADE SHOP
========================================================= */

function upgradeShop(index){

  const shop=
    game.stores[index];


  if(!shop)
    return;


  const cost=
    1000+
    shop.level*850+
    shop.upgrades*700;


  if(game.cash<cost){

    toast(
      "❌ Not enough cash."
    );

    return;

  }


  game.cash-=cost;


  shop.level++;

  shop.upgrades++;

  shop.maxStock+=25;

  shop.stock=
    Math.min(
      shop.maxStock,
      shop.stock+25
    );


  shop.condition=
    Math.min(
      100,
      shop.condition+8
    );


  shop.customers+=8;


  game.reputation=
    Math.min(
      100,
      game.reputation+1
    );


  saveGame();

  renderHUD();

  openShop(index);


  toast(
    "⬆️ "+shop.name+
    " upgraded to Level "+
    shop.level+"!"
  );

}

/* =========================================================
   ATTACK RIVAL
========================================================= */

function attackRival(){

  const cost=750;


  if(game.cash<cost){

    toast(
      "❌ You need £750."
    );

    return;

  }


  game.cash-=cost;


  const loss=
    Math.floor(
      10+
      Math.random()*9
    );


  /*
   * This is the important customer change:
   * King's Mart physically loses customers.
   */

  game.rival.customers=
    Math.max(
      0,
      game.rival.customers-loss
    );


  game.rival.health=
    Math.max(
      0,
      game.rival.health-7
    );


  game.marketShare=
    Math.min(
      95,
      game.marketShare+.45
    );


  game.rival.marketShare=
    Math.max(
      0,
      game.rival.marketShare-.55
    );


  game.customers+=
    Math.floor(
      loss*.7
    );


  game.reputation=
    Math.min(
      100,
      game.reputation+1
    );


  rivalAI();


  createRivalPeople();


  saveGame();

  renderHUD();


  toast(
    "⚔️ King's Mart lost "+
    loss+
    " customers!"
  );


  openRival();

}

   BUY RIVAL
========================================================= */

function buyRival(){

  if(game.rival.stage!=="FOR SALE"){

    toast(
      "King's Mart isn't for sale yet."
    );

    return;

  }


  if(game.cash<9000){

    toast(
      "❌ You need £9
