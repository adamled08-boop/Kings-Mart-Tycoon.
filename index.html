<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>King's Mart Tycoon</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#101820;
  color:#fff;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

/* =========================================================
   GAME
========================================================= */

#game{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#101820;
}

/* =========================================================
   TOP HUD
========================================================= */

#topBar{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 12px;
  background:linear-gradient(#263640,#172128);
  border-bottom:2px solid #53656e;
  z-index:1000;
  overflow:hidden;
}

.logo{
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#f6ca43,#c48b19);
  color:#3d2a06;
  font-size:25px;
  box-shadow:inset 0 2px #fff8,0 3px 8px #0008;
  user-select:none;
}

.companyTitle{
  min-width:100px;
  max-width:180px;
  overflow:hidden;
}

.companyTitle b{
  display:block;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.companyTitle small{
  color:#9eafb7;
  font-size:9px;
}

.stats{
  margin-left:auto;
  display:flex;
  gap:7px;
  align-items:center;
}

.stat{
  min-width:74px;
  padding:5px 8px;
  border-radius:8px;
  background:#111a1f;
  border:1px solid #42545e;
  text-align:center;
  box-shadow:inset 0 1px #fff1;
}

.stat span{
  display:block;
  color:#91a5ae;
  font-size:8px;
  text-transform:uppercase;
}

.stat strong{
  display:block;
  margin-top:2px;
  font-size:12px;
}

/* =========================================================
   WORLD / CAMERA
========================================================= */

#world{
  position:relative;
  flex:1;
  overflow:hidden;
  background:#76a95b;
  isolation:isolate;

  /* Clash-style touch movement */
  touch-action:none;
  user-select:none;
  cursor:grab;
}

#world.dragging{
  cursor:grabbing;
}

#worldContent{
  position:absolute;
  left:0;
  top:0;

  /*
    The world is deliberately larger than the screen.
    This allows proper panning and zooming.
  */
  width:1600px;
  height:1200px;

  transform-origin:0 0;
  will-change:transform;
}

#world::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5000;
}

/* =========================================================
   DISTRICTS
========================================================= */

.district{
  position:absolute;
  border-radius:20px;
  opacity:.55;
  z-index:2;
}

.district.one{
  left:0;
  top:0;
  width:53%;
  height:52%;
  background:#83b967;
}

.district.two{
  left:0;
  top:52%;
  width:53%;
  height:48%;
  background:#72a95b;
}

.district.three{
  left:69%;
  top:0;
  width:31%;
  height:52%;
  background:#7eae61;
}

.district.four{
  left:69%;
  top:52%;
  width:31%;
  height:48%;
  background:#6fa256;
}

.zoneLabel{
  position:absolute;
  z-index:15;
  padding:5px 9px;
  border-radius:8px;
  background:#172027aa;
  border:1px solid #ffffff22;
  font-size:8px;
  font-weight:bold;
  letter-spacing:1px;
  pointer-events:none;
}

.playerZone{
  left:3%;
  top:2%;
}

.rivalZone{
  right:3%;
  top:2%;
}

/* =========================================================
   REALISTIC FLOWING RIVER
========================================================= */

#river{
  position:absolute;
  z-index:20;
  left:57%;
  top:0;
  width:12%;
  height:100%;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #3b83aa,
      #4f9fc0 28%,
      #438daf 52%,
      #5aa7c4 76%,
      #3b83aa
    );

  border-left:5px solid #80b5c8;
  border-right:5px solid #80b5c8;

  box-shadow:
    inset 10px 0 18px #174c6c55,
    inset -10px 0 18px #174c6c55;
}

/* moving water layer */
#river::before{
  content:"";
  position:absolute;
  inset:-100px 0;

  background:
    repeating-linear-gradient(
      -12deg,
      transparent 0 25px,
      #ffffff25 25px 29px,
      transparent 29px 48px,
      #164f6d18 48px 53px,
      transparent 53px 78px
    );

  animation:riverFlow 4s linear infinite;
}

#river::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at 30% 15%,
      #ffffff35 0 2px,
      transparent 3px
    ),
    radial-gradient(
      ellipse at 65% 40%,
      #ffffff25 0 2px,
      transparent 3px
    ),
    radial-gradient(
      ellipse at 40% 70%,
      #ffffff30 0 2px,
      transparent 3px
    );

  background-size:
    50px 95px,
    70px 110px,
    65px 125px;

  animation:
    waterSparkle 3s ease-in-out infinite alternate;
}

@keyframes riverFlow{
  from{
    transform:translateY(-30px);
  }
  to{
    transform:translateY(30px);
  }
}

@keyframes waterSparkle{
  from{
    opacity:.35;
  }
  to{
    opacity:.8;
  }
}

/* =========================================================
   ROADS
========================================================= */

.road{
  position:absolute;
  z-index:30;
  background:#3b4144;
  box-shadow:
    inset 0 2px #555c5f,
    inset 0 -2px #25292b;
}

.road.horizontal{
  left:0;
  width:100%;
  height:7%;
  transform:translateY(-50%);
}

.road.vertical{
  top:0;
  height:100%;
  width:4.5%;
  transform:translateX(-50%);
}

.h1{top:13%;}
.h2{top:38%;}
.h3{top:63%;}
.h4{top:87%;}

.v1{left:18%;}
.v2{left:42%;}
.v3{left:76%;}

.road.horizontal::after{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  height:3px;
  transform:translateY(-50%);

  background:
    repeating-linear-gradient(
      90deg,
      #f1d34d 0 22px,
      transparent 22px 42px
    );
}

.road.vertical::after{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:3px;
  height:100%;
  transform:translateX(-50%);

  background:
    repeating-linear-gradient(
      0deg,
      #f1d34d 0 22px,

}

}

.pavement.horizontal{
  left:0;
  width:100%;
  height:2.5%;

}

.pavement.vertical{
  top:0;
  height:100%;
  width:1.8%;

}

.ph1{top:17%;}
.ph2{top:42%;}

}

.person::before{

  left:1px;

  height:7px;
  border-radius:50%;
  background:#ffd0aa;
  border:1px solid #7c4c36;
}

.person.red{
  background:#d83434;

}

.person.red::before{

}

.car::before,

  height:7px;
  background:#91cfe4;
  border:1px solid #42565e;

<script>

/* =========================================================
   GAME STATE
========================================================= */

const SAVE_KEY =
  "kings_mart_tycoon_city_v13";

let DEBUG_MODE=false;

let game={

  company:"Your Company",

  cash:5000,

  reputation:50,

  marketShare:8,

  customers:42,

  totalStores:1,

  selectedShop:0,

  staff:[],

  properties:[

    {
      name:"Old Corner Shop",
      price:2200,
      bought:false,
      storeIndex:null
    },

    {
      name:"Empty High Street",
      price:3500,
      bought:false,
      storeIndex:null
    },

    {
      name:"Abandoned Supermarket",
      price:4800,
      bought:false,
      storeIndex:null
    }

  ],

  stores:[

    {
      name:"My Mart",
      level:1,
      condition:65,
      baseIncome:12,
      customers:42,
      upgrades:0,
      stock:100,
      maxStock:100,
      renovatingUntil:0,
      openingUntil:0
    }

  ],

  rival:{

    name:"King's Mart",

    customers:220,

    health:100,

    marketShare:32,

    income:95,

    stage:"HEALTHY"

  },

  lastSave:Date.now()

};

/* =========================================================
   ADAM
========================================================= */

const ADAM={

  name:"Adam",

  age:18,

  intelligence:100,

  management:95,

  stocking:65,

  customerService:72,

  problemSolving:100,

  trait:"Natural Manager",

  salary:100000,

  incomeBonus:50

};

/* =========================================================
   LOAD
========================================================= */

function loadGame(){

  let old=null;

  const keys=[

    SAVE_KEY,

    "kings_mart_tycoon_city_v12_layout",

    "kings_mart_tycoon_city_v11",

    "kings_mart_tycoon_city_v10",

    "kings_mart_tycoon_city_v9",

    "kings_mart_tycoon_city_v8",

    "kings_mart_tycoon_city_v7",

    "kings_mart_tycoon_v5"

  ];

  for(const key of keys){

    try{

      const data=
        JSON.parse(
          localStorage.getItem(key)
        );

      if(data){

        old=data;
        break;

      }

    }catch(e){}

  }

  if(old){

    game={
      ...game,
      ...old,
      rival:{
        ...game.rival,
        ...(old.rival||{})
      }
    };

  }

  if(!Array.isArray(game.stores))
    game.stores=[];

  if(!Array.isArray(game.properties))
    game.properties=[];

  if(!Array.isArray(game.staff))
    game.staff=[];

  if(!game.stores.length){

    game.stores.push({

      name:"My Mart",

      level:1,

      condition:65,

      baseIncome:12,

      customers:42,

      upgrades:0,

      stock:100,

      maxStock:100,

      renovatingUntil:0,

      openingUntil:0

    });

  }

  /* Ensure Adam gets the new values
     if an old save already contained him. */

  game.staff.forEach(person=>{

    if(person.name==="Adam"){

      person.salary=100000;
      person.incomeBonus=50;

    }

  });

}

/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  game.lastSave=Date.now();

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(game)
    );

  }catch(e){}

}

/* =========================================================
   OFFLINE INCOME
========================================================= */

function offlineIncome(){

  const now=Date.now();

  const elapsed=Math.min(

    28800,

    Math.max(
      0,
      (now-game.lastSave)/1000
    )

  );

  if(elapsed<5)
    return;

  const amount=
    Math.floor(
      getIncome()*elapsed
    );

  if(amount>0){

    game.cash+=amount;

    setTimeout(
      ()=>{
        toast(
          "💰 Offline earnings: £"+
          amount.toLocaleString()
        );
      },
      500
    );

  }

}

/* =========================================================
   STAFF BONUS
========================================================= */

function getStaffBonus(){

  let incomeBonus=0;
  let customerBonus=0;
  let stockBonus=0;
  let flatIncome=0;

  game.staff.forEach(person=>{

    incomeBonus+=
      (person.management||0)*
      0.00035;

    incomeBonus+=
      (person.problemSolving||0)*
      0.00015;

    customerBonus+=
      (person.intelligence||0)*
      0.00008;

    customerBonus+=
      (person.customerService||0)*
      0.00006;

    stockBonus+=
      (person.stocking||0)*
      0.0003;

    /*
      Adam's special bonus:
      +£50 every second.
    */

    flatIncome+=
      person.incomeBonus||0;

  });

  return{

    incomeBonus,

    customerBonus,

    stockBonus,

    flatIncome

  };

}

/* =========================================================
   ECONOMY
========================================================= */

function getShopIncome(shop){

  let income=

    shop.baseIncome+

    ((shop.level-1)*10)+

    ((shop.upgrades||0)*8);

  const stock=
    Math.max(
      0,
      Math.min(
        1,
        (shop.stock||0)/100
      )
    );

  const stockMultiplier=
    0.5+
    stock*0.5;

  const condition=
    0.7+
    Math.max(
      0,
      Math.min(
        1,
        shop.condition/100
      )
    )*0.3;

  return income*
    stockMultiplier*
    condition;

}

function getIncome(){

  let total=0;

  game.stores.forEach(
    shop=>{
      total+=
        getShopIncome(shop);
    }
  );

  const staff=
    getStaffBonus();

  total*=
    1+
    staff.incomeBonus;

  /* Adam and any future specialist
     staff bonuses are added here. */

  total+=
    staff.flatIncome;

  return total;

}

function computeShopState(shop){

  const now=Date.now();

  if(
    shop.renovatingUntil&&
    now<shop.renovatingUntil
  )
    return"RENOVATING";

  if(
    shop.openingUntil&&
    now<shop.openingUntil
  )
    return"OPENING";

  if(
    (shop.stock||0)<=0
  )
    return"CLOSED";

  if(
    (shop.stock||0)<20
  )
    return"LOW_STOCK";

  if(
    shop.customers>60
  )
    return"BUSY";

  return"OPEN";

}

function updateCustomers(seconds){

  const staff=
    getStaffBonus();

  game.stores.forEach(shop=>{

    const stock=
      Math.min(
        1,
        Math.max(
          0,
          (shop.stock||0)/100
        )
      );

    const condition=
      Math.min(
        1,
        Math.max(
          0,
          shop.condition/100
        )
      );

    let growth=

      (
        0.012+
        staff.customerBonus+
        stock*0.007+
        condition*0.006
      )*
      seconds;

    shop.customers+=growth;

    if(shop.stock<10){

      shop.customers=
        Math.max(
          5,
          shop.customers-
          0.01*seconds
        );

    }

  });

  game.customers=
    game.stores.reduce(
      (sum,shop)=>
        sum+shop.customers,
      0
    );

}

let deliveryTimer=0;

function updateStock(seconds){

  const staff=
    getStaffBonus();

  game.stores.forEach(shop=>{

    const consumption=

      shop.customers*
      0.0022*
      seconds*
      (
        1-
        Math.min(
          0.4,
          staff.stockBonus
        )
      );

    shop.stock=
      Math.max(
        0,
        shop.stock-consumption
      );

  });

  deliveryTimer+=seconds;

  if(deliveryTimer>=45){

    deliveryTimer=0;

    game.stores.forEach(
      (shop,idx)=>{

        shop.stock=
          Math.min(
            shop.maxStock||100,
            (shop.stock||0)+35
          );

        spawnDeliveryForStore(
          idx
        );

      }
    );

    toast(
      "🚚 Your deliveries have arrived!"
    );

  }

}

    game.rival.health>0

    game.rival.health=

        0,
        game.rival.health-

  if(
    game.rival.health>50&&
    game.rival.customers<220
  ){

    game.rival.customers=
      Math.min(
        220,
        game.rival.customers+
        0.008*seconds
      );

  }

  rivalAI();

}

function rivalAI(){

  const health=
    game.rival.health;

  if(health>75)
    game.rival.stage="HEALTHY";

  else if(health>50)
    game.rival.stage="UNDER PRESSURE";

  else if(health>30)
    game.rival.stage="STRUGGLING";

  else if(health>10)
    game.rival.stage="DISTRESSED";

  else
    game.rival.stage="FOR SALE";

  const maximum=
    Math.floor(
      220*
      health/
      100
    );

  game.rival.customers=
    Math.min(
      game.rival.customers,
      maximum
    );

  if(game.rival.health<=0){

    game.rival.customers=0;

    game.rival.stage="FOR SALE";

  }

}

function buildAdjacency(
  edges,
  directedEdges
){

  const adj={};

  function add(a,b){

    if(!adj[a])
      adj[a]=[];

    adj[a].push(b);

  }

  (edges||[]).forEach(
    ([a,b])=>{

      add(a,b);
      add(b,a);

    }
  );

  (directedEdges||[]).forEach(
    ([a,b])=>{
      add(a,b);
    }
  );

  return adj;

}

function bfsPath(
  adj,
  start,
  goal
){

  if(start===goal)
    return[start];

  const visited=
    new Set([start]);

  const queue=[
    [start]
  ];

  while(queue.length){

    const path=
      queue.shift();

    const node=
      path[path.length-1];

    const neighbors=
      adj[node]||[];

    for(const n of neighbors){

      if(visited.has(n))
        continue;

      const newPath=
        path.concat([n]);

      if(n===goal)
        return newPath;

      visited.add(n);

      queue.push(newPath);

    }

  }

  return null;

}

        KINGS_EXPRESS.bx+
        KINGS_EXPRESS.bw,

      top:KINGS_EXPRESS.by,

      bottom:
        KINGS_EXPRESS.by+
        KINGS_EXPRESS.bh

    });

    this.buildingRects=
      rects;

  },

  isBuildingBlocked(
    x,
    y,
    pad
  ){

    pad=
      pad||0.6;

    return this.buildingRects.some(
      r=>

        x>
        r.left-pad&&

        x<
        r.right+pad&&

        y>
        r.top-pad&&

        y<
        r.bottom+pad

    );

  },

  isRiverBlocked(x,y){

    return(
      x>56.5&&
      x<69.5
    );

  },

  isPedestrianBlocked(
    x,
    y
  ){

    return(

      this.isBuildingBlocked(
        x,
        y,
        0.3
      )||

      this.isRiverBlocked(
        x,
        y
      )

    );

  },

  isVehicleBlocked(
    x,
    y
  ){

    return this.isBuildingBlocked(
      x,
      y,
      1
    );

  }

};

}

function pedestrianSeparate(p){

  let ox=0;
  let oy=0;

  people.forEach(
    other=>{

      if(
        other===p||
        other.kind!==p.kind
      )
        return;

      const dx=
        p.x-other.x;

      const dy=
        p.y-other.y;

      const d=
        Math.hypot(
          dx,
          dy
        );

      if(
        d>0.0001&&
        d<1.1
      ){

        ox+=
          dx/d*
          (1.1-d);

        oy+=
          dy/d*
          (1.1-d);

      }

    }
  );

  return{
    ox,
    oy
  };

}

function updatePedestrians(dt){

  people.forEach(
    p=>{

      if(
        !p.waypoints.length
      ){

        const route=
          newPersonRoute(
            p.kind,
            p.currentNodeId
          );

        if(route){

          p.waypoints=
            route.path.slice(1);

        }

        return;

      }

      const target=
        p.waypoints[0];

      const dx=
        target.x-p.x;

      const dy=
        target.y-p.y;

      const dist=
        Math.hypot(
          dx,
          dy
        );

      const sep=
        pedestrianSeparate(p);

      const move=
        Math.min(
          p.speed*dt,
          dist
        );

      if(dist>0.001){

        const nx=
          p.x+
          (dx/dist)*move+
          sep.ox*dt;

        const ny=
          p.y+
          (dy/dist)*move+
          sep.oy*dt;

        if(
          !CollisionManager
            .isPedestrianBlocked(
              nx,
              ny
            )
        ){

          p.x=nx;
          p.y=ny;

        }

      }

      if(
        dist<=move+0.05
      ){

        p.currentNodeId=
          target.id||
          p.currentNodeId;

        p.waypoints.shift();

      }

    }
  );

}

    cars.push({

      el,

      x:start.x,

      y:start.y,

      currentNodeId:startId,

      waypoints:
        route
        ?route.slice(1)
        :[],

      speed:0,

      maxSpeed:
        7+
        Math.random()*6,

      angle:0

    });

  }

}

function carAheadTooClose(car){

  const target=
    car.waypoints[0];

  if(!target)
    return false;

  const dirx=
    target.x-car.x;

  const diry=
    target.y-car.y;

  const dirLen=
    Math.hypot(
      dirx,
      diry
    )||1;

  const ndx=
    dirx/dirLen;

  const ndy=
    diry/dirLen;

  for(
    const other of cars
  ){

    if(other===car)
      continue;

    const dx=
      other.x-car.x;

    const dy=
      other.y-car.y;

    const dist=
      Math.hypot(
        dx,
        dy
      );

    if(
      dist>6||
      dist<0.0001
    )
      continue;

    const dot=
      (dx/dist)*ndx+
      (dy/dist)*ndy;

    if(
      dot>0.6&&
      dist<4.2
    )
      return true;

  }

  return false;

}

function updateCars(dt){

  cars.forEach(
    car=>{

      if(!car.waypoints.length){

        const route=
          newCarRoute(
            car.currentNodeId
          );

        if(route)
          car.waypoints=
            route.slice(1);

        return;

      }

      const target=
        car.waypoints[0];

      let desired=
        car.maxSpeed;

      if(
        carAheadTooClose(car)
      )
        desired=0;

      car.speed+=
        (
          desired-
          car.speed
        )*
        Math.min(
          1,
          dt*3
        );

      const dx=
        target.x-car.x;

      const dy=
        target.y-car.y;

      const dist=
        Math.hypot(
          dx,
          dy
        );

      const move=
        Math.min(
          car.speed*dt,
          dist
        );

      if(dist>0.001){

        const nx=
          car.x+
          (dx/dist)*move;

        const ny=
          car.y+
          (dy/dist)*move;

        if(
          !CollisionManager
            .isVehicleBlocked(
              nx,
              ny
            )
        ){

          car.x=nx;
          car.y=ny;

          car.angle=
            Math.atan2(
              dy,
              dx
            )*
            180/
            Math.PI;

        }else{

          car.speed=0;

        }

      }

      if(
        dist<=move+0.05
      ){

        car.currentNodeId=
          target.id;

        car.waypoints.shift();

      }

    }
  );

}

function renderCars(){

  cars.forEach(
    car=>{

      car.el.style.left=
        car.x+"%";

      car.el.style.top=
        car.y+"%";

      car.el.style.transform=
        "translate(-50%,-50%) rotate("+
        car.angle+
        "deg)";

    }
  );

}

let deliveryVans=[];

function spawnDeliveryForStore(
  storeIndex
){

  const slotIndex=
    SLOTS.findIndex(
      (slot,i)=>
        storeIndexForSlot(i)===
        storeIndex
    );

  if(slotIndex===-1)
    return;

  const slot=
    SLOTS[slotIndex];

  const path=
    findVehiclePath(
      "W_L38",
      slot.roadNode
    );

  if(!path)
    return;

  const layer=
    document.getElementById(
      "deliveryLayer"
    );

  const el=
    document.createElement(
      "div"
    );

  el.className=
    "deliveryVan";

  layer.appendChild(el);

  deliveryVans.push({

    el,

    x:path[0].x,

    y:path[0].y,

    waypoints:
      path.slice(1),

    speed:10

  });

}

function findVehiclePath(
  startId,
  goalId
){

  const path=
    bfsPath(
      VEHICLE_ADJ,
      startId,
      goalId
    );

  if(!path)
    return null;

  return path.map(
    id=>({
      id,
      x:ROAD_NODES[id].x,
      y:ROAD_NODES[id].y
    })
  );

}

function updateDeliveries(dt){

  deliveryVans=
    deliveryVans.filter(
      van=>{

        if(
          !van.waypoints.length
        ){

          van.el.remove();

          return false;

        }

        const target=
          van.waypoints[0];

        const dx=
          target.x-van.x;

        const dy=
          target.y-van.y;

        const dist=
          Math.hypot(
            dx,
            dy
          );

        const move=
          Math.min(
            van.speed*dt,
            dist
          );

        if(dist>0.001){

          van.x+=
            (dx/dist)*move;

          van.y+=
            (dy/dist)*move;

        }

        if(
          dist<=move+0.05
        ){

          van.waypoints.shift();

        }

        van.el.style.left=
          van.x+"%";

        van.el.style.top=
          van.y+"%";

        return true;

      }
    );

}

function storeIndexForSlot(
  slotIndex
){

  if(slotIndex===0)
    return 0;

  const property=
    game.properties[
      slotIndex-1
    ];

  if(
    property&&
    property.bought
  )
    return property.storeIndex;

  return null;

}

/* =========================================================
   CAMERA
   CLASH OF CLANS STYLE
========================================================= */

const camera={

  x:0,

  y:0,

  zoom:1,

  minZoom:1,

  maxZoom:2.5

};

let cameraStart=null;

let pinchStart=null;

let movedDuringGesture=false;

let suppressWorldClick=false;

function getWorldSize(){

  const world=
    document.getElementById(
      "world"
    );

  return{

    width:
      world.clientWidth,

    height:
      world.clientHeight

  };

}

function clampCamera(){

  const size=
    getWorldSize();

  const content=
    document.getElementById(
      "worldContent"
    );

  const width=
    content.offsetWidth*
    camera.zoom;

  const height=
    content.offsetHeight*
    camera.zoom;

  /*
    Allow the player to move around the entire
    city but never drag the map completely away.
  */

  const maxX=
    Math.max(
      0,
      width-size.width
    );

  const maxY=
    Math.max(
      0,
      height-size.height
    );

  camera.x=
    Math.min(
      maxX,
      Math.max(
        0,
        camera.x
      )
    );

  camera.y=
    Math.min(
      maxY,
      Math.max(
        0,
        camera.y
      )
    );

}

function applyCamera(){

  clampCamera();

  const content=
    document.getElementById(
      "worldContent"
    );

  content.style.transform=
    "translate("+
    (-camera.x)+
    "px,"+
    (-camera.y)+
    "px) scale("+
    camera.zoom+
    ")";

}

function zoomAt(
  newZoom,
  screenX,
  screenY
){

  const oldZoom=
    camera.zoom;

  newZoom=
    Math.max(
      camera.minZoom,
      Math.min(
        camera.maxZoom,
        newZoom
      )
    );

  if(
    newZoom===
    oldZoom
  )
    return;

  /*
    Keep the point under the user's finger
    in the same place while zooming.
  */

  const worldX=
    (
      camera.x+
      screenX
    )/
    oldZoom;

  const worldY=
    (
      camera.y+
      screenY
    )/
    oldZoom;

  camera.zoom=
    newZoom;

  camera.x=
    worldX*
    newZoom-
    screenX;

  camera.y=
    worldY*
    newZoom-
    screenY;

  applyCamera();

}

function zoomIn(){

  const world=
    document.getElementById(
      "world"
    );

  zoomAt(
    camera.zoom+0.2,
    world.clientWidth/2,
    world.clientHeight/2
  );

}

function zoomOut(){

  const world=
    document.getElementById(
      "world"
    );

  zoomAt(
    camera.zoom-0.2,
    world.clientWidth/2,
    world.clientHeight/2
  );

}

function resetCamera(){

  camera.zoom=1;

  camera.x=0;

  camera.y=0;

  applyCamera();

}

function distanceBetweenTouches(
  a,
  b
){

  return Math.hypot(
    a.clientX-b.clientX,
    a.clientY-b.clientY
  );

}

function midpointTouches(
  a,
  b
){

  return{

    x:
      (a.clientX+b.clientX)/
      2,

    y:
      (a.clientY+b.clientY)/
      2

  };

}

/* =========================================================
   TOUCH CAMERA
========================================================= */

const worldElement=
  document.getElementById(
    "world"
  );

worldElement.addEventListener(
  "touchstart",
  event=>{

    if(
      event.target.closest(
        "button,input,#panel"
      )
    )
      return;

    if(
      event.touches.length===1
    ){

      const t=
        event.touches[0];

      cameraStart={

        x:t.clientX,

        y:t.clientY,

        cameraX:camera.x,

        cameraY:camera.y

      };

      movedDuringGesture=false;

      worldElement.classList.add(
        "dragging"
      );

    }

    else if(
      event.touches.length===2
    ){

      pinchStart={

        distance:
          distanceBetweenTouches(
            event.touches[0],
            event.touches[1]
          ),

        zoom:camera.zoom,

        midpoint:
          midpointTouches(
            event.touches[0],
            event.touches[1]
          ),

        cameraX:camera.x,

        cameraY:camera.y

      };

      cameraStart=null;

      movedDuringGesture=true;

    }

  },
  {passive:true}
);

worldElement.addEventListener(
  "touchmove",
  event=>{

    if(
      event.target.closest(
        "button,input,#panel"
      )
    )
      return;

    if(
      event.touches.length===1&&
      cameraStart
    ){

      const t=
        event.touches[0];

      const dx=
        t.clientX-
        cameraStart.x;

      const dy=
        t.clientY-
        cameraStart.y;

      if(
        Math.abs(dx)>4||
        Math.abs(dy)>4
      ){

        movedDuringGesture=true;

      }

      camera.x=
        cameraStart.cameraX-
        dx;

      camera.y=
        cameraStart.cameraY-
        dy;

      applyCamera();

    }

    else if(
      event.touches.length===2&&
      pinchStart
    ){

      const distance=
        distanceBetweenTouches(
          event.touches[0],
          event.touches[1]
        );

      const ratio=
        distance/
        Math.max(
          1,
          pinchStart.distance
        );

      const newZoom=
        pinchStart.zoom*
        ratio;

      const mid=
        midpointTouches(
          event.touches[0],
          event.touches[1]
        );

      camera.zoom=
        Math.max(
          camera.minZoom,
          Math.min(
            camera.maxZoom,
            newZoom
          )
        );

      const oldZoom=
        pinchStart.zoom;

      camera.x=
        (
          pinchStart.cameraX+
          mid.x
        )/
        oldZoom*
        camera.zoom-
        mid.x;

      camera.y=
        (
          pinchStart.cameraY+
          mid.y
        )/
        oldZoom*
        camera.zoom-
        mid.y;

      applyCamera();

    }

  },
  {passive:true}
);

worldElement.addEventListener(
  "touchend",
  event=>{

    worldElement.classList.remove(
      "dragging"
    );

    if(
      movedDuringGesture
    ){

      suppressWorldClick=true;

      setTimeout(
        ()=>{
          suppressWorldClick=false;
        },
        100
      );

    }

    cameraStart=null;

    if(
      event.touches.length<2
    )
      pinchStart=null;

  },
  {passive:true}
);

/* =========================================================
   MOUSE CAMERA
========================================================= */

let mouseCamera=null;

worldElement.addEventListener(
  "mousedown",
  event=>{

    if(event.button!==0)
      return;

    if(
      event.target.closest(
        "button,input,#panel"
      )
    )
      return;

    mouseCamera={

      x:event.clientX,

      y:event.clientY,

      cameraX:camera.x,

      cameraY:camera.y

    };

    movedDuringGesture=false;

    worldElement.classList.add(
      "dragging"
    );

  }
);

window.addEventListener(
  "mousemove",
  event=>{

    if(!mouseCamera)
      return;

    const dx=
      event.clientX-
      mouseCamera.x;

    const dy=
      event.clientY-
      mouseCamera.y;

    if(
      Math.abs(dx)>4||
      Math.abs(dy)>4
    )
      movedDuringGesture=true;

    camera.x=
      mouseCamera.cameraX-
      dx;

    camera.y=
      mouseCamera.cameraY-
      dy;

    applyCamera();

  }
);

window.addEventListener(
  "mouseup",
  ()=>{

    if(!mouseCamera)
      return;

    worldElement.classList.remove(
      "dragging"
    );

    if(
      movedDuringGesture
    ){

      suppressWorldClick=true;

      setTimeout(
        ()=>{
          suppressWorldClick=false;
        },
        100
      );

    }

    mouseCamera=null;

  }
);

/* Mouse wheel zoom */

worldElement.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    const rect=
      worldElement.getBoundingClientRect();

    const x=
      event.clientX-
      rect.left;

    const y=
      event.clientY-
      rect.top;

    zoomAt(
      camera.zoom+
      (
        event.deltaY<0
        ?0.12
        :-0.12
      ),
      x,
      y
    );

  },
  {passive:false}
);

/* =========================================================
   DON'T LET DRAGGING OPEN BUILDINGS
========================================================= */

worldElement.addEventListener(
  "click",
  event=>{

    if(suppressWorldClick){

      event.preventDefault();
      event.stopPropagation();

    }

  },
  true
);

/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function toast(message){

  const el=
    document.getElementById(
      "toast"
    );

  el.textContent=
    message;

  el.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer=
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      2800
    );

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

    },
    600
  );

    "👑 Welcome to King's Mart Tycoon!"
  );

/* =========================================================
   MAIN LOOP
========================================================= */

let lastLoop=
  performance.now();

function gameLoop(now){

  const dt=
    Math.min(
      0.25,
      (now-lastLoop)/1000
    );

  lastLoop=now;

  game.cash+=
    getIncome()*dt;

  updateCustomers(dt);

  updateStock(dt);

  updateRival(dt);

  updateCars(dt);

  updatePedestrians(dt);

  updateDeliveries(dt);

  renderCars();

  renderPedestrians();

  renderRival();

  requestAnimationFrame(
    gameLoop
  );

}

========================================================= */

);

setInterval(

  30000
);

  },
  5000
);

setInterval(
  ()=>{
    render();
  },
  1000
);

/* =========================================================
   START GAME
========================================================= */

initGame();

requestAnimationFrame(
  t=>{

    lastLoop=t;

    requestAnimationFrame(
      gameLoop
    );

  }
);
