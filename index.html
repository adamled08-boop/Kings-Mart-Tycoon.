<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>King's Mart Tycoon</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#101820;color:#fff;}
button{font:inherit;border:0;cursor:pointer;}
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#101820;}

/* TOP HUD */
#topBar{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 12px;
  background:linear-gradient(#263640,#172128);
  border-bottom:2px solid #53656e;
  z-index:1000;
  overflow:hidden;
}
.logo{
  width:44px;height:44px;flex-shrink:0;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#f6ca43,#c48b19);
  color:#3d2a06;font-size:25px;
  box-shadow:inset 0 2px #fff8,0 3px 8px #0008;
  user-select:none;
}
.companyTitle{min-width:100px;max-width:180px;overflow:hidden;}
.companyTitle b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.companyTitle small{color:#9eafb7;font-size:9px;}
.stats{margin-left:auto;display:flex;gap:7px;align-items:center;}
.stat{
  min-width:74px;padding:5px 8px;border-radius:8px;
  background:#111a1f;border:1px solid #42545e;
  text-align:center;box-shadow:inset 0 1px #fff1;
}
.stat span{display:block;color:#91a5ae;font-size:8px;text-transform:uppercase;}
.stat strong{display:block;margin-top:2px;font-size:12px;}

/* WORLD */
#world{
  position:relative;
  flex:1;
  overflow:hidden;
  background:linear-gradient(135deg,#76a95b 0%,#679d51 45%,#5d934d 100%);
  isolation:isolate;
}
#world::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%,#ffffff0b 0 2px,transparent 3px),
    radial-gradient(circle at 70% 70%,#00000008 0 2px,transparent 3px);
  background-size:55px 55px,70px 70px;
  pointer-events:none;
}

/* DISTRICTS */
.district{position:absolute;border-radius:20px;opacity:.55;z-index:2;}
.district.one{left:0;top:0;width:53%;height:52%;background:#83b967;}
.district.two{left:0;top:52%;width:53%;height:48%;background:#72a95b;}
.district.three{left:69%;top:0;width:31%;height:52%;background:#7eae61;}
.district.four{left:69%;top:52%;width:31%;height:48%;background:#6fa256;}

.zoneLabel{
  position:absolute;z-index:15;padding:5px 9px;border-radius:8px;
  background:#172027aa;border:1px solid #ffffff22;
  font-size:8px;font-weight:bold;letter-spacing:1px;
  pointer-events:none;
}
.playerZone{left:3%;top:2%;}
.rivalZone{right:3%;top:2%;}

/* RIVER */
#river{
  position:absolute;
  z-index:20;
  left:57%;
  top:0;
  width:12%;
  height:100%;
  background:repeating-linear-gradient(0deg,#438bb0 0 18px,#4b96b9 18px 36px);
  border-left:5px solid #80b5c8;
  border-right:5px solid #80b5c8;
  box-shadow:inset 0 0 20px #174c6c99;
}
#river::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    -18deg,
    transparent 0 34px,
    #ffffff18 34px 38px,
    transparent 38px 70px
  );
}

/* =========================================================
   NEW CITY LAYOUT
   Roads are placed around the grass plots.
   Player shops form a vertical column.
========================================================= */

.road{
  position:absolute;
  z-index:30;
  background:#3b4144;
  box-shadow:inset 0 2px #555c5f,inset 0 -2px #25292b;
}

.road.horizontal{
  left:0;
  width:100%;
  height:7%;
  transform:translateY(-50%);
}

.road.vertical{
  top:0;
  height:100%;
  width:4.5%;
  transform:translateX(-50%);
}

/* Main horizontal roads */
.h1{top:13%;}
.h2{top:38%;}
.h3{top:63%;}
.h4{top:87%;}

/* Main vertical roads */
.v1{left:18%;}
.v2{left:42%;}
.v3{left:76%;}

/* Road markings */
.road.horizontal::after{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  height:3px;
  transform:translateY(-50%);
  background:repeating-linear-gradient(
    90deg,
    #f1d34d 0 22px,
    transparent 22px 42px
  );
}

.road.vertical::after{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:3px;
  height:100%;
  transform:translateX(-50%);
  background:repeating-linear-gradient(
    0deg,
    #f1d34d 0 22px,
    transparent 22px 42px
  );
}

/* intersections */
.intersection{
  position:absolute;
  z-index:35;
  width:4.5%;
  height:7%;
  transform:translate(-50%,-50%);
  background:#3b4144;
}

/* PAVEMENTS */
.pavement{
  position:absolute;
  z-index:40;
  background:#b8b5a7;
  border-top:2px solid #d4d0bd;
  border-bottom:2px solid #8d8a7e;
  box-shadow:0 2px 4px #0003;
}

.pavement.horizontal{
  left:0;
  width:100%;
  height:2.5%;
  transform:translateY(-50%);
}

.pavement.vertical{
  top:0;
  height:100%;
  width:1.8%;
  transform:translateX(-50%);
}

.ph1{top:17%;}
.ph2{top:42%;}
.ph3{top:67%;}
.ph4{top:91%;}

.pv1{left:14%;}
.pv2{left:38%;}
.pv3{left:47%;}
.pv4{left:84%;}

.path{
  position:absolute;
  z-index:42;
  background:#c8c4b2;
  border:1px solid #aaa697;
  box-shadow:0 1px 3px #0002;
}

.shopPath{
  position:absolute;
  z-index:44;
  width:12px;
  background:#c8c4b2;
  border-left:1px solid #aaa697;
  border-right:1px solid #aaa697;
}

.crossing{
  position:absolute;
  z-index:50;
  width:6%;
  height:7%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:3px;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.crossing i{
  width:4px;
  height:65%;
  background:#eee;
}

/* =========================================================
   ROUNDABOUT
========================================================= */
#roundabout{
  position:absolute;
  z-index:38;
  left:30%;
  top:38%;
  width:180px;
  height:180px;
  transform:translate(-50%,-50%);
}

.roundRoad{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#383e40;
  border:5px solid #555b5d;
  box-shadow:0 4px 9px #0005;
}

.roundRoad::before{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  border:3px dashed #f1d34d;
}

.roundIsland{
  position:absolute;
  inset:55px;
  border-radius:50%;
  background:#72a653;
  border:4px solid #527b3d;
  box-shadow:inset 0 0 8px #0004;
}

.roundIsland::after{
  content:"🌳";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:27px;
}

.roundArrow{
  position:absolute;
  color:#f4e68b;
  font-size:18px;
}

.ra1{left:20px;top:79px;}
.ra2{right:20px;top:79px;transform:rotate(180deg);}
.ra3{left:81px;top:18px;transform:rotate(90deg);}
.ra4{left:81px;bottom:18px;transform:rotate(-90deg);}

/* BRIDGES */
.bridge{
  position:absolute;
  z-index:55;
  left:63%;
  width:13%;
  height:7%;
  transform:translate(-50%,-50%);
  background:repeating-linear-gradient(
    90deg,
    #6b7376 0 22px,
    #51585b 22px 44px
  );
  border-top:3px solid #d0d1c8;
  border-bottom:3px solid #d0d1c8;
  box-shadow:0 3px 8px #0006;
}

.bridge1{top:13%;}
.bridge2{top:87%;}

/* =========================================================
   GRASS PLOTS
   Each building is completely inside its corresponding plot.
========================================================= */

.plot{
  position:absolute;
  z-index:60;
  border-radius:16px;
  background:#83b866;
  border:3px solid #67974e;
  box-shadow:
    inset 0 0 0 2px #ffffff12,
    0 4px 7px #0002;
}

.plot::after{
  content:"";
  position:absolute;
  inset:5px;
  border-radius:11px;
  border:1px dashed #ffffff1a;
  pointer-events:none;
}

/* PLAYER SIDE — vertical row */
.plot1{left:3%;top:2%;width:13%;height:9%;}
.plot2{left:3%;top:27%;width:13%;height:9%;}
.plot3{left:3%;top:52%;width:13%;height:9%;}
.plot4{left:3%;top:76%;width:13%;height:9%;}

/* Bottom grass area */
.plot5{left:20%;top:91%;width:29%;height:8%;}

/* KING'S MART SIDE */
.plot6{right:3%;top:18%;width:25%;height:19%;}
.plot7{right:6%;top:68%;width:20%;height:18%;}

/* =========================================================
   BUILDINGS
========================================================= */

.building{
  position:absolute;
  z-index:100;
  border-radius:7px;
  cursor:pointer;
  user-select:none;
  transition:filter .15s;
}

.building:hover{filter:brightness(1.1);}

.buildingBody{
  position:absolute;
  inset:12% 0 0;
  border:3px solid #3c3f3c;
  border-radius:5px;
  background:#d8c58a;
  box-shadow:0 7px 0 #756e59,0 10px 12px #0005;
}

.roof{
  position:absolute;
  left:-4%;
  right:-4%;
  top:0;
  height:23%;
  clip-path:polygon(7% 100%,50% 0,93% 100%);
  background:#7a4e35;
  border:2px solid #4d3426;
  z-index:4;
}

.windows{
  position:absolute;
  left:10%;
  right:10%;
  top:31%;
  display:flex;
  justify-content:space-around;
  gap:4px;
}

.window{
  width:20%;
  height:19px;
  background:#8ed3e8;
  border:2px solid #34464a;
  box-shadow:inset 0 0 7px #fff8;
}

.door{
  position:absolute;
  bottom:0;
  left:50%;
  width:17%;
  height:35%;
  transform:translateX(-50%);
  background:#543d2d;
  border:2px solid #30241d;
  z-index:5;
}

.sign{
  position:absolute;
  z-index:15;
  left:50%;
  top:-18%;
  transform:translateX(-50%);
  min-width:80%;
  padding:4px 7px;
  text-align:center;
  border-radius:5px;
  background:#f1c63e;
  color:#2c250d;
  border:2px solid #725c18;
  box-shadow:0 3px 4px #0005;
  font-weight:900;
  font-size:9px;
  white-space:nowrap;
}

.levelBadge{
  position:absolute;
  z-index:20;
  right:-7px;
  top:-7px;
  min-width:23px;
  padding:3px 4px;
  border-radius:10px;
  background:#172027;
  border:1px solid #9aa9ad;
  color:#fff;
  text-align:center;
  font-size:7px;
  font-weight:bold;
}

.stockBadge{
  position:absolute;
  z-index:20;
  left:50%;
  bottom:-23px;
  transform:translateX(-50%);
  padding:3px 6px;
  border-radius:8px;
  background:#172027;
  border:1px solid #647984;
  font-size:7px;
  white-space:nowrap;
}

.stateBadge{
  position:absolute;
  z-index:20;
  left:50%;
  bottom:-38px;
  transform:translateX(-50%);
  padding:2px 6px;
  border-radius:8px;
  font-size:6px;
  white-space:nowrap;
  font-weight:bold;
  border:1px solid #0004;
}

.stateBadge.OPEN{background:#3f8f4d;color:#fff;}
.stateBadge.BUSY{background:#c98b2c;color:#fff;}
.stateBadge.LOW_STOCK{background:#c93e3e;color:#fff;}
.stateBadge.CLOSED{background:#555;color:#ddd;}
.stateBadge.RENOVATING{background:#3f85b4;color:#fff;}
.stateBadge.OPENING{background:#8a5cc9;color:#fff;}

/* =========================================================
   NEW PLAYER BUILDING POSITIONS
   Every shop is completely inside its grass plot.
========================================================= */

#shop1{
  left:5%;
  top:3%;
  width:9%;
  height:7%;
}

#shop2{
  left:5%;
  top:28%;
  width:9%;
  height:7%;
}

#shop3{
  left:5%;
  top:53%;
  width:9%;
  height:7%;
}

#shop4{
  left:5%;
  top:77%;
  width:9%;
  height:7%;
}

.playerBuilding .buildingBody{background:#e3c35a;}
.playerBuilding .roof{background:#9b622d;}

.abandonedBuilding{background:#555;}
.abandonedBuilding .buildingBody{background:#777;}
.abandonedBuilding .roof{background:#494949;}
.abandonedBuilding .sign{background:#555;color:#eee;}

.playerPurchased .buildingBody{background:#e3c35a;}
.playerPurchased .roof{background:#9b622d;}
.playerPurchased .sign{background:#f1c63e;color:#2c250d;}

/* =========================================================
   KING'S MART
========================================================= */

#kingsHQ{
  position:absolute;
  z-index:110;
  right:7%;
  top:20%;
  width:18%;
  height:15%;
  cursor:pointer;
}

#kingsHQ .buildingBody{
  background:#d7dce0;
  border:4px solid #26343b;
  box-shadow:0 9px 0 #657078,0 13px 16px #0007;
}

#kingsHQ .roof{
  height:27%;
  clip-path:none;
  left:0;
  right:0;
  background:#1e2930;
  border:3px solid #11181c;
}

#kingsHQ .sign{
  top:-17%;
  background:#dc3434;
  color:#fff;
  border-color:#751c1c;
  font-size:10px;
  min-width:100%;
}

#kingsHQ .windows{top:35%;}
#kingsHQ .window{height:25px;background:#78bdd5;}

#kingsHQ .door{
  height:43%;
  width:20%;
  background:#303d43;
}

#kingsHQ .hqBanner{
  position:absolute;
  left:5%;
  right:5%;
  bottom:5%;
  padding:3px;
  text-align:center;
  background:#e43131;
  color:#fff;
  border-radius:3px;
  font-size:7px;
  font-weight:bold;
}

#kingsExpress{
  position:absolute;
  z-index:110;
  right:9%;
  top:70%;
  width:14%;
  height:14%;
  cursor:pointer;
}

#kingsExpress .buildingBody{
  background:#e0e3e3;
  border-color:#3c4246;
}

#kingsExpress .roof{
  clip-path:none;
  background:#222c32;
}

#kingsExpress .sign{
  background:#dc3434;
  color:#fff;
  border-color:#711d1d;
}

/* =========================================================
   PARK / DETAILS
========================================================= */

.park{
  position:absolute;
  z-index:65;
  left:21%;
  top:68%;
  width:24%;
  height:17%;
  border-radius:18px;
  background:#72a95b;
  border:3px solid #5b914a;
}

.park::before{
  content:"🌳   🌳   🌳";
  position:absolute;
  left:15%;
  top:30%;
  font-size:22px;
}

.bench{
  position:absolute;
  z-index:70;
  width:35px;
  height:8px;
  border-radius:3px;
  background:#6c432c;
  border:2px solid #412719;
}

.bench.b1{left:25%;top:73%;}
.bench.b2{left:35%;top:80%;}

.lamp{
  position:absolute;
  z-index:75;
  width:4px;
  height:22px;
  background:#30383b;
}

.lamp::before{
  content:"";
  position:absolute;
  left:-3px;
  top:-4px;
  width:10px;
  height:7px;
  border-radius:50%;
  background:#fff3a3;
  box-shadow:0 0 8px #fff3a3;
}

.l1{left:17%;top:17%;}
.l2{left:17%;top:42%;}
.l3{left:17%;top:67%;}
.l4{left:52%;top:42%;}
.l5{right:31%;top:87%;}

.tree{
  position:absolute;
  z-index:67;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#43833e;
  border:4px solid #316633;
  box-shadow:inset 5px 5px #72ad5a,0 5px 4px #0003;
}

.tree::after{
  content:"";
  position:absolute;
  width:7px;
  height:13px;
  left:9px;
  top:25px;
  background:#65442b;
  z-index:-1;
}

.t1{left:19%;top:5%;}
.t2{left:43%;top:8%;}
.t3{left:45%;top:92%;}
.t4{right:32%;top:45%;}
.t5{right:3%;top:48%;}
.t6{right:28%;top:88%;}

.parking{
  position:absolute;
  z-index:64;
  right:3%;
  top:44%;
  width:21%;
  height:12%;
  background:#747875;
  border:3px solid #555a58;
  border-radius:8px;
}

.parking span{
  position:absolute;
  width:25%;
  height:65%;
  top:18%;
  border-left:2px solid #ddd;
  border-right:2px solid #ddd;
}

.parking span:nth-child(1){left:5%;}
.parking span:nth-child(2){left:35%;}
.parking span:nth-child(3){left:65%;}

/* PEOPLE + CARS */
#peopleLayer,#carsLayer,#deliveryLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:500;
}

.person{
  position:absolute;
  width:9px;
  height:14px;
  border-radius:5px 5px 3px 3px;
  background:#2f6fb3;
  border:1px solid #182f4a;
  box-shadow:0 2px 3px #0007;
  transform:translate(-50%,-50%);
}

.person::before{
  content:"";
  position:absolute;
  left:1px;
  top:-5px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ffd0aa;
  border:1px solid #7c4c36;
}

.person.red{
  background:#d83434;
  border-color:#701919;
}

.person.red::before{background:#ffc0a5;}
.person.hidden{opacity:0;}

.car{
  position:absolute;
  width:27px;
  height:13px;
  border-radius:4px;
  background:#e7e7e7;
  border:2px solid #333a3e;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 5px #0008;
}

.car::before,.car::after{
  content:"";
  position:absolute;
  top:2px;
  width:5px;
  height:7px;
  background:#91cfe4;
  border:1px solid #42565e;
}

.car::before{left:4px;}
.car::after{right:4px;}
.car.redCar{background:#c94343;}
.car.blueCar{background:#4288b8;}
.car.yellowCar{background:#d7aa35;}

.deliveryVan{
  position:absolute;
  width:30px;
  height:15px;
  border-radius:4px;
  background:#f2f2f2;
  border:2px solid #303437;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 5px #0008;
}

.deliveryVan::before{
  content:"DELIVERY";
  position:absolute;
  left:4px;
  top:2px;
  color:#222;
  font-size:4px;
  font-weight:bold;
}

/* DEBUG */
#debugLayer{
  position:absolute;
  inset:0;
  z-index:900;
  pointer-events:none;
  display:none;
}

#debugLayer.on{display:block;}

#debugBadge{
  position:absolute;
  left:6px;
  top:62px;
  z-index:950;
  background:#c93e3e;
  color:#fff;
  font-size:9px;
  font-weight:bold;
  padding:3px 7px;
  border-radius:6px;
  display:none;
}

#debugBadge.on{display:block;}

/* BOTTOM BAR */
#bottomBar{
  height:57px;
  flex-shrink:0;
  display:flex;
  background:#182229;
  border-top:2px solid #4c5e67;
  z-index:1000;
}

.navButton{
  flex:1;
  background:#1d2930;
  color:#9caeb6;
  border-right:1px solid #3b4a51;
  font-size:9px;
  font-weight:bold;
}

.navButton span{
  display:block;
  font-size:19px;
  margin-bottom:1px;
}

.navButton:active{background:#30424c;}

/* PANEL */
#panel{
  position:absolute;
  z-index:2000;
  right:15px;
  top:15px;
  width:330px;
  max-width:calc(100% - 30px);
  max-height:calc(100% - 30px);
  overflow:auto;
  padding:16px;
  border-radius:15px;
  background:linear-gradient(#293940,#182329);
  border:2px solid #667982;
  box-shadow:0 15px 35px #000b;
  display:none;
}

#panel.open{display:block;}
#panel h2{margin:0 0 5px;font-size:18px;}
#panel p{margin:6px 0;color:#b8c7cd;font-size:12px;line-height:1.4;}

.panelClose{
  position:absolute;
  right:9px;
  top:8px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#4a5960;
  color:#fff;
}

.actionButton{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:8px;
  background:#d7aa35;
  color:#211a07;
  font-weight:bold;
  border:1px solid #f2d16b;
}

.actionButton.green{
  background:#55a95c;
  color:#fff;
  border-color:#84d389;
}

.actionButton.red{
  background:#c93e3e;
  color:#fff;
  border-color:#ee7474;
}

.actionButton.blue{
  background:#3f85b4;
  color:#fff;
  border-color:#73b7e2;
}

.actionButton:disabled{opacity:.45;}

.input{
  width:100%;
  padding:10px;

/* =========================================================
   KING'S MART TYCOON
   Claude gameplay systems preserved.
   Layout/world coordinates updated to match new city.
========================================================= */

const SAVE_KEY = "kings_mart_tycoon_city_v12_layout";
let DEBUG_MODE = false;

/* ---------------------------------------------------------
   GAME STATE
--------------------------------------------------------- */

let game = {
  company: "Your Company",
  cash: 5000,
  reputation: 50,
  marketShare: 8,
  customers: 42,
  totalStores: 1,
  selectedShop: 0,
  staff: [],

  properties: [
    {name:"Old Corner Shop",price:2200,bought:false,storeIndex:null},
    {name:"Empty High Street",price:3500,bought:false,storeIndex:null},
    {name:"Abandoned Supermarket",price:4800,bought:false,storeIndex:null}
  ],

  stores: [
    {
      name:"My Mart",
      level:1,
      condition:65,
      baseIncome:12,
      customers:42,
      upgrades:0,
      stock:100,
      maxStock:100,
      renovatingUntil:0,
      openingUntil:0
    }
  ],

  rival:{
    name:"King's Mart",
    customers:220,
    health:100,
    marketShare:32,
    income:95,
    stage:"HEALTHY"
  },

  lastSave:Date.now()
};

/* ---------------------------------------------------------
   LOAD / MIGRATE
--------------------------------------------------------- */

function loadGame(){

  let old=null;

  try{
    old=JSON.parse(localStorage.getItem(SAVE_KEY));
  }catch(e){
    old=null;
  }

  if(!old){

    const oldKeys=[
      "kings_mart_tycoon_city_v11",
      "kings_mart_tycoon_city_v10",
      "kings_mart_tycoon_city_v9",
      "kings_mart_tycoon_city_v8",
      "kings_mart_tycoon_city_v7",
      "kings_mart_tycoon_v5"
    ];

    for(const key of oldKeys){
      try{
        const data=JSON.parse(localStorage.getItem(key));
        if(data){
          old=data;
          break;
        }
      }catch(e){}
    }
  }

  if(old){

    game={
      ...game,
      ...old,
      rival:{
        ...game.rival,
        ...(old.rival||{})
      }
    };

    if(!Array.isArray(game.stores))game.stores=[];
    if(!Array.isArray(game.properties))game.properties=[];
    if(!Array.isArray(game.staff))game.staff=[];

    game.stores.forEach(shop=>{

      if(typeof shop.stock!=="number")shop.stock=100;
      if(typeof shop.maxStock!=="number")shop.maxStock=100;
      if(typeof shop.upgrades!=="number")shop.upgrades=0;
      if(typeof shop.level!=="number")shop.level=1;
      if(typeof shop.condition!=="number")shop.condition=50;
      if(typeof shop.customers!=="number")shop.customers=10;
      if(typeof shop.renovatingUntil!=="number")shop.renovatingUntil=0;
      if(typeof shop.openingUntil!=="number")shop.openingUntil=0;

    });

    game.properties.forEach(property=>{

      if(
        property.bought &&
        (
          property.storeIndex===null ||
          typeof property.storeIndex!=="number" ||
          !game.stores[property.storeIndex]
        )
      ){
        property.bought=false;
        property.storeIndex=null;
      }

    });
  }

  if(!game.stores.length){

    game.stores.push({
      name:"My Mart",
      level:1,
      condition:65,
      baseIncome:12,
      customers:42,
      upgrades:0,
      stock:100,
      maxStock:100,
      renovatingUntil:0,
      openingUntil:0
    });

  }

}

/* ---------------------------------------------------------
   SAVE
--------------------------------------------------------- */

function saveGame(){

  game.lastSave=Date.now();

  try{
    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(game)
    );
  }catch(e){}

}

/* ---------------------------------------------------------
   OFFLINE INCOME
--------------------------------------------------------- */

function offlineIncome(){

  const now=Date.now();

  const elapsed=Math.min(
    28800,
    Math.max(
      0,
      (now-game.lastSave)/1000
    )
  );

  if(elapsed<5)return;

  const amount=Math.floor(
    getIncome()*elapsed
  );

  if(amount>0){

    game.cash+=amount;

    setTimeout(
      ()=>toast(
        "💰 Offline earnings: £"+
        amount.toLocaleString()
      ),
      500
    );
  }
}

/* ---------------------------------------------------------
   STAFF
--------------------------------------------------------- */

const ADAM={
  name:"Adam",
  age:18,
  intelligence:100,
  management:95,
  stocking:65,
  customerService:72,
  problemSolving:100,
  trait:"Natural Manager"
};

function getStaffBonus(){

  let incomeBonus=0;
  let customerBonus=0;
  let stockBonus=0;

  game.staff.forEach(p=>{

    incomeBonus+=(p.management||0)*0.00035;
    incomeBonus+=(p.problemSolving||0)*0.00015;

    customerBonus+=(p.intelligence||0)*0.00008;
    customerBonus+=(p.customerService||0)*0.00006;

    stockBonus+=(p.stocking||0)*0.0003;

  });

  return{
    incomeBonus,
    customerBonus,
    stockBonus
  };

}

/* ---------------------------------------------------------
   ECONOMY
--------------------------------------------------------- */

function getShopIncome(shop){

  let income=
    shop.baseIncome+
    ((shop.level-1)*10)+
    ((shop.upgrades||0)*8);

  const stock=Math.max(
    0,
    Math.min(
      1,
      (shop.stock||0)/100
    )
  );

  const stockMultiplier=
    0.5+
    stock*0.5;

  const condition=
    0.7+
    Math.max(
      0,
      Math.min(
        1,
        shop.condition/100
      )
    )*0.3;

  return income*
    stockMultiplier*
    condition;
}

function getIncome(){

  let total=0;

  game.stores.forEach(shop=>{
    total+=getShopIncome(shop);
  });

  const staff=getStaffBonus();

  total*=1+staff.incomeBonus;

  return total;
}

function computeShopState(shop){

  const now=Date.now();

  if(
    shop.renovatingUntil &&
    now<shop.renovatingUntil
  ){
    return"RENOVATING";
  }

  if(
    shop.openingUntil &&
    now<shop.openingUntil
  ){
    return"OPENING";
  }

  if((shop.stock||0)<=0){
    return"CLOSED";
  }

  if((shop.stock||0)<20){
    return"LOW_STOCK";
  }

  if(shop.customers>60){
    return"BUSY";
  }

  return"OPEN";
}

function updateCustomers(seconds){

  const staff=getStaffBonus();

  game.stores.forEach(shop=>{

    const stock=Math.min(
      1,
      Math.max(
        0,
        (shop.stock||0)/100
      )
    );

    const condition=Math.min(
      1,
      Math.max(
        0,
        shop.condition/100
      )
    );

    let growth=
      (
        0.012+
        staff.customerBonus+
        stock*0.007+
        condition*0.006
      )*
      seconds;

    shop.customers+=growth;

    if(shop.stock<10){

      shop.customers=
        Math.max(
          5,
          shop.customers-
          0.01*seconds
        );

    }

  });

  game.customers=
    game.stores.reduce(
      (sum,shop)=>
        sum+shop.customers,
      0
    );

}

let deliveryTimer=0;

function updateStock(seconds){

  const staff=getStaffBonus();

  game.stores.forEach(shop=>{

    if(typeof shop.stock!=="number")
      shop.stock=100;

    const consumption=
      shop.customers*
      0.0022*
      seconds*
      (
        1-
        Math.min(
          0.4,
          staff.stockBonus
        )
      );

    shop.stock=
      Math.max(
        0,
        shop.stock-consumption
      );

  });

  deliveryTimer+=seconds;

  if(deliveryTimer>=45){

    deliveryTimer=0;

    game.stores.forEach((shop,idx)=>{

      shop.stock=
        Math.min(
          shop.maxStock||100,
          (shop.stock||0)+35
        );

      spawnDeliveryForStore(idx);

    });

    toast("🚚 Your deliveries have arrived!");

  }

}

function updateRival(seconds){

  if(
    game.marketShare>12 &&
    game.rival.health>0
  ){

    game.rival.health=
      Math.max(
        0,
        game.rival.health-
        0.0009*seconds
      );

  }

  if(
    game.rival.health>50 &&
    game.rival.customers<220
  ){

    game.rival.customers=
      Math.min(
        220,
        game.rival.customers+
        0.008*seconds
      );

  }

  rivalAI();

}

function rivalAI(){

  const health=game.rival.health;

  if(health>75)
    game.rival.stage="HEALTHY";

  else if(health>50)
    game.rival.stage="UNDER PRESSURE";

  else if(health>30)
    game.rival.stage="STRUGGLING";

  else if(health>10)
    game.rival.stage="DISTRESSED";

  else
    game.rival.stage="FOR SALE";

  const maximum=
    Math.floor(
      220*
      health/
      100
    );

  game.rival.customers=
    Math.min(
      game.rival.customers,
      maximum
    );

  if(game.rival.health<=0)
    game.rival.customers=0;

}

/* =========================================================
   GRAPH HELPERS
========================================================= */

function buildAdjacency(edges,directedEdges){

  const adj={};

  const add=(a,b)=>{
    (adj[a]=adj[a]||[]).push(b);
  };

  (edges||[]).forEach(([a,b])=>{
    add(a,b);
    add(b,a);
  });

  (directedEdges||[]).forEach(([a,b])=>{
    add(a,b);
  });

  return adj;
}

function bfsPath(adj,start,goal){

  if(start===goal)
    return[start];

  const visited=
    new Set([start]);

  const queue=[
    [start]
  ];

  while(queue.length){

    const path=
      queue.shift();

    const node=
      path[path.length-1];

    const neighbors=
      adj[node]||[];

    for(const n of neighbors){

      if(visited.has(n))
        continue;

      const newPath=
        path.concat([n]);

      if(n===goal)
        return newPath;

      visited.add(n);
      queue.push(newPath);

    }
  }

  return null;
}

const VEHICLE_ADJ=
  buildAdjacency(
    ROAD_EDGES,
    ROAD_EDGES_DIRECTED
  );

const PED_ADJ=
  buildAdjacency(
    PED_EDGES,
    []
  );

function findVehiclePath(
  startId,
  goalId
){

  const path=
    bfsPath(
      VEHICLE_ADJ,
      startId,
      goalId
    );

  if(!path)
    return null;

  return path.map(
    id=>({
      id,
      x:ROAD_NODES[id].x,
      y:ROAD_NODES[id].y
    })
  );
}

function findPedestrianPath(
  startId,
  goalId
){

  const path=
    bfsPath(
      PED_ADJ,
      startId,
      goalId
    );

  if(!path)
    return null;

  return path.map(
    id=>({
      id,
      x:PED_NODES_ALL[id].x,
      y:PED_NODES_ALL[id].y
    })
  );
}

========================================================= */

const CollisionManager={

  buildingRects:[],

  refreshColliders(){

    const rects=[];

    SLOTS.forEach(
      (slot,i)=>{

        const owned=
          i===0||
          isSlotActive(i);

        if(owned){

          rects.push({
            id:slot.el,
            left:slot.bx,
            right:slot.bx+slot.bw,
            top:slot.by,
            bottom:slot.by+slot.bh
          });

        }

      }
    );

    rects.push({
      id:KINGS_HQ.el,
      left:KINGS_HQ.bx,
      right:KINGS_HQ.bx+KINGS_HQ.bw,
      top:KINGS_HQ.by,
      bottom:KINGS_HQ.by+KINGS_HQ.bh
    });

    rects.push({
      id:KINGS_EXPRESS.el,
      left:KINGS_EXPRESS.bx,
      right:KINGS_EXPRESS.bx+KINGS_EXPRESS.bw,
      top:KINGS_EXPRESS.by,
      bottom:KINGS_EXPRESS.by+KINGS_EXPRESS.bh
    });

    this.buildingRects=rects;

  },

  isBuildingBlocked(x,y,pad){

    pad=pad||0.6;

    return this.buildingRects.some(
      r=>
        x>r.left-pad&&
        x<r.right+pad&&
        y>r.top-pad&&
        y<r.bottom+pad
    );

  },

  isRiverBlocked(x,y){

    return(
      x>56.5&&
      x<69.5
    );

  },

  isRoadBlocked(x,y){

    return false;

  },

  isPedestrianBlocked(x,y){

    return(
      this.isBuildingBlocked(
        x,y,0.3
      )||
      this.isRiverBlocked(x,y)
    );

  },

  isVehicleBlocked(x,y){

    return this.isBuildingBlocked(
      x,y,1.0
    );

  },

  getNearbyObjects(
    x,
    y,
    list,
    radius
  ){

    return list.filter(
      o=>
        Math.hypot(
          o.x-x,
          o.y-y
        )<=radius
    );

  }

};

function isSlotActive(slotIndex){

  if(slotIndex===0)
    return true;

  const property=
    game.properties[
      slotIndex-1
    ];

  return !!(
    property&&
    property.bought
  );

}

function storeIndexForSlot(slotIndex){

  if(slotIndex===0)
    return 0;

  const property=
    game.properties[
      slotIndex-1
    ];

  return property&&
    property.bought
    ?property.storeIndex
    :null;

}

function validateCity(){

  CollisionManager.refreshColliders();

  let errors=0;

  CollisionManager.buildingRects.forEach(
    b=>{

      if(
        b.left<69&&
        b.right>57
      ){

        console.error(
          "ERROR: "+
          b.id+
          " overlaps river"
        );

        errors++;
      }

    }
  );

  [
    "shop1_entrance",
    "shop2_entrance",
    "shop3_entrance",
    "shop4_entrance",
    "kingsHQ_entrance",
    "kingsExpress_entrance"
  ].forEach(id=>{

    if(
      !PED_ADJ[id]||
      !PED_ADJ[id].length
    ){

      console.error(
        "ERROR: entrance "+
        id+
        " has no pedestrian connection"
      );

      errors++;

    }

  });

  if(errors===0)
    console.log(
      "validateCity: OK"
    );
  else
    console.log(
      "validateCity: "+
      errors+
      " problem(s)"
    );

  return errors;
}

function randomNodeId(

){

  let id;

  do{

      CAR_NODE_IDS[
        Math.floor(
          Math.random()*
          CAR_NODE_IDS.length
        )
      ];

  }while(
    id===excludeId
  );

function newCarRoute(
  fromId
){

  for(
    let tries=0;
    tries<6;
    tries++
  ){

    const goal=
      randomNodeId(
        fromId
      );

    const path=
      findVehiclePath(
        fromId,
        goal
      );

    if(
      path&&
      path.length>1
    )
      return path;

  }

  return null;
}

function carAheadTooClose(car){

  const target=
    car.waypoints[0];

  if(!target)
    return false;

  const dirx=
    target.x-car.x;

  const diry=
    target.y-car.y;

  const dirLen=
    Math.hypot(
      dirx,
      diry
    )||1;

  const ndx=
    dirx/dirLen;

  const ndy=
    diry/dirLen;

  for(
    const other of cars
  ){

    if(other===car)
      continue;

    const dx=
      other.x-car.x;

    const dy=
      other.y-car.y;

    const dist=
      Math.hypot(
        dx,
        dy
      );

    if(
      dist>6||
      dist<0.0001
    )
      continue;

    const dot=
      (dx/dist)*ndx+
      (dy/dist)*ndy;

    if(
      dot>0.6&&
      dist<4.2
    )
      return true;

  }

  return false;
}

function roundaboutBlockedFor(car){

  const target=
    car.waypoints[0];

  if(
    !target||
    !target.id
  )
    return false;

  const enteringLoop=
    ROUNDABOUT_LOOP_SET.has(
      target.id
    )&&
    !ROUNDABOUT_LOOP_SET.has(
      car.currentNodeId
    );

  if(!enteringLoop)
    return false;

  return cars.some(
    o=>
      o!==car&&
      ROUNDABOUT_LOOP_SET.has(
        o.currentNodeId
      )&&
      Math.hypot(
        o.x-target.x,
        o.y-target.y
      )<6
  );

}

function updateCars(dt){

  cars.forEach(car=>{

    if(!car.waypoints.length){

      const route=
        newCarRoute(
          car.currentNodeId
        );

      if(route)
        car.waypoints=
          route.slice(1);

      return;
    }

    const target=
      car.waypoints[0];

    let desired=
      car.maxSpeed;

    if(carAheadTooClose(car))
      desired=0;

    if(roundaboutBlockedFor(car))
      desired=0;

    car.speed+=
      (
        desired-
        car.speed
      )*
      Math.min(
        1,
        dt*3
      );

    if(car.speed<0.05)
      car.speed=0;

    const dx=
      target.x-car.x;

    const dy=
      target.y-car.y;

    const dist=
      Math.hypot(
        dx,
        dy
      );

    const move=
      Math.min(
        car.speed*dt,
        dist
      );

    if(dist>0.001){

      const nx=
        car.x+
        (dx/dist)*move;

      const ny=
        car.y+
        (dy/dist)*move;

      if(
        !CollisionManager
          .isVehicleBlocked(
            nx,
            ny
          )
      ){

        car.x=nx;
        car.y=ny;

        if(move>0.001){

          car.angle=
            Math.atan2(
              dy,
              dx
            )*
            180/
            Math.PI;

        }

      }else{

        car.speed=0;

      }

    }

    if(
      dist<=move+0.05
    ){

      car.currentNodeId=
        target.id||
        car.currentNodeId;

      car.waypoints.shift();

    }

  });

}

function renderCars(){

  cars.forEach(car=>{

    car.el.style.left=
      car.x+"%";

    car.el.style.top=
      car.y+"%";

    car.el.style.transform=
      "translate(-50%,-50%) rotate("+
      car.angle+
      "deg)";

  });

}

function updateDeliveries(dt){

  deliveryVans=
    deliveryVans.filter(
      van=>{

        if(!van.waypoints.length){

          van.el.remove();
          return false;

        }

        const target=
          van.waypoints[0];

        const dx=
          target.x-van.x;

        const dy=
          target.y-van.y;

        const dist=
          Math.hypot(
            dx,
            dy
          );

        const move=
          Math.min(
            van.speed*dt,
            dist
          );

        if(dist>0.001){

          van.x+=
            (dx/dist)*move;

          van.y+=
            (dy/dist)*move;

        }

        if(
          dist<=move+0.05
        )
          van.waypoints.shift();

        van.el.style.left=
          van.x+"%";

        van.el.style.top=
          van.y+"%";

        return true;

      }
    );

}

      return;

    const dx=
      p.x-o.x;

    const dy=
      p.y-o.y;

    const d=
      Math.hypot(
        dx,
        dy
      );

    if(
      d>0.0001&&
      d<1.1
    ){

      ox+=
        dx/d*
        (1.1-d);

      oy+=
        dy/d*
        (1.1-d);

    }

  });

  return{
    ox,
    oy
  };

}

function newPersonRoute(
  kind,
  fromId
){

  const pool=
    kind==="player"
    ?PLAYER_WALK_NODES
    :RIVAL_WALK_NODES;

  const entrances=
    kind==="player"
    ?activeEntranceIds()
    :[
      "kingsHQ_entrance",
      "kingsExpress_entrance"
    ];

  const wantsShop=
    Math.random()<0.35&&
    entrances.length;

  let goal;

  if(wantsShop){

    goal=
      entrances[
        Math.floor(
          Math.random()*
          entrances.length
        )
      ];

  }else{

    do{

      goal=
        pool[
          Math.floor(
            Math.random()*
            pool.length
          )
        ];

    }while(
      goal===fromId
    );

  }

  const path=
    findPedestrianPath(
      fromId,
      goal
    );

  if(
    !path||
    path.length<2
  )
    return null;

  return{
    path,
    toShop:wantsShop
  };

}

function makePerson(kind){

  const pool=
    kind==="player"
    ?PLAYER_WALK_NODES
    :RIVAL_WALK_NODES;

  const startId=
    pool[
      Math.floor(
        Math.random()*
        pool.length
      )
    ];

  const start=
    PED_NODES_ALL[
      startId
    ];

  return{

    kind,

    x:start.x,
    y:start.y,

    currentNodeId:startId,

    waypoints:[],

    state:"WALKING",

    speed:
      1.1+
      Math.random()*0.3,

    stateTimer:0,

    targetEntrance:null

  };

}

function createPeople(){

  const layer=
    document.getElementById(
      "peopleLayer"
    );

  layer.innerHTML="";
  people=[];

  const playerCount=
    Math.min(
      18,
      Math.max(
        7,
        Math.floor(
          game.customers/12
        )
      )
    );

  const rivalCount=
    Math.min(
      8,
      Math.max(
        1,
        Math.ceil(
          game.rival.customers/45
        )
      )
    );

  for(
    let i=0;
    i<playerCount;
    i++
  ){

    const p=
      makePerson(
        "player"
      );

    const el=
      document.createElement(
        "div"
      );

    el.className=
      "person";

    layer.appendChild(el);

    p.el=el;

    people.push(p);

  }

  for(
    let i=0;
    i<rivalCount;
    i++
  ){

    const p=
      makePerson(
        "rival"
      );

    const el=
      document.createElement(
        "div"
      );

    el.className=
      "person red";

    layer.appendChild(el);

    p.el=el;

    people.push(p);

  }

}

function updatePedestrians(dt){

  people.forEach(p=>{

    if(
      p.state==="APPROACHING_SHOP"||
      p.state==="ENTERING"||
      p.state==="SHOPPING"||
      p.state==="EXITING"
    ){

      p.stateTimer-=dt;

      if(
        p.stateTimer<=0
      ){

        if(
          p.state==="APPROACHING_SHOP"
        ){

          p.state="ENTERING";
          p.stateTimer=0.6;

        }

        else if(
          p.state==="ENTERING"
        ){

          p.state="SHOPPING";

          p.stateTimer=
            3+
            Math.random()*4;

          p.el.classList.add(
            "hidden"
          );

        }

        else if(
          p.state==="SHOPPING"
        ){

          p.state="EXITING";

          p.stateTimer=0.6;

          p.el.classList.remove(
            "hidden"
          );

        }

        else if(
          p.state==="EXITING"
        ){

          p.state="WALKING";

          const route=
            newPersonRoute(
              p.kind,
              p.currentNodeId
            );

          if(route){

            p.waypoints=
              route.path.slice(1);

            p.toShop=false;

          }

        }

      }

      return;

    }

    if(
      !p.waypoints.length
    ){

      const route=
        newPersonRoute(
          p.kind,
          p.currentNodeId
        );

      if(route){

        p.waypoints=
          route.path.slice(1);

        p.toShop=
          route.toShop;

      }

      return;

    }

    const target=
      p.waypoints[0];

    const dx=
      target.x-p.x;

    const dy=
      target.y-p.y;

    const dist=
      Math.hypot(
        dx,
        dy
      );

    const sep=
      pedestrianSeparate(p);

    const move=
      Math.min(
        p.speed*dt,
        dist
      );

    if(dist>0.001){

      let nx=
        p.x+
        (dx/dist)*move+
        sep.ox*dt;

      let ny=
        p.y+
        (dy/dist)*move+
        sep.oy*dt;

      if(
        !CollisionManager
          .isPedestrianBlocked(
            nx,
            ny
          )
      ){

        p.x=nx;
        p.y=ny;

      }else{

        p.x+=
          (dx/dist)*move;

        p.y+=
          (dy/dist)*move;

      }

    }

    if(
      dist<=move+0.05
    ){

      p.currentNodeId=
        target.id||
        p.currentNodeId;

      p.waypoints.shift();

      if(
        !p.waypoints.length&&
        p.toShop&&
        String(
          p.currentNodeId
        ).endsWith("_entrance")
      ){

        p.state=
          "APPROACHING_SHOP";

        p.stateTimer=0.5;

      }

    }

  });

}

let toastTimer=null;

function toast(message){

  const el=
    document.getElementById(
      "toast"
    );

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(
    toastTimer

    );

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

  shop.level++;

  shop.upgrades++;

  shop.condition=
    Math.min(
      100,
      shop.condition+8
    );

  shop.customers+=10;

  shop.stock=
    Math.min(
      100,
      (shop.stock||0)+15

  game.reputation+=2;

  saveGame();

  render();

  openShop(index);

  toast(
    "⬆️ "+
    shop.name+

    state;

  badge.textContent=
    state.replace(
      "_",
      " "
    );

}

function clearBadges(el){

  const s=
    el.querySelector(
      ".stockBadge"
    );

  if(s)
    s.remove();

  const st=
    el.querySelector(
      ".stateBadge"
    );

  if(st)
    st.remove();

}

/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvent(){

  if(Math.random()>0.12)
    return;

  const events=[

    {
      text:
        "🛍️ Shopping boom! Customers flood the city.",
      cash:500,
      customers:15
    },

    {
      text:
        "🚚 Supplier discount! Your delivery was cheap.",
      cash:300,
      customers:8
    },

    {
      text:
        "📺 Your shop appeared on TV!",
      cash:250,
      customers:12
    },

    {
      text:
        "⚡ Electricity bill!",
      cash:-150,
      customers:-4
    },

    {
      text:
        "🎉 City festival!",
      cash:700,
      customers:20
    }

  ];

  const event=
    events[
      Math.floor(
        Math.random()*
        events.length
      )
    ];

  game.cash+=
    event.cash;

  game.customers=
    Math.max(
      0,
      game.customers+
      event.customers
    );

  game.stores.forEach(
    shop=>{

      shop.customers=
        Math.max(
          1,
          shop.customers+
          event.customers/
          Math.max(
            1,
            game.stores.length
          )
        );

    }
  );

  saveGame();

  render();

  toast(
    event.text
  );

}

/* =========================================================
   MAIN LOOP
========================================================= */

let lastLoop=
  performance.now();

function gameLoop(now){

  const dt=
    Math.min(
      0.25,
      (now-lastLoop)/1000
    );

  lastLoop=now;

  game.cash+=
    getIncome()*dt;

  updateCustomers(dt);
  updateStock(dt);
  updateRival(dt);

  updateCars(dt);
  updatePedestrians(dt);
  updateDeliveries(dt);

  renderCars();
  renderPedestrians();
  renderRival();

  requestAnimationFrame(
    gameLoop
  );

}

/* =========================================================
   TOP RENDER
========================================================= */

function render(){

  document.getElementById(
    "companyName"
  ).textContent=
    game.company;

  document.getElementById(
    "cash"
  ).textContent=
    "£"+
    Math.floor(
      game.cash
    ).toLocaleString();

  document.getElementById(
    "income"
  ).textContent=
    "£"+
    getIncome().toFixed(1)+
    "/s";

  document.getElementById(
    "customers"
  ).textContent=
    Math.floor(
      game.customers
    );

  document.getElementById(
    "market"
  ).textContent=
    game.marketShare.toFixed(1)+
    "%";

  document.getElementById(
    "reputation"
  ).textContent=
    Math.floor(
      game.reputation
    );

  renderBuildings();

  renderRival();

  if(DEBUG_MODE)
    renderDebug();

}

/* =========================================================
   STARTUP
========================================================= */

function initGame(){

  loadGame();

  offlineIncome();

  rivalAI();

  CollisionManager
    .refreshColliders();

  render();

  createCars();

  createPeople();

  saveGame();

  validateCity();

  setTimeout(
    ()=>{
      render();
      createPeople();
    },
    600
  );

  toast(
    "👑 Welcome to King's Mart Tycoon!"
  );

}

/* DEBUG TAP */
document.getElementById(
  "logoTap"
).addEventListener(
  "click",
  ()=>{

    logoTapCount++;

    clearTimeout(
      logoTapTimer
    );

    logoTapTimer=
      setTimeout(
        ()=>{
          logoTapCount=0;
        },
        1500
      );

    if(
      logoTapCount>=5
    ){

      logoTapCount=0;

      toggleDebug();

    }

  }
);

window.toggleDebug=
  toggleDebug;

/* TIMERS */

setInterval(
  ()=>{
    createPeople();
  },
  22000
);

setInterval(
  ()=>{
    randomEvent();
  },
  30000
);

setInterval(
  ()=>{
    saveGame();
  },
  5000
);

setInterval(
  ()=>{
    render();
  },
  1000
);

/* START */

initGame();

requestAnimationFrame(
  t=>{
    lastLoop=t;

    requestAnimationFrame(
      gameLoop
    );

  }
);

</script>

</body>
</html>
